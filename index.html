<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brand:#16a34a;--brand-dark:#15803d;--brand-light:#dcfce7;--brand-lighter:#f0fdf4;--loss:#dc2626;--profit:#16a34a;--warn:#f59e0b;--s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s600:#475569;--s700:#334155;--s800:#1e293b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--s50);color:var(--s800);font-size:14px;line-height:1.5}
a{color:var(--brand-dark);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-weight:500;border:0;cursor:pointer;font-size:13px}
.btn-primary{background:var(--brand);color:#fff}
.btn-ghost{background:var(--s100);color:var(--s700)}
.btn-sm{padding:5px 10px;font-size:12px}
.input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--s200);background:#fff;outline:none;font-size:13px}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.label{display:block;font-size:12px;font-weight:500;color:var(--s600);margin-bottom:4px}
.card{background:#fff;border-radius:14px;border:1px solid var(--s100);padding:16px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--s500);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--s200);font-size:12px}
td{padding:10px 6px;border-bottom:1px solid var(--s100)}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--s200);padding:16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand-text{font-size:14px;font-weight:700;color:var(--brand-dark);line-height:1.1}
.nav{flex:1;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--s600);font-size:13px}
.nav a.active{background:var(--brand-light);color:var(--brand-dark);font-weight:500}
.main{flex:1;padding:20px;max-width:1200px;width:100%;margin:0 auto;min-width:0}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto}
.toast{background:var(--s800);color:#fff;padding:10px 16px;border-radius:10px;margin-bottom:8px;font-size:13px}
.toast-error{background:var(--loss)}.toast-success{background:var(--profit)}
#toast-root{position:fixed;bottom:20px;right:20px;z-index:200}
.mini-stat{background:var(--s50);padding:10px;border-radius:10px}
.mini-stat .lbl{font-size:11px;color:var(--s500)}
.mini-stat .val{font-weight:700;margin-top:2px}
.page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--brand-lighter),var(--brand-light));padding:16px}
.login-box{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--s500)}
.spinner{width:36px;height:36px;border:3px solid var(--s200);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;margin-right:12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:768px){.sidebar{display:none}.main{padding:12px}}
@media(max-width:768px){.sidebar{display:none}.modal{width:100%!important;max-width:100%!important;padding:15px!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
/* ============ ERROR VISIBILITY ============ */
window.addEventListener('error', function(e){
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:8px;font-size:11px;font-family:monospace;z-index:99999';
  el.textContent = 'ERR: ' + (e.message||'') + ' @ line ' + (e.lineno||'?');
  document.body.appendChild(el);
});
window.addEventListener('unhandledrejection', function(e){
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:8px;font-size:11px;font-family:monospace;z-index:99999';
  el.textContent = 'REJ: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
  document.body.appendChild(el);
});

/* ============ SHOP CONFIG ============ */
var SHOP_CONFIG = {
  supabase_url: 'https://ksoawchseiibxmbppyry.supabase.co',
  supabase_key: 'sb_publishable_c2b_cI0PxZfQOoOTgt31fg_m4ydm2ZK',
  invoice_prefix: 'IN'
};

/* ============ HELPERS ============ */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtNum(n){ var v = Number(n||0); return v % 1 === 0 ? String(v) : v.toFixed(2); }
function fmtDate(d){ if(!d) return '-'; var s = String(d).slice(0,10); return new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function inr(n){
  var num = Number(n||0), neg = num < 0, s = Math.abs(num).toFixed(2);
  var parts = s.split('.'), intPart = parts[0], dec = parts[1];
  if(intPart.length > 3){
    var last3 = intPart.slice(-3), rest = intPart.slice(0,-3);
    intPart = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  }
  return (neg?'-':'') + intPart + '.' + dec;
}
function rs(n){ return '\u20B9' + inr(n); }
function toast(msg, type){
  var el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' toast-error' : (type === 'success' ? ' toast-success' : ''));
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(function(){ el.remove(); }, 3500);
}
function openModal(html, onMount){
  var root = $('#modal-root');
  root.innerHTML = '<div class="modal-overlay"><div class="modal">' + html + '</div></div>';
  root.querySelector('.modal-overlay').addEventListener('click', function(e){
    if(e.target.classList.contains('modal-overlay')) closeModal();
  });
  if(onMount) onMount(root);
}
function closeModal(){ $('#modal-root').innerHTML = ''; }
function confirmDlg(msg, title){ return confirm((title ? title + '\n\n' : '') + msg); }

/* ============ SUPABASE ============ */
var sb = supabase.createClient(SHOP_CONFIG.supabase_url, SHOP_CONFIG.supabase_key);

var DB = {
  customers:[], retailers:[], products:[], invoices:[], invoice_items:[],
  payments:[], settings:null
};
var SESSION = null;
var SETTINGS = { shop_name:'', owner_name:'', address:'', license:'', upi:'', phone:'', email:'', logo:'' };

async function syncDB(){
  var results = await Promise.all([
    sb.from('customers').select('*').order('name'),
    sb.from('retailers').select('*').order('name'),
    sb.from('products').select('*').order('name'),
    sb.from('invoices').select('*').order('invoice_date',{ascending:false}),
    sb.from('invoice_items').select('*'),
    sb.from('payments').select('*').order('payment_date',{ascending:false}),
    sb.from('settings').select('*').maybeSingle()
  ]);
  DB.customers = results[0].data || [];
  DB.retailers = results[1].data || [];
  DB.products = results[2].data || [];
  DB.invoices = results[3].data || [];
  DB.invoice_items = results[4].data || [];
  DB.payments = results[5].data || [];
  var sett = results[6];
  if(sett.data){
    SETTINGS = {
      shop_name: sett.data.shop_name || '',
      owner_name: sett.data.owner_name || '',
      address: sett.data.address || '',
      license: sett.data.license || '',
      upi: sett.data.upi || '',
      phone: sett.data.phone || '',
      email: sett.data.email || '',
      logo: sett.data.logo || ''
    };
  } else {
    await sb.from('settings').upsert({ shop_name:'', owner_name:'', address:'', license:'', upi:'', phone:'', email:'', logo:'' });
  }
}

/* ============ PRODUCT / BUYER HELPERS ============ */
function productLevels(p){
  var levels = [{ level:1, name:p.unit1_name, size:1, price:Number(p.price1)||0 }];
  if(p.unit2_name && Number(p.unit2_size) > 0){
    levels.push({ level:2, name:p.unit2_name, size:Number(p.unit2_size), price:Number(p.price2)||0 });
  }
  if(p.unit3_name && Number(p.unit3_size) > 0){
    levels.push({ level:3, name:p.unit3_name, size:Number(p.unit3_size), price:Number(p.price3)||0 });
  }
  return levels;
}
function productStockLabel(p){
  return fmtNum(p.stock) + ' ' + p.unit1_name + (Number(p.stock) === 1 ? '' : 's');
}
function isLowStock(p){ return Number(p.stock) <= Number(p.low_stock_alert); }
function isOutOfStock(p){ return Number(p.stock) <= 0; }

function computeBuyerStats(type, id){
  var invKey = type === 'customer' ? 'customer_id' : 'retailer_id';
  var invs = DB.invoices.filter(function(i){ return i[invKey] === id; });
  var pays = DB.payments.filter(function(p){ return p[invKey] === id && p.buyer_type === type; });
  var total_bought = invs.reduce(function(s,i){ return s + Number(i.total||0); }, 0);
  var total_paid = pays.reduce(function(s,p){ return s + Number(p.amount||0); }, 0);
  var due = Math.max(0, total_bought - total_paid);
  var rating = 5;
  if(total_bought > 0){
    rating = (total_paid / total_bought) * 5;
    if(due > 0){
      var d = due / total_bought;
      if(d > 0.5) rating -= 1.5;
      else if(d > 0.25) rating -= 0.8;
    }
    rating = Math.max(1, Math.min(5, Math.round(rating*10)/10));
  }
  return { total_bought: total_bought, total_paid: total_paid, due: due, rating: rating };
}

function nextInvoiceNo(){
  var max = 0;
  DB.invoices.forEach(function(inv){
    var m = String(inv.invoice_no||'').match(/(\d+)/);
    if(m){ var n = parseInt(m[1]); if(n > max) max = n; }
  });
  return SHOP_CONFIG.invoice_prefix + '-' + String(max + 1).padStart(3, '0');
}

/* ============ AUTH ============ */
async function initAuth(){
  var res = await sb.auth.getSession();
  SESSION = res.data.session;
  sb.auth.onAuthStateChange(function(_e, s){ SESSION = s; });
}
async function login(email, password){
  var res = await sb.auth.signInWithPassword({ email: email, password: password });
  if(res.error) throw res.error;
  var ses = await sb.auth.getSession();
  SESSION = ses.data.session;
}
async function logout(){
  await sb.auth.signOut();
  SESSION = null;
  location.hash = '#/';
  route();
}

/* ============ LOGIN ============ */
function renderLogin(){
  $('#app').innerHTML = '<div class="login-page">' +
    '<form id="login-form" class="card login-box">' +
    '<div style="text-align:center"><div style="font-size:28px;font-weight:700;color:var(--brand-dark)">Shop Manager</div>' +
    '<p style="color:var(--s500);font-size:12px;margin-top:4px">Owner login</p></div>' +
    '<div><label class="label">Email</label><input class="input" type="email" id="l-email" required></div>' +
    '<div><label class="label">Password</label><input class="input" type="password" id="l-pwd" required></div>' +
    '<div id="l-err" style="color:var(--loss);font-size:12px;display:none"></div>' +
    '<button class="btn btn-primary" type="submit" style="justify-content:center" id="l-btn">Sign in</button>' +
    '</form></div>';
  $('#login-form').onsubmit = async function(e){
    e.preventDefault();
    var errEl = $('#l-err'); errEl.style.display = 'none';
    var btn = $('#l-btn'); btn.disabled = true; btn.textContent = 'Signing in...';
    try{
      await login($('#l-email').value.trim(), $('#l-pwd').value);
      await syncDB();
      await route();
    } catch(err){
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  };
}

/* ============ LAYOUT ============ */
function renderLayout(){
  var links = [
    ['#/', 'Dashboard', '&#128202;'],
    ['#/customers', 'Customers', '&#128101;'],
    ['#/retailers', 'Retailers', '&#127978;'],
    ['#/products', 'Products', '&#128230;'],
    ['#/invoices', 'Invoices', '&#128196;'],
    ['#/settings', 'Settings', '&#9881;']
  ];
  var hash = location.hash || '#/';
  var navHTML = links.map(function(l){
    var active = (hash === l[0] || (l[0] !== '#/' && hash.indexOf(l[0]) === 0)) ? 'active' : '';
    return '<a href="' + l[0] + '" class="' + active + '">' + l[2] + ' ' + l[1] + '</a>';
  }).join('');
  $('#app').innerHTML = '<div class="layout">' +
    '<aside class="sidebar">' +
    '<div class="brand"><div style="font-size:32px">&#127806;</div><div class="brand-text">' + esc(SETTINGS.shop_name || 'My Shop') + '</div></div>' +
    '<nav class="nav">' + navHTML + '</nav>' +
    '<button id="btn-logout" class="btn btn-ghost" style="justify-content:center;margin-top:8px;color:var(--loss)">Sign out</button>' +
    '</aside>' +
    '<div style="flex:1;min-width:0">' +
    '<header style="padding:12px 16px;background:#fff;border-bottom:1px solid var(--s200);display:flex;align-items:center;gap:12px">' +
    '<div style="font-weight:700;color:var(--brand-dark)">' + esc(SETTINGS.shop_name || 'Shop Manager') + '</div>' +
    '<div style="flex:1"></div>' +
    '<select id="mob-nav" style="border:1px solid var(--s200);border-radius:8px;padding:6px 10px;background:#fff">' +
    links.map(function(l){ return '<option value="' + l[0] + '">' + l[1] + '</option>'; }).join('') +
    '</select>' +
    '</header>' +
    '<main id="content" class="main"></main>' +
    '</div>' +
    '</div>';
  var mobNav = $('#mob-nav');
  if(mobNav){
    mobNav.value = hash;
    mobNav.onchange = function(){ location.hash = mobNav.value; };
  }
  $('#btn-logout').onclick = logout;
}

/* ============ DASHBOARD ============ */
function renderDashboard(content){
  var totalSales = DB.invoices.reduce(function(s,i){ return s + Number(i.total||0); }, 0);
  var custDue = DB.customers.reduce(function(s,c){ return s + computeBuyerStats('customer', c.id).due; }, 0);
  var retDue = DB.retailers.reduce(function(s,r){ return s + computeBuyerStats('retailer', r.id).due; }, 0);
  var low = DB.products.filter(function(p){ return isLowStock(p); });
  var isNew = !DB.customers.length && !DB.retailers.length && !DB.products.length && !DB.invoices.length;

  if(isNew){
    content.innerHTML = '<div class="card" style="background:var(--brand-lighter);border-color:var(--brand-light);padding:24px">' +
      '<div style="font-size:18px;font-weight:700;color:var(--brand-dark);margin-bottom:8px">Welcome to your shop</div>' +
      '<div style="font-size:13px;color:var(--s600);margin-bottom:16px">Follow these steps to set up:</div>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      '<a href="#/settings" class="card" style="text-decoration:none"><b>1. Set shop details</b><div style="font-size:12px;color:var(--s500)">Name, address, UPI, logo</div></a>' +
      '<a href="#/products" class="card" style="text-decoration:none"><b>2. Add products</b><div style="font-size:12px;color:var(--s500)">Each product can have up to 3 unit levels</div></a>' +
      '<a href="#/customers" class="card" style="text-decoration:none"><b>3. Add customers and retailers</b><div style="font-size:12px;color:var(--s500)">Buyers of your products</div></a>' +
      '<a href="#/invoices" class="card" style="text-decoration:none"><b>4. Create your first invoice</b><div style="font-size:12px;color:var(--s500)">Choose Customer or Retailer</div></a>' +
      '</div></div>';
    return;
  }

  content.innerHTML = '<div class="page-head"><h1 style="font-size:22px;font-weight:700">Dashboard</h1></div>' +
    '<div class="grid-3" style="margin-bottom:16px">' +
    '<div class="card"><div style="font-size:11px;color:var(--s500)">Total Sales</div><div style="font-size:22px;font-weight:700">' + rs(totalSales) + '</div></div>' +
    '<div class="card"><div style="font-size:11px;color:var(--s500)">Customer Due</div><div style="font-size:22px;font-weight:700;color:var(--loss)">' + rs(custDue) + '</div></div>' +
    '<div class="card"><div style="font-size:11px;color:var(--s500)">Retailer Due</div><div style="font-size:22px;font-weight:700;color:var(--warn)">' + rs(retDue) + '</div></div>' +
    '<div class="card"><div style="font-size:11px;color:var(--s500)">Products</div><div style="font-size:22px;font-weight:700">' + DB.products.length + '</div></div>' +
    '<div class="card"><div style="font-size:11px;color:var(--s500)">Customers</div><div style="font-size:22px;font-weight:700">' + DB.customers.length + '</div></div>' +
    '<div class="card"><div style="font-size:11px;color:var(--s500)">Retailers</div><div style="font-size:22px;font-weight:700">' + DB.retailers.length + '</div></div>' +
    '</div>' +
    '<div class="card"><h2 style="font-weight:600;margin-bottom:12px">Low stock alerts</h2>' +
    (low.length === 0 ? '<p style="color:var(--s500);font-size:13px">All products well-stocked</p>' :
      low.slice(0,8).map(function(p){
        return '<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--s100)"><span>' + esc(p.name) + '</span><span style="color:var(--loss);font-weight:500">' + productStockLabel(p) + '</span></div>';
      }).join('')) +
    '</div>';
}

/* ============ CUSTOMERS / RETAILERS (SHARED) ============ */
function renderBuyerList(content, type){
  var isCust = type === 'customer';
  var list = isCust ? DB.customers : DB.retailers;
  var label = isCust ? 'Customers' : 'Retailers';
  content.innerHTML = '<div class="page-head"><h1 style="font-size:22px;font-weight:700">' + label + '</h1>' +
    '<button id="add-b" class="btn btn-primary">+ Add ' + (isCust ? 'Customer' : 'Retailer') + '</button></div>' +
    '<div id="b-list" class="grid-2"></div>';

  function renderList(){
    var box = $('#b-list');
    if(!list.length){
      box.innerHTML = '<div class="card" style="grid-column:1/-1;text-align:center;padding:40px"><p style="color:var(--s500)">No ' + label.toLowerCase() + ' yet</p></div>';
      return;
    }
    box.innerHTML = list.map(function(x){
      var s = computeBuyerStats(type, x.id);
      return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' +
        '<div style="flex:1;min-width:0"><div style="font-weight:600">' + esc(x.name) + (isCust ? '' : ' ' + (x.shop_name ? '<span style="color:var(--s500);font-weight:400">- ' + esc(x.shop_name) + '</span>' : '')) + '</div>' +
        '<div style="font-size:11px;color:var(--s500);margin-top:2px">' + esc(x.phone || '') + '</div>' +
        '<div class="grid-3" style="margin-top:10px">' +
        '<div class="mini-stat"><div class="lbl">Bought</div><div class="val">' + rs(s.total_bought) + '</div></div>' +
        '<div class="mini-stat"><div class="lbl">Paid</div><div class="val" style="color:var(--profit)">' + rs(s.total_paid) + '</div></div>' +
        '<div class="mini-stat"><div class="lbl">Due</div><div class="val" style="color:' + (s.due > 0 ? 'var(--loss)' : 'var(--s500)') + '">' + rs(s.due) + '</div></div>' +
        '</div></div>' +
        '<div style="display:flex;flex-direction:column;gap:4px">' +
        '<button class="btn btn-ghost btn-sm" data-edit="' + x.id + '">Edit</button>' +
        '<button class="btn btn-ghost btn-sm" data-del="' + x.id + '" style="color:var(--loss)">Del</button>' +
        '</div></div></div>';
    }).join('');
    $$('[data-edit]', box).forEach(function(b){ b.onclick = function(){
      var x = list.find(function(y){ return y.id === b.dataset.edit; });
      openBuyerForm(type, x);
    };});
    $$('[data-del]', box).forEach(function(b){ b.onclick = async function(){
      var x = list.find(function(y){ return y.id === b.dataset.del; });
      if(!confirmDlg('Delete ' + (x ? x.name : 'this ' + type) + '?', 'Confirm')) return;
      await sb.from(isCust ? 'customers' : 'retailers').delete().eq('id', b.dataset.del);
      await syncDB();
      toast('Deleted', 'success');
      route();
    };});
  }
  renderList();
  $('#add-b').onclick = function(){ openBuyerForm(type, null); };
}

function openBuyerForm(type, existing){
  var isCust = type === 'customer';
  var x = existing || { name:'', shop_name:'', phone:'', address:'', gst:'', joined_date: todayStr() };
  var html = '<h2 style="margin-bottom:14px">' + (existing ? 'Edit' : 'New') + ' ' + (isCust ? 'Customer' : 'Retailer') + '</h2>' +
    '<form id="bf" style="display:flex;flex-direction:column;gap:12px">' +
    '<div><label class="label">Name *</label><input class="input" name="name" required value="' + esc(x.name||'') + '"></div>' +

        '</div></div>';

function openProductForm(existing){
  var p = existing || { name:'', category:'', unit1_name:'', price1:0, unit2_name:'', unit2_size:0, price2:0, unit3_name:'', unit3_size:0, price3:0, stock:0, cost:0, low_stock_alert:5 };
  var units = ['gram','ml','piece','kg','lit','dozen','bottle','packet','pouch','sachet','tin','tube','can','jar','bag','box','pack','tray','bundle','quintal','sack','case','carton','drum','ton'];
  function unitOpts(cur){ return '<option value="">- Select -</option>' + units.map(function(u){ return '<option value="' + u + '"' + (cur === u ? ' selected' : '') + '>' + u + '</option>'; }).join(''); }
  var cats = ['Insecticide','Fungicide','Herbicide','Spreader','PGR','Bio stimulant','Fertilizer','Micro Nutrient','Seed','Equipment','Other'];
  var hasL2 = !!(p.unit2_name && Number(p.unit2_size) > 0);
  var hasL3 = !!(p.unit3_name && Number(p.unit3_size) > 0);
  var html = '<h2 style="margin-bottom:12px">' + (existing ? 'Edit' : 'New') + ' Product</h2>' +
    '<form id="prf" style="display:flex;flex-direction:column;gap:12px">' +
    '<div><label class="label">Name *</label><input class="input" name="name" required value="' + esc(p.name) + '"></div>' +
    '<div><label class="label">Category</label><select class="input" name="category"><option value="">- Select -</option>' +
    cats.map(function(c){ return '<option' + (p.category === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="card" style="background:var(--brand-lighter)">' +
    '<div style="font-size:12px;font-weight:600;color:var(--brand-dark);margin-bottom:8px">LEVEL 1 - Smallest unit</div>' +
    '<div class="grid-2">' +
    '<div><label class="label">Unit name *</label><select class="input" name="unit1_name" required>' + unitOpts(p.unit1_name) + '</select></div>' +
    '<div><label class="label">Sell price *</label><input class="input" type="number" step="any" name="price1" required value="' + (p.price1||0) + '"></div>' +
    '</div></div>' +
    '<div class="card"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="has-l2"' + (hasL2 ? ' checked' : '') + '> Add SECOND level (case, drum...)</label>' +
    '<div id="l2" style="display:' + (hasL2 ? 'block' : 'none') + ';margin-top:10px">' +
    '<div class="grid-2">' +
    '<div><label class="label">Unit name</label><select class="input" name="unit2_name">' + unitOpts(p.unit2_name) + '</select></div>' +
    '<div><label class="label">How many Level-1 units in 1?</label><input class="input" type="number" step="any" name="unit2_size" value="' + (p.unit2_size||0) + '"></div>' +
    '<div><label class="label">Sell price</label><input class="input" type="number" step="any" name="price2" value="' + (p.price2||0) + '"></div>' +
    '</div></div></div>' +
    '<div class="card"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="has-l3"' + (hasL3 ? ' checked' : '') + '> Add THIRD level (drum, sack...)</label>' +
    '<div id="l3" style="display:' + (hasL3 ? 'block' : 'none') + ';margin-top:10px">' +
    '<div class="grid-2">' +
    '<div><label class="label">Unit name</label><select class="input" name="unit3_name">' + unitOpts(p.unit3_name) + '</select></div>' +
    '<div><label class="label">How many Level-1 units in 1?</label><input class="input" type="number" step="any" name="unit3_size" value="' + (p.unit3_size||0) + '"></div>' +
    '<div><label class="label">Sell price</label><input class="input" type="number" step="any" name="price3" value="' + (p.price3||0) + '"></div>' +
    '</div></div></div>' +
    '<div class="grid-2">' +
    '<div><label class="label">Stock (in Level-1 units) *</label><input class="input" type="number" step="any" name="stock" required value="' + (p.stock||0) + '"></div>' +
    '<div><label class="label">Cost per Level-1 unit</label><input class="input" type="number" step="any" name="cost" value="' + (p.cost||0) + '"></div>' +
    '<div><label class="label">Low stock alert</label><input class="input" type="number" name="low_stock_alert" value="' + (p.low_stock_alert||5) + '"></div>' +
    '</div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="prf-save">' + (existing ? 'Update' : 'Save') + '</button>' +
    '</div></form>';
  openModal(html, function(root){
    var l2cb = root.querySelector('#has-l2');
    var l3cb = root.querySelector('#has-l3');
    var l2b = root.querySelector('#l2');
    var l3b = root.querySelector('#l3');
    l2cb.onchange = function(){ l2b.style.display = l2cb.checked ? 'block' : 'none'; };
    l3cb.onchange = function(){ l3b.style.display = l3cb.checked ? 'block' : 'none'; };

    var p1 = root.querySelector('[name="price1"]');
    var s2 = root.querySelector('[name="unit2_size"]');
    var pr2 = root.querySelector('[name="price2"]');
    var s3 = root.querySelector('[name="unit3_size"]');
    var pr3 = root.querySelector('[name="price3"]');
    var p2Touched = false, p3Touched = false;
    pr2.addEventListener('input', function(){ p2Touched = true; });
    pr3.addEventListener('input', function(){ p3Touched = true; });
    function recalc2(){ if(p2Touched) return; pr2.value = ((Number(p1.value)||0) * (Number(s2.value)||0)) || 0; }
    function recalc3(){ if(p3Touched) return; pr3.value = ((Number(p1.value)||0) * (Number(s3.value)||0)) || 0; }
    p1.addEventListener('input', function(){ recalc2(); recalc3(); });
    s2.addEventListener('input', recalc2);
    s3.addEventListener('input', recalc3);

    root.querySelector('#prf').onsubmit = async function(e){
      e.preventDefault();
      var fd = new FormData(e.target);
      var name = (fd.get('name')||'').trim();
      if(!name){ toast('Enter product name', 'error'); return; }
      var unit1 = (fd.get('unit1_name')||'').trim();
      if(!unit1){ toast('Select Level 1 unit', 'error'); return; }
      var has2 = l2cb.checked, has3 = l3cb.checked;
      if(has2){
        if(!(fd.get('unit2_name')||'').trim()){ toast('Select Level 2 unit', 'error'); return; }
        if(Number(fd.get('unit2_size')) <= 0){ toast('Level 2 size must be > 0', 'error'); return; }
      }
      if(has3){
        if(!(fd.get('unit3_name')||'').trim()){ toast('Select Level 3 unit', 'error'); return; }
        if(Number(fd.get('unit3_size')) <= 0){ toast('Level 3 size must be > 0', 'error'); return; }
      }
      var data = {
        name: name,
        category: fd.get('category') || '',
        unit1_name: unit1,
        price1: Number(fd.get('price1')) || 0,
        unit2_name: has2 ? (fd.get('unit2_name')||'').trim() : null,
        unit2_size: has2 ? (Number(fd.get('unit2_size')) || 0) : null,
        price2: has2 ? (Number(fd.get('price2')) || 0) : 0,
        unit3_name: has3 ? (fd.get('unit3_name')||'').trim() : null,
        unit3_size: has3 ? (Number(fd.get('unit3_size')) || 0) : null,
        price3: has3 ? (Number(fd.get('price3')) || 0) : 0,
        stock: Number(fd.get('stock')) || 0,
        cost: Number(fd.get('cost')) || 0,
        low_stock_alert: Number(fd.get('low_stock_alert')) || 0,
        primary_level: 1
      };
      var btn = root.querySelector('#prf-save');
      btn.disabled = true; btn.textContent = 'Saving...';
      var result;
      if(existing) result = await sb.from('products').update(data).eq('id', existing.id);
      else result = await sb.from('products').insert(data);
      if(result.error){ toast(result.error.message, 'error'); btn.disabled = false; btn.textContent = 'Save'; return; }
      await syncDB();
      toast(existing ? 'Updated' : 'Added', 'success');
      closeModal(); route();
    };
  });
}

function renderInvoices(content){

        if(p){

function renderNewInvoice(content){
  var buyerType = 'customer';
  var lines = [];
  content.innerHTML = '<div class="page-head"><h1 style="font-size:22px;font-weight:700">New Invoice</h1></div>' +
    '<div class="card" style="display:flex;flex-direction:column;gap:14px">' +
    '<div><label class="label">Invoice for *</label>' +
    '<div style="display:flex;gap:8px"><button type="button" class="btn btn-primary" data-bt="customer" id="bt-c" style="flex:1;justify-content:center">Customer</button>' +
    '<button type="button" class="btn btn-ghost" data-bt="retailer" id="bt-r" style="flex:1;justify-content:center">Retailer</button></div></div>' +
    '<div><label class="label">Date</label><input class="input" type="date" id="nv-date" value="' + todayStr() + '"></div>' +
    '<div><label class="label" id="buyer-label">Customer</label><select class="input" id="nv-buyer"></select></div>' +
    '<div><label class="label">Add item</label><select class="input" id="nv-product"></select></div>' +
    '<div id="nv-lines"></div>' +
    '<div class="grid-2">' +
    '<div><label class="label">Discount</label><input class="input" type="number" step="0.01" id="nv-disc" value="0"></div>' +
    '<div><label class="label">Paid now</label><input class="input" type="number" step="0.01" id="nv-paid" value="0"></div>' +
    '</div>' +
    '<div id="nv-summary" style="background:var(--s50);padding:12px;border-radius:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"></div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<a href="#/invoices" class="btn btn-ghost">Cancel</a>' +
    '<button id="nv-save" class="btn btn-primary">Save Invoice</button>' +
    '</div></div>';

  function refreshBuyerList(){
    var sel = $('#nv-buyer');
    var list = buyerType === 'customer' ? DB.customers : DB.retailers;
    sel.innerHTML = '<option value="">- Walk-in -</option>' + list.map(function(x){ return '<option value="' + x.id + '">' + esc(x.name) + '</option>'; }).join('');
    $('#buyer-label').textContent = buyerType === 'customer' ? 'Customer' : 'Retailer';
  }
  function refreshProductList(){
    var sel = $('#nv-product');
    sel.innerHTML = '<option value="">- Select product -</option>' + DB.products.map(function(p){ return '<option value="' + p.id + '">' + esc(p.name) + ' (' + productStockLabel(p) + ')</option>'; }).join('');
  }
  refreshBuyerList();
  refreshProductList();

  $('#bt-c').onclick = function(){ buyerType = 'customer'; $('#bt-c').className='btn btn-primary'; $('#bt-r').className='btn btn-ghost'; refreshBuyerList(); lines=[]; renderLines(); };
  $('#bt-r').onclick = function(){ buyerType = 'retailer'; $('#bt-r').className='btn btn-primary'; $('#bt-c').className='btn btn-ghost'; refreshBuyerList(); lines=[]; renderLines(); };

  $('#nv-product').onchange = function(){
    var pid = this.value;
    if(!pid) return;
    var p = DB.products.find(function(x){ return x.id === pid; });
    if(!p) return;
    var levels = productLevels(p);
    var allowed = buyerType === 'customer' ? levels.filter(function(l){ return l.level === 1; }) : levels;
    var lvl = allowed[0];
    lines.push({
      product_id: p.id, product_name: p.name,
      unit_level: lvl.level, unit_name: lvl.name, unit_size: lvl.size,
      qty: 1, price: lvl.price, total: lvl.price
    });
    this.value = '';
    renderLines();
  };

  function renderLines(){
    var box = $('#nv-lines');
    if(!lines.length){ box.innerHTML = '<p style="color:var(--s400);font-size:13px">No items added yet</p>'; updateSummary(); return; }
    box.innerHTML = '<table style="font-size:13px"><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Price</th><th style="text-align:right">Total</th><th></th></tr></thead><tbody>' +
      lines.map(function(l, i){
        var p = DB.products.find(function(x){ return x.id === l.product_id; });
        var levels = productLevels(p);
        var allowed = buyerType === 'customer' ? levels.filter(function(x){ return x.level === 1; }) : levels;
        var unitCell = allowed.length > 1
          ? '<select class="input" data-i="' + i + '" data-f="unit">' + allowed.map(function(x){ return '<option value="' + x.level + '"' + (l.unit_level === x.level ? ' selected' : '') + '>' + esc(x.name) + (x.level > 1 ? ' (' + fmtNum(x.size) + ' ' + esc(p.unit1_name) + ')' : '') + '</option>'; }).join('') + '</select>'
          : '<span>' + esc(l.unit_name) + '</span>';
        return '<tr>' +
          '<td>' + esc(l.product_name) + '</td>' +
          '<td><input class="input" type="number" step="0.01" data-i="' + i + '" data-f="qty" value="' + l.qty + '" style="width:70px"></td>' +
          '<td>' + unitCell + '</td>' +
          '<td><input class="input" type="number" step="0.01" data-i="' + i + '" data-f="price" value="' + l.price + '" style="width:90px"></td>' +
          '<td style="text-align:right">' + rs(l.total) + '</td>' +
          '<td><button class="btn btn-ghost btn-sm" data-del="' + i + '" style="color:var(--loss)">X</button></td>' +
          '</tr>';
      }).join('') + '</tbody></table>';
    $$('input[data-i]', box).forEach(function(inp){ inp.oninput = function(e){
      var i = +e.target.dataset.i, f = e.target.dataset.f;
      lines[i][f] = Number(e.target.value);
      lines[i].total = lines[i].qty * lines[i].price;
      renderLines();
    };});
    $$('select[data-i]', box).forEach(function(sel){ sel.onchange = function(e){
      var i = +e.target.dataset.i;
      var p = DB.products.find(function(x){ return x.id === lines[i].product_id; });
      var levels = productLevels(p);
      var lvl = levels.find(function(x){ return x.level === Number(e.target.value); });
      lines[i].unit_level = lvl.level;
      lines[i].unit_name = lvl.name;
      lines[i].unit_size = lvl.size;
      lines[i].price = lvl.price;
      lines[i].total = lines[i].qty * lines[i].price;
      renderLines();
    };});
    $$('[data-del]', box).forEach(function(b){ b.onclick = function(){
      lines.splice(+b.dataset.del, 1);
      renderLines();
    };});
    updateSummary();
  }
  function updateSummary(){
    var sub = lines.reduce(function(s,l){ return s + l.total; }, 0);
    var d = Number($('#nv-disc').value) || 0;
    var tt = Math.max(0, sub - d);
    var pp = Number($('#nv-paid').value) || 0;
    var dd = Math.max(0, tt - pp);
    $('#nv-summary').innerHTML = '<div>Subtotal: ' + rs(sub) + '</div><div style="font-weight:700">Total: ' + rs(tt) + '</div><div style="color:var(--loss)">Due: ' + rs(dd) + '</div>';
  }
  $('#nv-disc').oninput = updateSummary;
  $('#nv-paid').oninput = updateSummary;
  renderLines();

  $('#nv-save').onclick = async function(){
    if(!lines.length){ toast('Add at least one item', 'error'); return; }
    for(var i = 0; i < lines.length; i++){
      var l = lines[i];
      var p = DB.products.find(function(x){ return x.id === l.product_id; });
      if(!p) continue;
      var need = Number(l.qty) * Number(l.unit_size || 1);
      if(Number(p.stock) < need){ toast('Not enough stock: ' + p.name + ' (need ' + need + ')', 'error'); return; }
    }
    var buyerId = $('#nv-buyer').value || null;
    var disc = Number($('#nv-disc').value) || 0;
    var paid = Number($('#nv-paid').value) || 0;
    var subtotal = lines.reduce(function(s,l){ return s + l.total; }, 0);
    var total = Math.max(0, subtotal - disc);
    var due = Math.max(0, total - paid);
    var btn = $('#nv-save'); btn.disabled = true; btn.textContent = 'Saving...';
    var invData = {
      invoice_no: nextInvoiceNo(),
      buyer_type: buyerType,
      customer_id: buyerType === 'customer' ? buyerId : null,
      retailer_id: buyerType === 'retailer' ? buyerId : null,
      subtotal: subtotal, discount: disc, total: total, paid: paid, due: due,
      invoice_date: $('#nv-date').value
    };
    var res = await sb.from('invoices').insert(invData).select().single();
    if(res.error){ toast(res.error.message, 'error'); btn.disabled = false; btn.textContent = 'Save Invoice'; return; }
    var inv = res.data;
    var itemRows = lines.map(function(l){
      return { invoice_id: inv.id, product_id: l.product_id, product_name: l.product_name, unit_level: l.unit_level, unit_name: l.unit_name, unit_size: l.unit_size, qty: l.qty, price: l.price, total: l.total };
    });
    await sb.from('invoice_items').insert(itemRows);
    for(var j = 0; j < lines.length; j++){
      var l2 = lines[j];
      var p2 = DB.products.find(function(x){ return x.id === l2.product_id; });
      if(p2){
        var ded = Number(l2.qty) * Number(l2.unit_size || 1);
        await sb.from('products').update({ stock: Number(p2.stock) - ded }).eq('id', p2.id);
      }
    }
    await syncDB();
    toast('Invoice saved', 'success');
    location.hash = '#/invoices';
  };
}

/* ============ ROUTER ============ */
async function route(){
  var hash = location.hash || '#/';
  if(!SESSION){ renderLogin(); return; }
  renderLayout();
  var content = $('#content');
  try{
    if(hash === '#/' || hash === '') renderDashboard(content);
    else if(hash === '#/customers') renderBuyerList(content, 'customer');
    else if(hash === '#/retailers') renderBuyerList(content, 'retailer');
    else if(hash === '#/products') renderProducts(content);
    else if(hash === '#/invoices') renderInvoices(content);
    else if(hash === '#/invoice/new') renderNewInvoice(content);
    else if(hash.indexOf('#/invoice/') === 0) renderInvoiceView(content, hash.slice(10));
    else if(hash === '#/settings') renderSettings(content);
    else renderDashboard(content);
  } catch(err){
    console.error(err);
    content.innerHTML = '<div class="card" style="color:var(--loss)">Error: ' + esc(err.message || String(err)) + '</div>';
  }
}
window.addEventListener('hashchange', route);

/* ============ BOOT ============ */
(async function(){
  try{
    $('#app').innerHTML = '<div class="loading"><div class="spinner"></div><div>Connecting...</div></div>';
    await initAuth();
    if(SESSION){ await syncDB(); }
  } catch(e){ console.error('boot', e); }
  await route();
})();

<script>
(function(){

  if(!window.DB) window.DB = {};

  if(!Array.isArray(DB.supplier_invoices)) DB.supplier_invoices = [];
  if(!Array.isArray(DB.supplier_payments)) DB.supplier_payments = [];
  var loaded = false;

  // ---- SUPABASE ----
  async function syncSuppliers(){
    var res = await Promise.all([
      sb.from('suppliers').select('*').order('name'),
      sb.from('supplier_invoices').select('*').order('bill_date', { ascending:false }),
      sb.from('supplier_payments').select('*').order('payment_date', { ascending:false })
    ]);

    DB.supplier_invoices = res[1].data || [];
    DB.supplier_payments = res[2].data || [];
    loaded = true;
  }

  function supplierTotals(sid){
    var sup = DB.suppliers.find(function(s){ return s.id === sid; });
    var bills = DB.supplier_invoices.filter(function(b){ return b.supplier_id === sid; });
    var pays  = DB.supplier_payments.filter(function(p){ return p.supplier_id === sid; });
    var total_purchase = bills.reduce(function(s,b){ return s + Number(b.total||0); }, 0);
    var bill_paid      = bills.reduce(function(s,b){ return s + Number(b.paid||0); }, 0);
    var extra_paid     = pays.reduce(function(s,p){ return s + Number(p.amount||0); }, 0);
    var total_paid     = bill_paid + extra_paid;
    var opening        = Number(sup ? sup.opening_balance : 0) || 0;
    var total_due      = Math.max(0, opening + total_purchase - total_paid);
    return { total_purchase: total_purchase, total_paid: total_paid, total_due: total_due, opening: opening };
  }

      '<div><label class="label">Notes</label><input class="input" name="notes" value="' + esc(b.notes||'') + '"></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end">' +
      '<button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" id="bill-save">' + (existing ? 'Update' : 'Save') + '</button>' +
      '</div></form>';
    openModal(html, function(root){
      var sub = root.querySelector('#bill-sub');
      var disc = root.querySelector('#bill-disc');
      var tot = root.querySelector('#bill-total');
      function recalc(){ tot.value = Math.max(0, (Number(sub.value)||0) - (Number(disc.value)||0)); }
      sub.oninput = disc.oninput = recalc;
      root.querySelector('#bill-form').onsubmit = async function(e){
        e.preventDefault();
        var fd = new FormData(e.target);
        var data = {
          supplier_id: s.id,
          bill_no: fd.get('bill_no')||'',
          bill_date: fd.get('bill_date'),
          subtotal: Number(fd.get('subtotal'))||0,
          discount: Number(fd.get('discount'))||0,
          total: Number(fd.get('total'))||0,
          paid: Number(fd.get('paid'))||0,
          notes: fd.get('notes')||''
        };
        var btn = root.querySelector('#bill-save');
        btn.disabled = true; btn.textContent = 'Saving...';
        var result;
        if(existing) result = await sb.from('supplier_invoices').update(data).eq('id', existing.id);
        else result = await sb.from('supplier_invoices').insert(data);
        if(result.error){ toast(result.error.message, 'error'); btn.disabled = false; btn.textContent = 'Save'; return; }
        await syncSuppliers();
        toast(existing ? 'Updated' : 'Bill added', 'success');
        closeModal(); route();
      };
    });
  }

  // ---- SUPPLIER PAYMENT ----
  function openSupPaymentForm(s){
    var html = '<h2 style="font-size:16px;font-weight:600;margin-bottom:6px">Pay to Supplier</h2>' +
      '<div style="font-size:12px;color:var(--s500);margin-bottom:14px">To: <b>' + esc(s.name) + '</b></div>' +
      '<form id="spp-form" style="display:flex;flex-direction:column;gap:12px">' +
      '<div><label class="label">Payment Date *</label><input class="input" type="date" name="payment_date" required value="' + todayStr() + '"></div>' +
      '<div><label class="label">Amount (Rs.)</label><input class="input" type="number" step="0.01" name="amount" required autofocus></div>' +
      '<div><label class="label">Mode</label><select class="input" name="mode"><option>cash</option><option>upi</option><option>bank</option><option>cheque</option></select></div>' +
      '<div><label class="label">Notes</label><input class="input" name="notes"></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end">' +
      '<button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" id="spp-save">Save</button>' +
      '</div></form>';
    openModal(html, function(root){
      root.querySelector('#spp-form').onsubmit = async function(e){
        e.preventDefault();
        var fd = new FormData(e.target);
        var btn = root.querySelector('#spp-save');
        btn.disabled = true; btn.textContent = 'Saving...';
        var res = await sb.from('supplier_payments').insert({
          supplier_id: s.id,
          amount: Number(fd.get('amount'))||0,
          mode: fd.get('mode'),
          notes: fd.get('notes')||'',
          payment_date: fd.get('payment_date')
        });
        if(res.error){ toast(res.error.message, 'error'); btn.disabled = false; btn.textContent = 'Save'; return; }
        await syncSuppliers();
        toast('Payment recorded', 'success');
        closeModal(); route();
      };
    });
  }

  // ---- PURCHASES LIST ----
  function renderPurchases(content){
    var list = DB.supplier_invoices.slice().sort(function(a,b){ return (b.bill_date||'').localeCompare(a.bill_date||''); });
    content.innerHTML = '<div class="page-head"><h1 style="font-size:22px;font-weight:700">Purchases - All Bills</h1></div>' +
      '<div class="card" style="overflow-x:auto"><table><thead><tr>' +
      '<th>Bill No</th><th>Supplier</th><th>Date</th>' +
      '<th style="text-align:right">Total</th>' +
      '<th style="text-align:right">Paid</th>' +
      '<th style="text-align:right">Balance</th>' +
      '</tr></thead><tbody id="pur-body"></tbody></table></div>';

    var body = document.getElementById('pur-body');
    if(!list.length){
      body.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--s500)">No purchases yet</td></tr>';
      return;
    }
    body.innerHTML = list.map(function(b){
      var sup = DB.suppliers.find(function(s){ return s.id === b.supplier_id; });
      var bal = Number(b.total) - Number(b.paid);
      return '<tr>' +
        '<td>' + esc(b.bill_no || '-') + '</td>' +
        '<td><a href="#/supplier/' + b.supplier_id + '" style="font-weight:500">' + esc(sup ? sup.name : '-') + '</a></td>' +
        '<td>' + fmtDate(b.bill_date) + '</td>' +
        '<td style="text-align:right">' + rs(b.total) + '</td>' +
        '<td style="text-align:right;color:var(--profit)">' + rs(b.paid) + '</td>' +
        '<td style="text-align:right;color:' + (bal > 0 ? 'var(--loss)' : 'var(--s500)') + ';font-weight:' + (bal > 0 ? '600' : '400') + '">' + rs(bal) + '</td>' +
        '</tr>';
    }).join('');
  }

  // ---- ROUTE HOOK ----
  var _origRoute = window.route;
  if(typeof _origRoute === 'function'){
    window.route = async function(){
      var hash = location.hash || '#/';
      if(typeof SESSION === 'undefined' || !SESSION){
        return _origRoute.apply(this, arguments);
      }
      if(!loaded){
        try{ await syncSuppliers(); } catch(e){ console.warn('syncSuppliers', e); }
      }
      if(hash === '#/suppliers' || hash === '#/purchases' || hash.indexOf('#/supplier/') === 0){
        renderLayout();
        var content = document.getElementById('content');
        if(hash === '#/suppliers') renderSuppliers(content);
        else if(hash === '#/purchases') renderPurchases(content);
        else renderSupplierProfile(content, hash.slice(11));
        injectNav();
        return;
      }
      var ret = await _origRoute.apply(this, arguments);
      injectNav();
      return ret;
    };
    try{ window.removeEventListener('hashchange', _origRoute); } catch(e){}
    window.addEventListener('hashchange', window.route);
  }

  // Boot-time injection for existing pages
  var tries = 0;
  var interval = setInterval(function(){
    tries++;
    if(tries > 40 || (typeof SESSION !== 'undefined' && SESSION)){ clearInterval(interval); injectNav(); }
    else if(typeof SESSION !== 'undefined' && SESSION){ injectNav(); }
    injectNav();
  }, 500);
})();
</script>
<!-- ============================================================
     FEATURE 2: EXPENSES TRACKER
     ============================================================ -->
<script>
(function(){
  'use strict';

  if(!Array.isArray(DB.expenses)) DB.expenses = [];
  var loaded = false;

  var filterFrom = todayStr().slice(0,8) + '01';
  var filterTo = todayStr();

  async function syncExpenses(){
    var res = await sb.from('expenses').select('*').order('expense_date', { ascending:false });
    DB.expenses = res.data || [];
    loaded = true;
  }

  function injectNav(){
    var nav = document.querySelector('.nav');
    if(nav && !nav.querySelector('a[href="#/expenses"]')){
      var hash = location.hash || '#/';
      var isExp = hash === '#/expenses';
      var a = document.createElement('a');
      a.href = '#/expenses';
      a.className = isExp ? 'active' : '';
      a.innerHTML = '&#128184; Expenses';
      var purchasesLink = nav.querySelector('a[href="#/purchases"]');
      var settingsLink = nav.querySelector('a[href="#/settings"]');
      var anchor = purchasesLink ? purchasesLink.nextSibling : (settingsLink || null);
      if(anchor) nav.insertBefore(a, anchor);
      else nav.appendChild(a);
    }
    var mob = document.getElementById('mob-nav');
    if(mob && !mob.querySelector('option[value="#/expenses"]')){
      var o = document.createElement('option');
      o.value = '#/expenses'; o.textContent = 'Expenses';
      mob.appendChild(o);
    }
  }

  function renderExpenses(content){
    var filtered = DB.expenses.filter(function(e){
      return e.expense_date >= filterFrom && e.expense_date <= filterTo;
    });
    var total = filtered.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);

    content.innerHTML = '<div class="page-head">' +
      '<div><h1 style="font-size:22px;font-weight:700">Expenses</h1>' +
      '<p style="color:var(--s500);font-size:13px">Track and filter your shop costs.</p></div>' +
      '<button id="add-exp" class="btn btn-primary">+ Add Expense</button>' +
      '</div>' +
      '<div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px">' +
      '<div style="flex:1;min-width:140px"><label class="label">From</label><input class="input" type="date" id="exp-from" value="' + filterFrom + '"></div>' +
      '<div style="flex:1;min-width:140px"><label class="label">To</label><input class="input" type="date" id="exp-to" value="' + filterTo + '"></div>' +
      '<div><button class="btn btn-primary" id="exp-apply">Apply</button></div>' +
      '</div>' +
      '<div class="grid-3" style="margin-bottom:16px">' +
      '<div class="card" style="background:var(--loss-bg);border:1px solid var(--loss);">' +
      '<div style="font-size:11px;color:var(--s600);font-weight:600;text-transform:uppercase">Total Expenses</div>' +
      '<div style="font-size:22px;font-weight:700;color:var(--loss);margin-top:4px">' + rs(total) + '</div>' +
      '<div style="font-size:11px;color:var(--s500);margin-top:4px">' + filtered.length + ' entr' + (filtered.length === 1 ? 'y' : 'ies') + '</div>' +
      '</div></div>' +
      '<div class="card" style="overflow-x:auto"><table><thead><tr>' +
      '<th>Date</th><th>Category</th><th>Notes</th>' +
      '<th style="text-align:right">Amount</th><th></th>' +
      '</tr></thead><tbody id="exp-body"></tbody></table></div>';

    function renderTable(){
      var body = document.getElementById('exp-body');
      if(filtered.length === 0){
        body.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--s500)">No expenses in this date range</td></tr>';
        return;
      }
      body.innerHTML = filtered.map(function(e){
        return '<tr>' +
          '<td>' + fmtDate(e.expense_date) + (e.tx_time ? ' ' + e.tx_time : '') + '</td>' +
          '<td style="font-weight:500">' + esc(e.category || '-') + '</td>' +
          '<td style="color:var(--s500);font-size:12px">' + esc(e.notes || '-') + '</td>' +
          '<td style="text-align:right;font-weight:600;color:var(--loss)">' + rs(e.amount) + '</td>' +
          '<td style="text-align:right;white-space:nowrap">' +
          '<button class="btn btn-ghost btn-sm" data-exp-edit="' + e.id + '">Edit</button>' +
          '<button class="btn btn-ghost btn-sm" data-exp-del="' + e.id + '" style="color:var(--loss)">Del</button>' +
          '</td></tr>';
      }).join('');
      body.querySelectorAll('[data-exp-edit]').forEach(function(b){
        b.onclick = function(){
          var e = DB.expenses.find(function(x){ return x.id === b.dataset.expEdit; });
          openExpenseForm(e);
        };
      });
      body.querySelectorAll('[data-exp-del]').forEach(function(b){
        b.onclick = async function(){
          if(!confirmDlg('Delete this expense?', 'Confirm')) return;
          await sb.from('expenses').delete().eq('id', b.dataset.expDel);
          await syncExpenses();
          toast('Deleted', 'success');
          renderExpenses(content);
        };
      });
    }
    renderTable();

    document.getElementById('add-exp').onclick = function(){ openExpenseForm(null); };
    document.getElementById('exp-apply').onclick = function(){
      filterFrom = document.getElementById('exp-from').value;
      filterTo = document.getElementById('exp-to').value;
      renderExpenses(content);
    };
  }

  function openExpenseForm(existing){
    var e = existing || { category:'', amount:'', notes:'', expense_date: todayStr(), tx_time:'' };
    var html = '<h2 style="font-size:16px;font-weight:600;margin-bottom:12px">' + (existing ? 'Edit Expense' : 'Add Expense') + '</h2>' +
      '<form id="exp-form" style="display:flex;flex-direction:column;gap:12px">' +
      '<div><label class="label">Expense Date *</label><input class="input" type="date" name="expense_date" required value="' + (e.expense_date || todayStr()) + '"></div>' +
      '<div><label class="label">Category *</label><input class="input" name="category" required value="' + esc(e.category) + '" placeholder="Electricity, WiFi, Transport..."></div>' +
      '<div><label class="label">Amount (Rs.) *</label><input class="input" type="number" step="0.01" name="amount" required value="' + e.amount + '"></div>' +
      '<div><label class="label">Notes</label><input class="input" name="notes" value="' + esc(e.notes||'') + '"></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end">' +
      '<button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
      '<button class="btn btn-primary" id="exp-save">' + (existing ? 'Update' : 'Save') + '</button>' +
      '</div></form>';
    openModal(html, function(root){
      root.querySelector('#exp-form').onsubmit = async function(e2){
        e2.preventDefault();
        var fd = new FormData(e2.target);
        var data = {
          category: fd.get('category'),
          amount: Number(fd.get('amount')) || 0,
          notes: fd.get('notes') || '',
          expense_date: fd.get('expense_date')
        };
        var btn = root.querySelector('#exp-save');
        btn.disabled = true; btn.textContent = 'Saving...';
        var result;
        if(existing) result = await sb.from('expenses').update(data).eq('id', existing.id);
        else result = await sb.from('expenses').insert(data);
        if(result.error){ toast(result.error.message, 'error'); btn.disabled = false; btn.textContent = 'Save'; return; }
        await syncExpenses();
        toast(existing ? 'Updated' : 'Added', 'success');
        closeModal(); route();
      };
    });
  }

  // ---- ROUTE HOOK ----
  var _origRoute = window.route;
  if(typeof _origRoute === 'function'){
    window.route = async function(){
      var hash = location.hash || '#/';
      if(typeof SESSION === 'undefined' || !SESSION){
        return _origRoute.apply(this, arguments);
      }
      if(!loaded){
        try{ await syncExpenses(); } catch(e){ console.warn('syncExpenses', e); }
      }
      if(hash === '#/expenses'){
        renderLayout();
        var content = document.getElementById('content');
        renderExpenses(content);
        injectNav();
        return;
      }
      var ret = await _origRoute.apply(this, arguments);
      injectNav();
      return ret;
    };
    try{ window.removeEventListener('hashchange', _origRoute); } catch(e){}
    window.addEventListener('hashchange', window.route);
  }

  // Persist nav on all pages
  setInterval(injectNav, 500);
})();
</script>
<!-- ============================================================
     FEATURE 3: RETURNS / REFUNDS
     ============================================================ -->
<script>
(function(){
  'use strict';

  if(!Array.isArray(DB.returns)) DB.returns = [];
  var loaded = false;

  async function syncReturns(){
    var res = await sb.from('returns').select('*').order('return_date', { ascending:false });
    DB.returns = res.data || [];
    loaded = true;
  }

  function injectNav(){
    var nav = document.querySelector('.nav');
    if(nav && !nav.querySelector('a[href="#/returns"]')){
      var hash = location.hash || '#/';
      var isRet = hash === '#/returns';
      var a = document.createElement('a');
      a.href = '#/returns';
      a.className = isRet ? 'active' : '';
      a.innerHTML = '&#8617; Returns';
      var purchasesLink = nav.querySelector('a[href="#/purchases"]');
      var expensesLink = nav.querySelector('a[href="#/expenses"]');
      var anchor = expensesLink ? expensesLink.nextSibling : (purchasesLink ? purchasesLink.nextSibling : null);
      if(anchor) nav.insertBefore(a, anchor);
      else nav.appendChild(a);
    }
    var mob = document.getElementById('mob-nav');
    if(mob && !mob.querySelector('option[value="#/returns"]')){
      var o = document.createElement('option');
      o.value = '#/returns'; o.textContent = 'Returns';
      mob.appendChild(o);
    }
  }

  function renderReturns(content){
    content.innerHTML = '<div class="page-head"><h1 style="font-size:22px;font-weight:700">Returns / Refunds</h1></div>' +
      '<div class="card" style="margin-bottom:16px">' +
      '<div style="font-size:12px;font-weight:600;color:var(--brand-dark);margin-bottom:10px">Record a return</div>' +
      '<div style="display:flex;flex-direction:column;gap:12px">' +
      '<div><label class="label">Return Date</label><input class="input" type="date" id="ret-date" value="' + todayStr() + '"></div>' +
      '<div><label class="label">Invoice</label><select class="input" id="ret-invoice"><option value="">- Select invoice -</option>' +
      DB.invoices.slice().sort(function(a,b){ return (b.invoice_date||'').localeCompare(a.invoice_date||''); }).map(function(i){
        var isRet = i.buyer_type === 'retailer';
        var b = isRet ? DB.retailers.find(function(x){ return x.id === i.retailer_id; }) : DB.customers.find(function(x){ return x.id === i.customer_id; });
        return '<option value="' + i.id + '">' + esc(i.invoice_no) + ' - ' + esc(b ? b.name : 'Walk-in') + ' - ' + rs(i.total) + '</option>';
      }).join('') +
      '</select></div>' +
      '<div id="ret-items"></div>' +
      '<div id="ret-extra" style="display:none;flex-direction:column;gap:12px">' +
      '<div class="grid-2">' +
      '<div><label class="label">Qty to return</label><input class="input" type="number" step="0.01" id="ret-qty" value="1"></div>' +
      '<div><label class="label">Refund amount (Rs.)</label><input class="input" type="number" step="0.01" id="ret-amt" value="0"></div>' +
      '</div>' +
      '<div><label class="label">Reason</label><input class="input" id="ret-reason" placeholder="Damaged, Wrong item, etc."></div>' +
      '</div>' +
      '<div style="display:flex;justify-content:flex-end"><button id="ret-submit" class="btn btn-primary" disabled>Record Return</button></div>' +
      '</div></div>' +
      '<div class="card"><h2 style="font-weight:600;margin-bottom:10px">Recent returns</h2><div id="ret-list"></div></div>';

    function renderItems(invoiceId){
      var box = document.getElementById('ret-items');
      var extra = document.getElementById('ret-extra');
      var submit = document.getElementById('ret-submit');
      if(!invoiceId){ box.innerHTML = ''; extra.style.display = 'none'; submit.disabled = true; return; }
      var items = DB.invoice_items.filter(function(i){ return i.invoice_id === invoiceId; });
      if(!items.length){ box.innerHTML = '<p style="color:var(--s400);font-size:13px">This invoice has no items</p>'; extra.style.display = 'none'; submit.disabled = true; return; }
      box.innerHTML = '<label class="label">Select item to return</label>' +
        '<table style="font-size:13px"><thead><tr><th></th><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th></tr></thead><tbody>' +
        items.map(function(it){
          return '<tr>' +
            '<td><input type="radio" name="rt-line" value="' + it.id + '" data-pid="' + (it.product_id||'') + '" data-name="' + esc(it.product_name) + '" data-unit="' + esc(it.unit_name||'') + '" data-price="' + it.price + '" data-qty="' + it.qty + '" data-size="' + (it.unit_size||1) + '"></td>' +
            '<td>' + esc(it.product_name) + ' - ' + esc(it.unit_name || '') + '</td>' +
            '<td style="text-align:right">' + it.qty + '</td>' +
            '<td style="text-align:right">' + rs(it.price) + '</td>' +
            '</tr>';
        }).join('') +
        '</tbody></table>';
      extra.style.display = 'flex';
      submit.disabled = false;
      document.getElementById('ret-qty').value = 1;
      document.getElementById('ret-amt').value = 0;
      box.querySelectorAll('input[name="rt-line"]').forEach(function(r){
        r.onchange = function(e){
          var price = Number(e.target.dataset.price) || 0;
          document.getElementById('ret-qty').value = 1;
          document.getElementById('ret-amt').value = price;
          document.getElementById('ret-qty').max = e.target.dataset.qty;
        };
      });
      document.getElementById('ret-qty').oninput = function(e){
        var r = document.querySelector('input[name="rt-line"]:checked');
        if(!r) return;
        var price = Number(r.dataset.price) || 0;
        document.getElementById('ret-amt').value = (Number(e.target.value) || 0) * price;
      };
    }

    function renderList(){
      var box = document.getElementById('ret-list');
      if(!DB.returns.length){ box.innerHTML = '<p style="color:var(--s400);font-size:13px">No returns yet</p>'; return; }
      box.innerHTML = DB.returns.map(function(r){
        var inv = DB.invoices.find(function(i){ return i.id === r.invoice_id; });
        return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--s100);font-size:13px">' +
          '<div><div style="font-weight:500">' + esc(r.product_name || '') + ' x ' + r.qty + '</div>' +
          '<div style="color:var(--s500);font-size:11px">' + fmtDate(r.return_date) + (inv ? ' - ' + esc(inv.invoice_no) : '') + (r.reason ? ' - ' + esc(r.reason) : '') + '</div></div>' +
          '<div style="color:var(--loss);font-weight:500">' + rs(r.amount) + '</div>' +
          '</div>';
      }).join('');
    }
    renderList();

    document.getElementById('ret-invoice').onchange = function(e){ renderItems(e.target.value); };

    document.getElementById('ret-submit').onclick = async function(){
      var invId = document.getElementById('ret-invoice').value;
      if(!invId){ toast('Select an invoice', 'error'); return; }
      var r = document.querySelector('input[name="rt-line"]:checked');
      if(!r){ toast('Select an item', 'error'); return; }
      var invoice = DB.invoices.find(function(i){ return i.id === invId; });
      if(!invoice){ toast('Invoice not found', 'error'); return; }
      var qty = Number(document.getElementById('ret-qty').value) || 0;
      var amount = Number(document.getElementById('ret-amt').value) || 0;
      if(qty <= 0){ toast('Qty must be > 0', 'error'); return; }
      var productId = r.dataset.pid;
      var unitSize = Number(r.dataset.size) || 1;
      var baseQty = qty * unitSize;
      var btn = document.getElementById('ret-submit');
      btn.disabled = true; btn.textContent = 'Saving...';
      var res = await sb.from('returns').insert({
        invoice_id: invId,
        buyer_type: invoice.buyer_type,
        customer_id: invoice.customer_id,
        retailer_id: invoice.retailer_id,
        product_id: productId,
        product_name: r.dataset.name,
        unit_name: r.dataset.unit,
        qty: qty,
        base_qty: baseQty,
        amount: amount,
        reason: document.getElementById('ret-reason').value || '',
        return_date: document.getElementById('ret-date').value
      });
      if(res.error){ toast(res.error.message, 'error'); btn.disabled = false; btn.textContent = 'Record Return'; return; }
      var p = DB.products.find(function(x){ return x.id === productId; });
      if(p){
        await sb.from('products').update({ stock: Number(p.stock) + baseQty }).eq('id', p.id);
      }
      await syncReturns();
      await syncDB();
      toast('Return recorded - stock restored', 'success');
      route();
    };
  }

  // ---- ROUTE HOOK ----
  var _origRoute = window.route;
