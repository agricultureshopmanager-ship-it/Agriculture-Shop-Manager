<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Manager</title>

<style>
:root{
  --profit:#16a34a; --profit-bg:#f0fdf4; --profit-border:#bbf7d0;
  --loss:#dc2626;   --loss-bg:#fef2f2;   --loss-border:#fecaca;
  --warn:#f59e0b;   --warn-bg:#fffbeb;   --warn-border:#fde68a;
  --info:#2563eb;   --info-bg:#eff6ff;   --info-border:#bfdbfe;
  --s50:#f8fafc; --s100:#f1f5f9; --s200:#e2e8f0; --s300:#cbd5e1;
  --s400:#94a3b8; --s500:#64748b; --s600:#475569; --s700:#334155; --s800:#1e293b;
  --brand:#16a34a; --brand-dark:#15803d; --brand-light:#dcfce7; --brand-lighter:#f0fdf4;
  --accent:#c79a28; --accent-dark:#a3781a; --accent-light:#fef3c7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--s50);color:var(--s800);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--brand-dark);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-weight:500;border:0;cursor:pointer;transition:.15s;font-size:13px;white-space:nowrap}
.btn:hover{opacity:.92}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--brand);color:#fff}
.btn-ghost{background:var(--s100);color:var(--s700)}
.btn-accent{background:var(--accent);color:#fff}
.btn-danger{background:var(--loss);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid var(--s200);background:#fff;outline:none;font-size:13px}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.label{display:block;font-size:12px;font-weight:500;color:var(--s600);margin-bottom:4px}
.card{background:#fff;border-radius:14px;border:1px solid var(--s100);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--s500);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--s200);font-size:12px}
td{padding:10px 6px;border-bottom:1px solid var(--s100)}
tr:last-child td{border-bottom:0}tr:hover td{background:var(--s50)}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--s200);padding:16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brand-logo{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;border-radius:10px;overflow:hidden;background:var(--brand-lighter)}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-text{font-size:14px;font-weight:700;color:var(--brand-dark);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-text small{display:block;font-size:9px;color:var(--accent);font-weight:600;letter-spacing:.5px}
.nav{flex:1;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--s600);font-size:13px;transition:.15s}
.nav a:hover{background:var(--s50);color:var(--s800)}
.nav a.active{background:var(--brand-light);color:var(--brand-dark);font-weight:500}
.main{flex:1;padding:20px;max-width:1200px;width:100%;margin:0 auto;min-width:0}
.mobile-header{display:none;padding:12px 16px;background:#fff;border-bottom:1px solid var(--s200);position:sticky;top:0;z-index:20;align-items:center;gap:12px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:#fff;border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto}
.toast{background:var(--s800);color:#fff;padding:10px 16px;border-radius:10px;margin-bottom:8px;font-size:13px;animation:slideIn .2s}
.toast-success{background:var(--profit)}.toast-error{background:var(--loss)}
#toast-root{position:fixed;bottom:20px;right:20px;z-index:200}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:10px;font-size:18px}
.calc{position:fixed;bottom:20px;right:20px;background:#fff;border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);width:280px;z-index:150}
.calc-display{background:var(--s100);padding:12px;border-radius:10px;text-align:right;font-family:monospace;font-size:20px;margin-bottom:10px;overflow-x:auto;white-space:nowrap}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-keys button{padding:12px;border-radius:10px;background:var(--s100);border:0;cursor:pointer;font-weight:500;font-size:14px}
.calc-keys button.op{background:var(--brand);color:#fff}
.mini-stat{background:var(--s50);padding:10px;border-radius:10px}
.mini-stat .lbl{font-size:11px;color:var(--s500)}
.mini-stat .val{font-weight:700;margin-top:2px}
.page-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.searchselect{position:relative}
.ss-dropdown{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--s200);border-radius:10px;max-height:280px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:60;display:none;margin-top:4px}
.ss-dropdown.open{display:block}
.ss-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--s100);display:flex;justify-content:space-between;gap:8px;align-items:center}
.ss-item:last-child{border-bottom:0}
.ss-item:hover,.ss-item.active{background:var(--brand-lighter)}
.ss-item .sname{font-weight:500;font-size:13px}
.ss-item .ssub{font-size:11px;color:var(--s500);margin-top:1px}
.ss-item .smeta{text-align:right;font-size:11px;flex-shrink:0}
.ss-item .smeta .due{color:var(--loss);font-weight:600}
.ss-item .smeta .rat{color:var(--s600)}
.ss-empty{padding:14px;text-align:center;color:var(--s400);font-size:13px}
.ss-add{padding:10px;background:var(--s50);text-align:center;cursor:pointer;color:var(--brand-dark);font-weight:600;font-size:13px;border-top:1px solid var(--s100)}
.ss-add:hover{background:var(--brand-lighter)}
.ss-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;cursor:pointer;color:var(--s400);font-size:15px;padding:4px;line-height:1}
.ss-clear:hover{color:var(--loss)}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--brand-lighter),var(--brand-light));padding:16px}
.login-box{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--s500);flex-direction:column;gap:12px}
.spinner{width:36px;height:36px;border:3px solid var(--s200);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600}
.badge-profit{background:var(--profit-bg);color:var(--profit)}
.badge-loss{background:var(--loss-bg);color:var(--loss)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-info{background:var(--info-bg);color:var(--info)}
.badge-neutral{background:var(--s100);color:var(--s600)}
.tier-badge{background:var(--s100);color:var(--s700);font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600;display:inline-block;margin-right:4px}
@media print{
  @page{size:58mm auto;margin:0}
  body{width:58mm;margin:0;padding:0;background:#fff!important}
  body *{visibility:hidden!important}
  #print-area,#print-area *{visibility:visible!important}
  #print-area{position:absolute!important;left:0!important;top:0!important;width:52mm!important;margin:0 auto!important;font-family:'Courier New',monospace!important;font-size:11px!important;box-shadow:none!important;border:0!important;padding:2mm!important;background:#fff!important}
  #toast-root,#modal-root,#calc-root,.no-print{display:none!important}
}
@media(max-width:768px){
  .sidebar{display:none}
  .mobile-header{display:flex}
  .main{padding:12px}
  .modal-overlay{align-items:flex-start!important;padding:10px!important}
  .modal{width:100%!important;max-width:100%!important;margin:10px 0!important;padding:15px!important;max-height:85vh!important}
  .modal .grid-2,.modal .grid-3,.modal .grid-4{grid-template-columns:1fr!important}
}
</style>
</head>

<script>
/* ================================================================

const SHOP_CONFIG = {

  shop_name:    '',

function hexToRgb(h){
  h = String(h||'#000').replace('#','');
  if(h.length === 3) h = h.split('').map(c => c+c).join('');
  return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}
function mix(hex, target, pct){
  const c = hexToRgb(hex), t = hexToRgb(target);
  return rgbToHex(c.r + (t.r - c.r) * pct, c.g + (t.g - c.g) * pct, c.b + (t.b - c.b) * pct);
}
(function applyTheme(){
  const p = SHOP_CONFIG.theme.primary;
  const a = SHOP_CONFIG.theme.accent;
  const root = document.documentElement.style;
  root.setProperty('--brand', p);
  root.setProperty('--brand-dark',    mix(p,'#000000',0.30));
  root.setProperty('--brand-light',   mix(p,'#ffffff',0.85));
  root.setProperty('--brand-lighter', mix(p,'#ffffff',0.94));
  root.setProperty('--accent', a);
  root.setProperty('--accent-dark',   mix(a,'#000000',0.30));
  root.setProperty('--accent-light',  mix(a,'#ffffff',0.85));
  document.title = (SHOP_CONFIG.shop_name || 'Shop') + ' - Shop Manager';
})();

const BASE_UNITS = ['kg','gram','ton','quintal','ml','lit','piece'];
const PACK_UNITS = ['bottle','bag','pack','box','sack','pouch','sachet','tin','tube','can','jar','dozen','case','drum','carton','tray','bundle'];
const PRODUCT_CATEGORIES = ['Insecticide','Fungicide','Herbicide','Spreader','PGR','Bio stimulant','Fertilizer','Micro Nutrient','Seed','Equipment','Other'];
const SUPPLIER_CATEGORIES = ['Fertilizer','Pesticide','Seed','Equipment','Other'];

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const todayStr = () => new Date().toISOString().slice(0,10);
const isFuture = d => d && d > todayStr();
const txDate = (r, k) => (r && (r[k] || (r.created_at ? r.created_at.slice(0,10) : ''))) || '';
function txDT(r, k){ if(!r) return '-'; const d = txDate(r,k); if(!d) return '-'; return fmtDate(d) + (r.tx_time ? ' ' + r.tx_time : ''); }
function enteredOn(r){
  if(!r || !r.created_at) return '';
  const d = new Date(r.created_at);
  return 'Entered: ' + d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function dateTimeFieldHTML(dateVal, timeVal, label){
  const today = todayStr();
  return `<div class="grid-2">
    <div><label class="label">${label||'Date'} *</label><input class="input" type="date" name="tx_date" required max="${today}" value="${dateVal||today}"></div>
    <div><label class="label">Time (optional)</label><input class="input" type="time" name="tx_time" value="${timeVal||''}"></div>
  </div>`;
}
function readDateTime(form){
  const dateEl = form.querySelector('input[name="tx_date"]');
  const timeEl = form.querySelector('input[name="tx_time"]');
  const d  = dateEl ? dateEl.value : '';
  const tm = (timeEl && timeEl.value ? timeEl.value : '').trim();
  if(!d){ toast('Please pick a date','error'); return null; }
  if(isFuture(d)){ toast('Future dates are not allowed','error'); return null; }
  return { date: d, time: tm };
}
function inr(n){
  const num = Number(n||0), neg = num < 0, s = Math.abs(num).toFixed(2);
  const parts = s.split('.'); let intPart = parts[0]; const dec = parts[1];
  if(intPart.length > 3){
    const last3 = intPart.slice(-3), rest = intPart.slice(0,-3);
    intPart = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  }
  return (neg?'-':'') + intPart + '.' + dec;
}
const rs  = n => '₹' + inr(n);
const rsP = n => 'Rs. ' + inr(n);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => { if(!d) return '-'; const s = String(d).slice(0,10); return new Date(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
function fmtNum(n){ const v = Number(n||0); return v % 1 === 0 ? String(v) : v.toFixed(2); }
function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function openModal(html, onMount){
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-overlay"><div class="modal">${html}</div></div>`;
  root.querySelector('.modal-overlay').addEventListener('click', e => {
    if(e.target.classList.contains('modal-overlay')) closeModal();
  });
  if(onMount) onMount(root);
}
function closeModal(){ $('#modal-root').innerHTML = ''; }
function confirmDlg(msg, title){ return confirm((title ? title + '\n\n' : '') + msg); }

/* ====== CHUNK 1 END ====== */
/* ============================================================
   STOCK / PRODUCT HELPERS
   ============================================================ */
function productLevels(p){
  const levels = [{ level:1, name:p.unit1_name, size:1, price:Number(p.price1)||0 }];
  if(p.unit2_name && Number(p.unit2_size) > 0){
    levels.push({ level:2, name:p.unit2_name, size:Number(p.unit2_size), price:Number(p.price2)||0 });
  }
  if(p.unit3_name && Number(p.unit3_size) > 0){
    levels.push({ level:3, name:p.unit3_name, size:Number(p.unit3_size), price:Number(p.price3)||0 });
  }
  return levels;
}
function productDisplay(p){
  const levels = productLevels(p);
  const primary = p.primary_level === 2 && levels[1] ? levels[1]
                : p.primary_level === 3 && levels[2] ? levels[2]
                : levels[0];
  const stockLine = fmtNum(p.stock) + ' ' + p.unit1_name + (Number(p.stock) === 1 ? '' : 's');
  let secondary = '';
  if(primary.level > 1){
    const packs = Number(p.stock) / primary.size;
    secondary = fmtNum(packs) + ' ' + primary.name + (packs === 1 ? '' : 's');
  }
  return {
    primary: primary.level === 1 ? stockLine : secondary,
    secondary,
    stockLabel: stockLine,
    fullText: primary.level === 1 ? stockLine : (secondary + ' (' + stockLine + ')'),
    priceText: levels.map(l => 'Rs.' + fmtNum(l.price) + '/' + l.name).join('   '),
    subline: levels.map(l => l.level === 1
      ? ('Rs.' + fmtNum(l.price) + '/' + l.name)
      : (l.name + ' = ' + fmtNum(l.size) + ' ' + p.unit1_name + 's @ Rs.' + fmtNum(l.price))
    ).join('   '),
    levels
  };
}
const isLowStock   = p => Number(p.stock) <= Number(p.low_stock_alert);
const isOutOfStock = p => Number(p.stock) <= 0;
function stockBadge(p){
  if(isOutOfStock(p)) return '<span class="badge badge-neutral">OUT OF STOCK</span>';
  if(isLowStock(p))   return '<span class="badge badge-loss">LOW</span>';
  return '<span class="badge badge-profit">OK</span>';
}
function lineDeductBaseQty(line){ return Number(line.qty) * Number(line.unit_size || 1); }
function lineLabel(item){
  if(Number(item.unit_size || 1) > 1){
    return item.product_name + ' - ' + fmtNum(item.unit_size) + ' (' + item.unit_name + ')';
  }
  return item.product_name + ' - ' + (item.unit_name || '');
}
function checkStock(lines){
  for(const l of lines){
    const p = DB.products.find(x => x.id === l.product_id);
    if(!p) continue;
    const need = lineDeductBaseQty(l);
    if(Number(p.stock) < need){
      return { ok:false, productName:p.name, need, available:Number(p.stock), unit:p.unit1_name };
    }
  }
  return { ok:true };
}
function fmtInvQty(qty, unit){
  const q = Number(qty);
  if(!unit) return q;
  const u = String(unit).toLowerCase();
  if(u === 'gram' && q >= 1000) return (q/1000).toFixed(3).replace(/\.?0+$/,'') + ' kg';
  if(u === 'ml'   && q >= 1000) return (q/1000).toFixed(3).replace(/\.?0+$/,'') + ' lit';
  const plural = { bottle:'bottles', bag:'bags', piece:'pieces', jar:'jars', case:'cases', drum:'drums', packet:'packets', box:'boxes', sack:'sacks', pouch:'pouches', can:'cans', tin:'tins', tube:'tubes', carton:'cartons', tray:'trays', bundle:'bundles', dozen:'dozens', sachet:'sachets' };
  if(q > 1 && plural[u]) return q + ' ' + plural[u];
  return q + ' ' + u;
}

   BUYER STATS — computed from invoices + payments
   ============================================================ */

  if(total_bought > 0){
    rating = (total_paid / total_bought) * 5;
    if(due > 0){
      const d = due / total_bought;
      if(d > 0.5)       rating -= 1.5;
      else if(d > 0.25) rating -= 0.8;
    }
    rating = Math.max(1, Math.min(5, Math body.round(rating*10)/10 +=));
  }

="}
function allCustomersWithStats(){ return DB.customers.map(c => ({ ...c, ...computeBuyerStats('customer', c.id) })); }
function allRetailersWithStats(){ return DB.retailers.map(r => ({ ...r, ...computeBuyerStats('retailer', r.id) })); }
function supplierTotals(sid){
  const sup   = DB.suppliers.find(s => s.id === sid);
  const bills = DB.supplier_invoices.filter(b => b.supplier_id === sid);
  const pays  = DB.supplier_payments.filter(p => p.supplier_id === sid);
  const total_purchase = bills.reduce((s,b) => s + Number(b.total||0), 0);
  const bill_paid      = bills.reduce((s,b) => s + Number(b.paid||0), 0);
  const extra_paid     = pays.reduce((s,p)  => s + Number(p.amount||0), 0);
  const total_paid     = bill_paid + extra_paid;
  const opening        = Number(sup?.opening_balance||0);
  const total_due      = Math.max(0, opening + total_purchase - total_paid);
  return { total_purchase, total_paid, total_due, bill_paid, extra_paid, opening };
}

function nextInvoiceNo(){
  let max = 0;
  DB.invoices.forEach(inv => {
    const m = String(inv.invoice_no||'').match(/(\d+)/);
    if(m){ const n = parseInt(m[1]); if(n > max) max = n; }
  });
  return SHOP_CONFIG.invoice_prefix + '-' + String(max + 1).padStart(3,'0');
}
function getOverdue30(){
  const today = new Date();
  let total = 0;
  const list = [];
  DB.invoices.forEach(inv => {
    if(Number(inv.due) <= 0) return;
    const d = new Date(txDate(inv,'invoice_date'));
    const ageDays = Math.floor((today - d) / (1000*60*60*24));
    if(ageDays >= 30){
      const isRet = inv.buyer_type === 'retailer';
      const buyer = isRet ? DB.retailers.find(r => r.id === inv.retailer_id)
                          : DB.customers.find(c => c.id === inv.customer_id);
      total += Number(inv.due);
      list.push({ ...inv, ageDays, buyerName: buyer?.name || 'Walk-in', buyerType: inv.buyer_type });
    }
  });
  list.sort((a,b) => b.ageDays - a.ageDays);
  return { total, list };
}

function searchSelectHTML(id, placeholder){
  return `<div class="searchselect" id="${id}">
    <input type="text" class="input ss-input" placeholder="${placeholder||'Search...'}" autocomplete="off" style="padding-right:32px">
    <button type="button" class="ss-clear" style="display:none">&#10005;</button>
    <div class="ss-dropdown"></div>
    <input type="hidden" class="ss-value" value="">
  </div>`;
}
function mountSearchSelect(rootEl, opts){
  const input    = rootEl.querySelector('.ss-input');
  const dropdown = rootEl.querySelector('.ss-dropdown');
  const clearBtn = rootEl.querySelector('.ss-clear');
  const hidden   = rootEl.querySelector('.ss-value');
  let activeIdx = -1, filtered = [], items = opts.items || [];

  function render(query){
    const q = (query||'').toLowerCase().trim();
    filtered = items.filter(it => !q || it.searchText.toLowerCase().includes(q));
    let html = filtered.length === 0
      ? '<div class="ss-empty">No matches found</div>'
      : filtered.map((it,i) => `<div class="ss-item ${i===activeIdx?'active':''}" data-idx="${i}">
          <div style="flex:1;min-width:0">
            <div class="sname">${esc(it.label)}</div>
            ${it.sublabel ? `<div class="ssub">${esc(it.sublabel)}</div>` : ''}
          </div>
          <div class="smeta">
            ${it.dueText ? `<div class="due">${esc(it.dueText)}</div>` : ''}
            ${it.ratingText ? `<div class="rat">${esc(it.ratingText)}</div>` : ''}
          </div>
        </div>`).join('');
    if(opts.allowAdd) html += `<div class="ss-add">+ Add new</div>`;
    dropdown.innerHTML = html;
    dropdown.classList.add('open');
    dropdown.querySelectorAll('.ss-item').forEach(el => {
      el.onclick = () => pick(parseInt(el.dataset.idx));
    });
    const addEl = dropdown.querySelector('.ss-add');
    if(addEl) addEl.onclick = () => { dropdown.classList.remove('open'); if(opts.onAdd) opts.onAdd(); };
  }
  function pick(i){
    const it = filtered[i];
    if(!it) return;
    hidden.value = it.id;
    input.value = it.label + (it.sublabel ? ' - ' + it.sublabel : '');
    dropdown.classList.remove('open');
    clearBtn.style.display = 'block';
    if(opts.onSelect) opts.onSelect(it);
  }
  function clear(){
    hidden.value = '';
    input.value = '';
    clearBtn.style.display = 'none';
    if(opts.onSelect) opts.onSelect(null);
  }
  input.addEventListener('focus', () => render(input.value.replace(/ - .*$/,'').trim()));
  input.addEventListener('input', () => {
    activeIdx = -1;
    hidden.value = '';
    clearBtn.style.display = input.value ? 'block' : 'none';
    render(input.value);
  });
  input.addEventListener('keydown', e => {
    if(!dropdown.classList.contains('open')) return;
    if(e.key === 'ArrowDown'){ e.preventDefault(); activeIdx = Math.min(activeIdx+1, filtered.length-1); render(input.value); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); render(input.value); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(activeIdx >= 0) pick(activeIdx); }
    else if(e.key === 'Escape') dropdown.classList.remove('open');
  });
  clearBtn.onclick = e => { e.stopPropagation(); clear(); input.focus(); };
  document.addEventListener('click', e => { if(!rootEl.contains(e.target)) dropdown.classList.remove('open'); });

  rootEl.getValue = () => hidden.value;
  rootEl.setItems = newItems => { items = newItems; };
  rootEl.setValue = id => {
    const it = items.find(x => x.id === id);
    if(it){
      hidden.value = id;
      input.value = it.label + (it.sublabel ? ' - ' + it.sublabel : '');
      clearBtn.style.display = 'block';
    }
  };
  rootEl.reset = clear;
  return rootEl;
}

/* ============================================================
   THERMAL PRINTING — Bluetooth + USB
   ============================================================ */
function padLine(left, right, width = 32){
  left = String(left); right = String(right);
  if(left.length + right.length > width) left = left.substring(0, width - right.length - 1);
  const spaces = ' '.repeat(Math.max(1, width - left.length - right.length));
  return left + spaces + right;
}
let btPrinter = null;

async function printLogoToEncoder(encoder, logoUrl){
  if(!logoUrl) return;
  try{
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    img.src = logoUrl;
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error('Logo failed to load'));
    });
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const maxWidth = 96;
    const scale = Math.min(1, maxWidth / img.width);
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    encoder.align('center');
    encoder.image(imageData, canvas.width, canvas.height);
    encoder.newline();
  }catch(error){ console.log('Logo skipped:', error.message); }
}

async function printViaBluetooth(inv, items, buyer){
  if(!navigator.bluetooth){
    toast('Bluetooth not supported here. Use Print A4 or PDF instead.', 'error');
    return;
  }
  if(typeof ReceiptPrinterEncoder === 'undefined' || typeof WebBluetoothReceiptPrinter === 'undefined'){
    toast('Printer libraries not loaded. Check internet.', 'error');
    return;
  }
  try{
    if(!btPrinter){
      btPrinter = new WebBluetoothReceiptPrinter();
      btPrinter.addEventListener('connected', device => { console.log('BT connected:', device.name); });
      await btPrinter.connect();
    }
    const encoder = new ReceiptPrinterEncoder({ language: 'esc-pos' });
    if(SETTINGS.logo){ await printLogoToEncoder(encoder, SETTINGS.logo); }
    encoder.align('center').bold(true).text(SETTINGS.shop_name || 'Shop').newline();
    encoder.bold(false).text(SETTINGS.owner_name || '').newline();
    encoder.text(SETTINGS.address || '').newline();
    if(SETTINGS.phone) encoder.text('Ph: ' + SETTINGS.phone).newline();
    encoder.text('--------------------------------').newline();
    encoder.align('left');
    encoder.text(padLine('Invoice:', inv.invoice_no)).newline();
    encoder.text(padLine('Date:', txDT(inv, 'invoice_date'))).newline();
    encoder.text(padLine('Buyer:', buyer?.name || 'Walk-in')).newline();
    encoder.text('--------------------------------').newline();
    encoder.text(padLine('Item', 'Amount')).newline();
    encoder.text('--------------------------------').newline();
    for(const item of items){
      const itemName = lineLabel(item);
      const qtyPrice = fmtInvQty(item.qty, item.unit_name) + ' x ' + Number(item.price).toFixed(2);
      const total = Number(item.total).toFixed(2);
      encoder.text(itemName.substring(0, 32)).newline();
      encoder.text(padLine('  ' + qtyPrice, total)).newline();
    }
    encoder.text('--------------------------------').newline();
    encoder.align('left');
    encoder.text(padLine('Subtotal:', 'Rs.' + inr(inv.subtotal))).newline();
    if(Number(inv.discount) > 0) encoder.text(padLine('Discount:', '-Rs.' + inr(inv.discount))).newline();
    encoder.bold(true).text(padLine('Total:', 'Rs.' + inr(inv.total))).newline();
    encoder.bold(false).text(padLine('Paid:', 'Rs.' + inr(inv.paid))).newline();
    encoder.text(padLine('Due:', 'Rs.' + inr(inv.due))).newline();
    encoder.align('center').newline(1);
    encoder.text('Thank you! Visit again.').newline();
    encoder.text(SETTINGS.upi || '').newline(2);
    encoder.cut();
    const data = encoder.encode();
    await btPrinter.print(data);
    toast('Receipt sent to printer', 'success');
  }catch(error){
    console.error('Bluetooth printing error:', error);
    toast('Printing failed: ' + error.message, 'error');
    btPrinter = null;
  }
}

async function printViaUSB(inv, items, buyer){
  if(!navigator.usb){
    toast('WebUSB not supported. Use Bluetooth or Print A4.', 'error');
    return;
  }
  try{
    const device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0483 }] });
    const connection = new EscposBuffer.WebUSB(device);
    const printer = await EscposBuffer.Printer.CONNECT('HOP-HL58', connection);
    await printer.setColumns(32);

    await printer.withStyle({ align: 'center', bold: true }, async () => { await printer.writeln(SETTINGS.shop_name || 'Shop'); });
    await printer.withStyle({ align: 'center' }, async () => {
      await printer.writeln(SETTINGS.owner_name || '');
      await printer.writeln((SETTINGS.address || '').substring(0, 32));
      if(SETTINGS.phone) await printer.writeln('Ph: ' + SETTINGS.phone);
    });
    await printer.writeln('--------------------------------');
    await printer.withStyle({ align: 'left' }, async () => {
      await printer.writeln(padLine('Invoice:', inv.invoice_no));
      await printer.writeln(padLine('Date:', txDT(inv, 'invoice_date')));
      await printer.writeln(padLine('Buyer:', buyer?.name || 'Walk-in'));
    });
    await printer.writeln('--------------------------------');
    await printer.writeln(padLine('Item', 'Amount'));
    await printer.writeln('--------------------------------');
    for(const item of items){
      const itemName = lineLabel(item);
      const qtyPrice = fmtInvQty(item.qty, item.unit_name) + ' x ' + Number(item.price).toFixed(2);
      const total = Number(item.total).toFixed(2);
      await printer.writeln(itemName.substring(0, 32));
      await printer.writeln(padLine('  ' + qtyPrice, total));
    }
    await printer.writeln('--------------------------------');
    await printer.withStyle({ align: 'right' }, async () => {
      await printer.writeln(padLine('Subtotal:', 'Rs.' + inr(inv.subtotal)));
      if(Number(inv.discount) > 0) await printer.writeln(padLine('Discount:', '-Rs.' + inr(inv.discount)));
      await printer.withStyle({ bold: true }, async () => { await printer.writeln(padLine('Total:', 'Rs.' + inr(inv.total))); });
      await printer.writeln(padLine('Paid:', 'Rs.' + inr(inv.paid)));
      await printer.writeln(padLine('Due:', 'Rs.' + inr(inv.due)));
    });
    await printer.withStyle({ align: 'center' }, async () => {
      await printer.writeln('');
      await printer.writeln('Thank you! Visit again.');
      await printer.writeln(SETTINGS.upi || '');
    });
    await printer.feed(4);
    await printer.cutter();
    toast('Receipt sent to USB printer', 'success');
  }catch(error){
    console.error('USB printing error:', error);
    toast('USB printing failed: ' + error.message, 'error');
  }
}

   ============================================================ */
let calcOpen = false;
function toggleCalc(){
  calcOpen = !calcOpen;
  const root = $('#calc-root');
  if(!calcOpen){ root.innerHTML = ''; return; }
  let val = '0';
  const render = () => {
    const keys = ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C','BK'];
    root.innerHTML = `<div class="calc">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:13px;font-weight:500">Calculator</span>
        <button class="btn btn-ghost btn-sm" id="calc-close">&#10005;</button>
      </div>
      <div class="calc-display">${val}</div>
      <div class="calc-keys">${keys.map(k => {
        const op = ['/','*','-','+','='].includes(k) ? 'op' : '';
        const lbl = k === 'BK' ? '&#9003;' : k;
        return `<button class="${op}" data-k="${k}">${lbl}</button>`;
      }).join('')}</div>
    </div>`;
    $('#calc-close').onclick = toggleCalc;
    $$('#calc-root button[data-k]').forEach(b => b.onclick = () => push(b.dataset.k));
  };
  const push = k => {
    if(k === 'C') val = '0';
    else if(k === 'BK') val = val.length > 1 ? val.slice(0,-1) : '0';
    else if(k === '='){
      try{ val = String(Function('"use strict";return (' + val + ')')()); }
      catch{ val = 'Err'; }
    }
    else val = val === '0' ? k : val + k;
    render();
  };
  render();
}

async function route(){

  if(hash.startsWith('#/c/')){

  if(!SESSION){

  const content = $('#content');

    else if(hash === '#/customers')                       renderCustomers(content);
    else if(hash.startsWith('#/customer/'))               renderCustomerProfile(content, hash.slice(11));

    else if(hash === '#/invoices')                        renderInvoices(content);
    else if(hash === '#/invoice/new')                     renderNewInvoice(content);
    else if(hash.startsWith('#/invoice/'))                renderInvoiceView(content, hash.slice(10));
    else if(hash === '#/suppliers')                       renderSuppliers(content);
    else if(hash.startsWith('#/supplier/'))               renderSupplierProfile(content, hash.slice(11));
    else if(hash === '#/purchases')                       renderPurchases(content);
    else if(hash === '#/returns')                         renderReturns(content);
    else if(hash === '#/expenses')                        renderExpenses(content);
    else if(hash === '#/analytics')                       renderAnalytics(content);
    else if(hash === '#/pnl')                             renderPnL(content);
    else if(hash === '#/shop-health')                     renderShopHealth(content);
    else if(hash === '#/reports')                         renderReports(content);
    else if(hash === '#/myshop')                          renderMyShop(content);

  }catch(err){
    console.error('route error', err);
    content.innerHTML = '<div class="card" style="color:var(--loss)">Error: ' + esc(err.message || String(err)) + '</div>';

}

function showSalesModal(title, invoices){
  const total = invoices.reduce((s,i) => s + Number(i.total||0), 0);
  const paid  = invoices.reduce((s,i) => s + Number(i.paid||0),  0);
  const due   = invoices.reduce((s,i) => s + Number(i.due||0),   0);
  openModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="font-size:16px;font-weight:600">${esc(title)}</h2>
    </div>
    <div class="grid-4" style="margin-bottom:12px">
      ${[['Total',rs(total)],['Paid',rs(paid)],['Due',rs(due)],['Count',invoices.length]]

    </div>

          <thead><tr><th>Invoice</th><th>Buyer</th><th>Date</th><th style="text-align:right">Total</th></tr></thead>

                            : DB.customers.find(x => x.id === i.customer_id);
            return `<tr>

}

function renderBuyerList(content, type){
  const isCust = type === 'customer';
  const list   = isCust ? allCustomersWithStats() : allRetailersWithStats();
  const label  = isCust ? 'Customers' : 'Retailers';
  const noun   = isCust ? 'customer' : 'retailer';

  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head">
        <h1 style="font-size:22px;font-weight:700">${label}</h1>
        <div class="page-actions">
          <button id="add-b" class="btn btn-primary">+ Add ${isCust ? 'Customer' : 'Retailer'}</button>
          ${reportButtonsHTML(isCust ? 'cust' : 'ret')}
        </div>
      </div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div style="flex:2;min-width:200px">
          <label class="label">Search</label>
          <input class="input" id="b-search" placeholder="Name or phone...">
        </div>
        <div style="flex:1;min-width:150px">
          <label class="label">Sort</label>
          <select class="input" id="b-sort">
            <option value="name">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
            <option value="due-desc">Due (high first)</option>
            <option value="rating-desc">Rating (high first)</option>
          </select>
        </div>
        <div style="flex:0 0 auto">
          <label class="label">&nbsp;</label>
          <select class="input" id="b-filter">
            <option value="">All</option>
            <option value="due">Only with due</option>
            <option value="nodue">Only cleared</option>
          </select>
        </div>
      </div>
      <div id="b-count" style="font-size:12px;color:var(--s500);padding:0 4px"></div>
      <div class="card" style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Name</th>
            ${isCust ? '' : '<th>Shop</th>'}
            <th>Phone</th>
            <th>Rating</th>
            <th style="text-align:right">Due</th>
            <th></th>
          </tr></thead>
          <tbody id="b-body"></tbody>
        </table>
      </div>
    </div>`;

  function filtered(){
    const q = ($('#b-search').value || '').toLowerCase().trim();
    const sortBy = $('#b-sort').value;
    const flt = $('#b-filter').value;
    let arr = list.filter(x => {
      const hay = (x.name || '') + ' ' + (x.phone || '') + ' ' + (x.shop_name || '');
      if(q && !hay.toLowerCase().includes(q)) return false;
      if(flt === 'due'   && !(Number(x.due) > 0)) return false;
      if(flt === 'nodue' && Number(x.due) > 0)     return false;
      return true;
    });
    if(sortBy === 'name')              arr.sort((a,b) => a.name.localeCompare(b.name));
    else if(sortBy === 'name-desc')    arr.sort((a,b) => b.name.localeCompare(a.name));
    else if(sortBy === 'due-desc')     arr.sort((a,b) => Number(b.due) - Number(a.due));
    else if(sortBy === 'rating-desc')  arr.sort((a,b) => Number(b.rating) - Number(a.rating));
    return arr;
  }

  function renderTable(){
    const arr = filtered();
    $('#b-count').textContent = arr.length + ' of ' + list.length + ' ' + label.toLowerCase();
    $('#b-body').innerHTML = arr.length === 0
      ? `<tr><td colspan="${isCust ? 5 : 6}" style="text-align:center;padding:40px">
          <div style="font-size:40px">&#128229;</div>
          <p style="color:var(--s500);margin:8px 0">No ${label.toLowerCase()} match</p>
        </td></tr>`
      : arr.map(x => `<tr>
          <td><a href="#/${noun}/${x.id}" style="font-weight:500">${esc(x.name)}</a></td>
          ${isCust ? '' : `<td>${esc(x.shop_name || '-')}</td>`}
          <td>${x.phone ? `<a href="tel:${x.phone}" style="color:var(--s600)">${esc(x.phone)}</a>` : '-'}</td>
          <td><span style="color:var(--warn)">&#9733; ${x.rating}</span></td>
          <td style="text-align:right;font-weight:500;color:${Number(x.due) > 0 ? 'var(--loss)' : 'var(--s500)'}">${rs(x.due)}</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="btn btn-ghost btn-sm" data-edit="${x.id}">Edit</button>
            <button class="btn btn-ghost btn-sm" data-del="${x.id}" style="color:var(--loss)">Del</button>
          </td>
        </tr>`).join('');

    $$('[data-del]').forEach(b => b.onclick = async () => {
      const x = list.find(it => it.id === b.dataset.del);
      if(!confirmDlg('Delete "' + (x?.name || 'this ' + noun) + '"?\n\nAll their invoices and payments will also be removed.', 'Confirm Delete')) return;
      const { error } = await sb.from(isCust ? 'customers' : 'retailers').delete().eq('id', b.dataset.del);
      if(error){ toast(error.message, 'error'); return; }
      await syncDB(); toast('Deleted', 'success'); route();
    });
    $$('[data-edit]').forEach(b => b.onclick = () => {
      const x = list.find(it => it.id === b.dataset.edit);
      openBuyerFormModal(type, x);
    });
  }

  ['b-search','b-sort','b-filter'].forEach(id => {
    const el = $('#' + id);
    el.oninput = renderTable;
    el.onchange = renderTable;
  });
  renderTable();
  $('#add-b').onclick = () => openBuyerFormModal(type);

  const totalDue    = list.reduce((s,x) => s + Number(x.due), 0);
  const totalBought = list.reduce((s,x) => s + Number(x.total_bought), 0);
  const totalPaid   = list.reduce((s,x) => s + Number(x.total_paid), 0);
  const kpis = [
    ['Total ' + label, list.length],
    ['Total Bought',   rs(totalBought)],
    ['Total Paid',     rs(totalPaid)],
    ['Total Due',      rs(totalDue)]
  ];
  const head = isCust
    ? ['Name','Phone','Address','Rating','Bought','Paid','Due']
    : ['Name','Shop','Phone','Address','Rating','Bought','Paid','Due'];
  const tables = [{ head, rows: list.map(x => isCust
    ? [x.name, x.phone||'-', x.address||'-', x.rating, rs(x.total_bought), rs(x.total_paid), rs(x.due)]
    : [x.name, x.shop_name||'-', x.phone||'-', x.address||'-', x.rating, rs(x.total_bought), rs(x.total_paid), rs(x.due)]
  ) }];
  bindReport(isCust ? 'cust' : 'ret', 'All ' + label, kpis, tables);
}

function openBuyerFormModal(type, existing){

  const x = existing || { name:'', shop_name:'', phone:'', address:'', gst:'', notes:'', joined_date:todayStr(), tx_time:'' };
  openModal(`
    <h2 style="font-size:16px;font-weight:600;margin-bottom:14px">${existing ? 'Edit' : 'New'} ${isCust ? 'Customer' : 'Retailer'}</h2>

      <div><label class="label">Name *</label><input class="input" name="name" required value="${esc(x.name || '')}"></div>
      ${isCust ? '' : `<div><label class="label">Shop / Firm name</label><input class="input" name="shop_name" value="${esc(x.shop_name || '')}"></div>`}
      <div class="grid-2">
        <div><label class="label">Phone</label><input class="input" name="phone" value="${esc(x.phone || '')}"></div>
        ${isCust ? '' : `<div><label class="label">GST No.</label><input class="input" name="gst" value="${esc(x.gst || '')}"></div>`}
      </div>
      <div><label class="label">Address</label><input class="input" name="address" value="${esc(x.address || '')}"></div>
      ${isCust ? '' : `<div><label class="label">Notes</label><input class="input" name="notes" value="${esc(x.notes || '')}"></div>`}
      ${dateTimeFieldHTML(x.joined_date || todayStr(), x.tx_time || '', 'Since')}
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>

      const data = isCust
        ? { name: fd.get('name'), phone: fd.get('phone') || '', address: fd.get('address') || '', joined_date: dt.date, tx_time: dt.time }
        : { name: fd.get('name'), shop_name: fd.get('shop_name') || '', phone: fd.get('phone') || '', gst: fd.get('gst') || '', address: fd.get('address') || '', notes: fd.get('notes') || '', joined_date: dt.date, tx_time: dt.time };
      const btn = root.querySelector('#bf-save');
      btn.disabled = true; btn.textContent = 'Saving...';
      const tbl = isCust ? 'customers' : 'retailers';
      let result;
      if(existing) result = await sb.from(tbl).update(data).eq('id', existing.id).select().single();
      else         result = await sb.from(tbl).insert(data).select().single();
      if(result.error){
        toast(result.error.message, 'error');
        btn.disabled = false; btn.textContent = existing ? 'Update' : 'Save';
        return;
      }
      await syncDB();
      toast(existing ? 'Updated' : 'Added', 'success');
      closeModal(); route();
    };
  });
}

    if(error){ toast(error.message, 'error'); return; }
    await syncDB(); toast('Deleted', 'success'); route();
  });

    const p = DB.payments.find(y => y.id === b.dataset.payEdit);

        <div><label class="label">Mode</label><select class="input" name="mode">
          <option ${p.mode==='cash'?'selected':''}>cash</option>
          <option ${p.mode==='upi'?'selected':''}>upi</option>
          <option ${p.mode==='bank'?'selected':''}>bank</option>
        </select></div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary">Update</button>
        </div>
      </form>`, root => {
      root.querySelector('#pef').onsubmit = async e => {
        e.preventDefault();
        const dt = readDateTime(e.target); if(!dt) return;
        const fd = new FormData(e.target);

          amount: Number(fd.get('amount')) || 0,

        }).eq('id', p.id);
        if(error){ toast(error.message, 'error'); return; }
        await syncDB(); toast('Updated', 'success'); closeModal(); route();

  const kpis = [
    ['Total Bought', rs(stats.total_bought)],

    ['Rating',       stats.rating]

function renderProducts(content){
  const list = DB.products;
  const categories = [...new Set(list.map(p => p.category).filter(Boolean))].sort();
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head">
        <h1 style="font-size:22px;font-weight:700">Products &amp; Inventory</h1>
        <div class="page-actions">
          <button id="add-prod" class="btn btn-primary">+ Add Product</button>
          ${reportButtonsHTML('prod')}
        </div>
      </div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div style="flex:2;min-width:200px">
          <label class="label">Search</label>
          <input class="input" id="prod-search" placeholder="Name or category...">
        </div>
        <div style="flex:1;min-width:140px">
          <label class="label">Category</label>
          <select class="input" id="prod-cat">
            <option value="">All</option>
            ${categories.map(c => `<option>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div style="flex:0 0 auto">
          <label class="label">&nbsp;</label>
          <select class="input" id="prod-filter">
            <option value="">All</option>
            <option value="low">Low stock</option>
            <option value="out">Out of stock</option>
          </select>
        </div>
      </div>
      <div id="prod-count" style="font-size:12px;color:var(--s500);padding:0 4px"></div>
      <div class="grid-3" id="prod-grid"></div>
    </div>`;

  const totalCostValue = list.reduce((s,p) => s + (Number(p.stock)||0) * (Number(p.cost)||0), 0);
  const totalRetailValue = list.reduce((s,p) => s + (Number(p.stock)||0) * (Number(p.price1)||0), 0);
  $('.page-head').insertAdjacentHTML('afterend', `
    <div class="grid-2" id="money-cards">
      <div class="card" style="background:var(--warn-bg);border-color:var(--warn-border)">
        <div style="font-size:11px;color:var(--s600);font-weight:600;text-transform:uppercase">Total Stock Cost (Money Invested)</div>
        <div style="font-size:22px;font-weight:700;color:var(--warn);margin-top:4px">${rs(totalCostValue)}</div>
      </div>
      <div class="card" style="background:var(--profit-bg);border-color:var(--profit-border)">
        <div style="font-size:11px;color:var(--s600);font-weight:600;text-transform:uppercase">Total Retail Value (Potential Sales)</div>
        <div style="font-size:22px;font-weight:700;color:var(--profit);margin-top:4px">${rs(totalRetailValue)}</div>
      </div>
    </div>`);

  function filtered(){
    const q = ($('#prod-search').value || '').toLowerCase().trim();
    const cat = $('#prod-cat').value;
    const flt = $('#prod-filter').value;
    return list.filter(p => {
      const hay = (p.name + ' ' + (p.category || '')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      if(cat && p.category !== cat) return false;
      if(flt === 'low' && !isLowStock(p)) return false;
      if(flt === 'out' && !isOutOfStock(p)) return false;
      return true;
    });
  }
  function renderGrid(){
    const arr = filtered();
    $('#prod-count').textContent = arr.length + ' of ' + list.length + ' products';
    const grid = $('#prod-grid');
    if(arr.length === 0){
      grid.innerHTML = `<div class="card" style="grid-column:1/-1;text-align:center;padding:40px">
        <div style="font-size:48px">&#128230;</div>
        <p style="color:var(--s500);margin:10px 0">No products</p>
      </div>`;
      return;
    }
    grid.innerHTML = arr.map(p => {
      const levels = productLevels(p);
      const stockVal  = (Number(p.stock)||0) * (Number(p.cost)||0);
      const retailVal = (Number(p.stock)||0) * (Number(p.price1)||0);
      const tierBadges = levels.map(l => l.level === 1 ? '' : `<span class="tier-badge">${esc(l.name)} = ${fmtNum(l.size)}</span>`).join(' ');
      return `<div class="card">
        <div style="display:flex;gap:10px">
          <div class="stat-icon" style="background:var(--brand-light);color:var(--brand-dark);margin:0">&#128230;</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap">${esc(p.name)} ${stockBadge(p)}</div>
            <div style="font-size:11px;color:var(--s500);margin-top:2px">${esc(p.category || '-')}</div>
            <div style="font-size:11px;color:var(--s500);margin-top:4px">${tierBadges}</div>
            <div style="font-size:13px;margin-top:6px;font-weight:500;color:${isOutOfStock(p) ? 'var(--s400)' : (isLowStock(p) ? 'var(--loss)' : 'var(--s700)')}">${esc(productDisplay(p).stockLabel)}</div>
            <div style="font-size:11px;color:var(--s600);margin-top:2px">${esc(productDisplay(p).priceText)}</div>
          </div>
        </div>
        <div class="stock-value-box" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--s200);font-size:11px;display:flex;justify-content:space-between;color:var(--s600)">
          <span>Cost: <b style="color:var(--warn)">${rs(stockVal)}</b></span>
          <span>Retail: <b style="color:var(--profit)">${rs(retailVal)}</b></span>
        </div>
        <div style="display:flex;gap:4px;margin-top:8px">
          <button class="btn btn-ghost btn-sm" data-restock="${p.id}" style="flex:1;color:var(--brand-dark);font-weight:600">+ Stock</button>
          <button class="btn btn-ghost btn-sm" data-edit="${p.id}">Edit</button>
          <button class="btn btn-ghost btn-sm" data-del="${p.id}" style="color:var(--loss)">Del</button>
        </div>
      </div>`;
    }).join('');
    $$('[data-del]', grid).forEach(b => b.onclick = async () => {
      const p = DB.products.find(x => x.id === b.dataset.del);
      if(!confirmDlg('Delete "' + (p?.name || 'product') + '"?', 'Confirm')) return;
      const { error } = await sb.from('products').delete().eq('id', b.dataset.del);
      if(error){ toast(error.message, 'error'); return; }
      await syncDB(); toast('Deleted', 'success'); route();
    });
    $$('[data-edit]', grid).forEach(b => b.onclick = () => {
      const p = DB.products.find(x => x.id === b.dataset.edit);
      openProductForm(p);
    });
    $$('[data-restock]', grid).forEach(b => b.onclick = () => openRestockModal(b.dataset.restock));
  }
  ['prod-search','prod-cat','prod-filter'].forEach(id => {
    const el = $('#' + id);
    el.oninput = renderGrid;
    el.onchange = renderGrid;
  });
  $('#add-prod').onclick = () => openProductForm();
  renderGrid();

  const lowCount = list.filter(p => isLowStock(p)).length;
  const outCount = list.filter(p => isOutOfStock(p)).length;
  const kpis = [
    ['Total Products', list.length],
    ['Low Stock', lowCount],
    ['Out of Stock', outCount],
    ['Stock Value', rs(totalCostValue)]
  ];
  const tables = [{ head:['Product','Category','Stock','Cost','Levels'],
    rows: list.map(p => [p.name, p.category || '-', productDisplay(p).stockLabel, rs(p.cost),
      productLevels(p).map(l => l.name + '=' + fmtNum(l.size) + ' @ Rs.' + fmtNum(l.price)).join('   ')]) }];
  bindReport('prod', 'Stock Report', kpis, tables);
}

      <div class="card" style="background:var(--brand-lighter);border-color:var(--brand-light)">
        <div style="font-size:12px;font-weight:600;color:var(--brand-dark);margin-bottom:8px">

        </div>
        <div class="grid-2">
          <div>
            <label class="label">Unit name *</label>
            <select class="input" name="unit1_name" required>${unitOptions(p.unit1_name)}</select>
          </div>
          <div>
            <label class="label">Sell price (Rs.) *</label>
            <input class="input" type="number" step="any" name="price1" required value="${p.price1 || 0}">
          </div>
        </div>
      </div>

      <div class="card">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600">
          <input type="checkbox" id="has-l2" ${hasL2 ? 'checked' : ''}> Add a SECOND unit level (case, drum, box...)
        </label>
        <div id="l2-block" style="display:${hasL2 ? 'block' : 'none'};margin-top:12px">
          <div class="grid-2">
            <div>
              <label class="label">Unit name</label>
              <select class="input" name="unit2_name">${unitOptions(p.unit2_name)}</select>
            </div>
            <div>
              <label class="label">How many Level-1 units in 1 of these?</label>
              <input class="input" type="number" step="any" name="unit2_size" value="${p.unit2_size || 0}">
            </div>
            <div>
              <label class="label">Sell price (Rs.) - auto-fills, editable</label>
              <input class="input" type="number" step="any" name="price2" value="${p.price2 || 0}">
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600">
          <input type="checkbox" id="has-l3" ${hasL3 ? 'checked' : ''}> Add a THIRD unit level (drum, sack, carton...)
        </label>
        <div id="l3-block" style="display:${hasL3 ? 'block' : 'none'};margin-top:12px">
          <div class="grid-2">
            <div>
              <label class="label">Unit name</label>
              <select class="input" name="unit3_name">${unitOptions(p.unit3_name)}</select>
            </div>
            <div>
              <label class="label">How many Level-1 units in 1 of these?</label>
              <input class="input" type="number" step="any" name="unit3_size" value="${p.unit3_size || 0}">
            </div>
            <div>
              <label class="label">Sell price (Rs.) - auto-fills, editable</label>
              <input class="input" type="number" step="any" name="price3" value="${p.price3 || 0}">
            </div>
          </div>
        </div>
      </div>

      <div class="grid-3">
        <div>
          <label class="label">Stock (in Level 1 units) *</label>
          <input class="input" type="number" step="any" name="stock" required value="${p.stock || 0}">
        </div>
        <div>
          <label class="label">Cost per Level-1 unit (Rs.)</label>
          <input class="input" type="number" step="any" name="cost" value="${p.cost || 0}">
        </div>
        <div>
          <label class="label">Low stock alert at</label>
          <input class="input" type="number" name="low_stock_alert" value="${p.low_stock_alert || 5}">
        </div>
      </div>

      <div>
        <label class="label">Which level to show as primary?</label>
        <select class="input" name="primary_level"></select>
      </div>

      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="prf-save">${existing ? 'Update' : 'Save'}</button>
      </div>
    </form>`, root => {
    const l2cb = root.querySelector('#has-l2');
    const l3cb = root.querySelector('#has-l3');
    const l2b  = root.querySelector('#l2-block');
    const l3b  = root.querySelector('#l3-block');

    const u1   = root.querySelector('[name="unit1_name"]');
    const u2   = root.querySelector('[name="unit2_name"]');
    const u3   = root.querySelector('[name="unit3_name"]');
    const p1   = root.querySelector('[name="price1"]');
    const s2   = root.querySelector('[name="unit2_size"]');
    const p2   = root.querySelector('[name="price2"]');
    const s3   = root.querySelector('[name="unit3_size"]');
    const p3   = root.querySelector('[name="price3"]');
    const selPri = root.querySelector('[name="primary_level"]');

    function updatePrimaryDropdown(){
      const prev = selPri.value || String(p.primary_level || 1);
      let html = `<option value="1">Level 1 (${esc(u1.value || 'unnamed')})</option>`;
      if(l2cb.checked) html += `<option value="2">Level 2 (${esc(u2.value || 'unnamed')})</option>`;
      if(l3cb.checked) html += `<option value="3">Level 3 (${esc(u3.value || 'unnamed')})</option>`;
      selPri.innerHTML = html;
      if([...selPri.options].some(o => o.value === prev)) selPri.value = prev;
    }
    updatePrimaryDropdown();

    let p2Touched = false, p3Touched = false;
    p2.addEventListener('input', () => { p2Touched = true; });
    p3.addEventListener('input', () => { p3Touched = true; });

    function recalcPrice2(){
      if(p2Touched) return;
      const base = Number(p1.value) || 0;
      const size = Number(s2.value) || 0;
      const v = base * size;
      p2.value = v > 0 ? Number(v.toFixed(4)) : '';
    }
    function recalcPrice3(){
      if(p3Touched) return;
      const base = Number(p1.value) || 0;
      const size = Number(s3.value) || 0;
      const v = base * size;
      p3.value = v > 0 ? Number(v.toFixed(4)) : '';
    }

    p1.addEventListener('input', () => { recalcPrice2(); recalcPrice3(); });
    s2.addEventListener('input', recalcPrice2);
    s3.addEventListener('input', recalcPrice3);

    l2cb.onchange = () => {
      l2b.style.display = l2cb.checked ? 'block' : 'none';
      if(!l2cb.checked){ p2Touched = false; p2.value = ''; s2.value = 0; }
      updatePrimaryDropdown();
      recalcPrice2();
    };
    l3cb.onchange = () => {
      l3b.style.display = l3cb.checked ? 'block' : 'none';
      if(!l3cb.checked){ p3Touched = false; p3.value = ''; s3.value = 0; }
      updatePrimaryDropdown();
      recalcPrice3();
    };

    [u1, u2, u3].forEach(el => {
      el.addEventListener('change', updatePrimaryDropdown);
      el.addEventListener('input',  updatePrimaryDropdown);
    });

    root.querySelector('#prf').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = (fd.get('name') || '').trim();
      if(!name){ toast('Enter product name', 'error'); return; }
      const unit1_name = (fd.get('unit1_name') || '').trim();
      if(!unit1_name){ toast('Select a Level 1 unit', 'error'); return; }
      const has2 = l2cb.checked;
      const has3 = l3cb.checked;
      if(has2){
        const n2 = (fd.get('unit2_name') || '').trim();
        const sz2 = Number(fd.get('unit2_size')) || 0;
        if(!n2){ toast('Select a Level 2 unit name', 'error'); return; }
        if(sz2 <= 0){ toast('Level 2 size must be > 0', 'error'); return; }
      }
      if(has3){
        const n3 = (fd.get('unit3_name') || '').trim();
        const sz3 = Number(fd.get('unit3_size')) || 0;
        if(!n3){ toast('Select a Level 3 unit name', 'error'); return; }
        if(sz3 <= 0){ toast('Level 3 size must be > 0', 'error'); return; }
      }
      const data = {
        name, category: fd.get('category') || '',
        unit1_name, price1: Number(fd.get('price1')) || 0,
        unit2_name: has2 ? (fd.get('unit2_name') || '').trim() : null,
        unit2_size: has2 ? (Number(fd.get('unit2_size')) || 0) : null,
        price2:     has2 ? (Number(fd.get('price2')) || 0) : 0,
        unit3_name: has3 ? (fd.get('unit3_name') || '').trim() : null,
        unit3_size: has3 ? (Number(fd.get('unit3_size')) || 0) : null,
        price3:     has3 ? (Number(fd.get('price3')) || 0) : 0,
        stock: Number(fd.get('stock')) || 0,
        cost:  Number(fd.get('cost')) || 0,
        low_stock_alert: Number(fd.get('low_stock_alert')) || 0,
        primary_level: Number(fd.get('primary_level')) || 1
      };
      if(!existing){
        const dup = DB.products.find(x => x.name.toLowerCase() === name.toLowerCase());
        if(dup){
          closeModal();
          const goEdit = confirm('A product named "' + name + '" already exists.\n\nClick OK to edit the existing product.\nClick Cancel to add as a new one anyway.');
          if(goEdit){ openProductForm(dup); return; }
          openProductForm();
          return;
        }
      }
      const btn = root.querySelector('#prf-save');
      btn.disabled = true; btn.textContent = 'Saving...';
      let result;
      if(existing) result = await sb.from('products').update(data).eq('id', existing.id).select().single();
      else         result = await sb.from('products').insert(data).select().single();
      if(result.error){
        toast(result.error.message, 'error');
        btn.disabled = false; btn.textContent = existing ? 'Update' : 'Save';
        return;
      }
      await syncDB();
      toast(existing ? 'Updated' : 'Added', 'success');
      closeModal(); route();
    };
  });
}

function openRestockModal(pId){
  const p = DB.products.find(x => x.id === pId);
  if(!p) return;
  const levels = productLevels(p);
  const options = levels.map(l =>
    `<option value="${l.level}">${esc(l.name)}${l.level > 1 ? ` (1 = ${fmtNum(l.size)} ${esc(p.unit1_name)})` : ''}</option>`
  ).join('');
  openModal(`
    <h2 style="font-size:16px;font-weight:600;margin-bottom:12px">Restock - ${esc(p.name)}</h2>
    <div style="background:var(--s50);padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px">
      Current Stock: <b>${fmtNum(p.stock)} ${esc(p.unit1_name)}${Number(p.stock) === 1 ? '' : 's'}</b>
    </div>
    <form id="rsf" style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label class="label">Add in which unit?</label>
        <select class="input" name="level">${options}</select>
      </div>
      <div>
        <label class="label">Quantity to add *</label>
        <input class="input" type="number" step="any" name="qty" required autofocus placeholder="e.g. 5">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="rs-save">Add Stock</button>
      </div>
    </form>`, root => {
    root.querySelector('#rsf').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const lvl = Number(fd.get('level')) || 1;
      const qty = Number(fd.get('qty')) || 0;
      if(qty <= 0){ toast('Quantity must be > 0', 'error'); return; }
      const lvlObj = levels.find(l => l.level === lvl) || levels[0];
      const addedBase = qty * Number(lvlObj.size || 1);
      const newStock = (Number(p.stock) || 0) + addedBase;
      const btn = root.querySelector('#rs-save');
      btn.disabled = true; btn.textContent = 'Updating...';
      const { error } = await sb.from('products').update({ stock: newStock }).eq('id', p.id);
      if(error){ toast(error.message, 'error'); btn.disabled = false; btn.textContent = 'Add Stock'; return; }
      await syncDB();
      toast('Stock added', 'success');
      closeModal(); route();
    };
  });
}

   INVOICES — LIST
   ============================================================ */
function renderInvoices(content){
  const list = DB.invoices;
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head">
        <h1 style="font-size:22px;font-weight:700">Invoices</h1>
        <div class="page-actions">
          <a href="#/invoice/new" class="btn btn-primary">+ New Invoice</a>
          ${reportButtonsHTML('inv')}
        </div>
      </div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div style="flex:2;min-width:200px">
          <label class="label">Search</label>
          <input class="input" id="inv-search" placeholder="Invoice no or buyer...">
        </div>
        <div style="flex:1;min-width:150px">
          <label class="label">Type</label>
          <select class="input" id="inv-type">
            <option value="">All</option>
            <option value="customer">Customers only</option>
            <option value="retailer">Retailers only</option>
          </select>
        </div>
        <div style="flex:1;min-width:150px">
          <label class="label">Sort</label>
          <select class="input" id="inv-sort">
            <option value="date-desc">Newest first</option>
            <option value="date">Oldest first</option>
            <option value="due-desc">Due (high)</option>
            <option value="total-desc">Total (high)</option>
          </select>
        </div>
        <div style="flex:0 0 auto">
          <label class="label">&nbsp;</label>
          <select class="input" id="inv-filter">
            <option value="">All</option>
            <option value="due">With due</option>
            <option value="paid">Fully paid</option>
          </select>
        </div>
      </div>
      <div id="inv-count" style="font-size:12px;color:var(--s500);padding:0 4px"></div>
      <div class="card" style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Invoice</th><th>Buyer</th><th>Type</th><th>Date</th>
            <th style="text-align:right">Total</th>
            <th style="text-align:right">Paid</th>
            <th style="text-align:right">Due</th>
            <th></th>
          </tr></thead>
          <tbody id="inv-body"></tbody>
        </table>
      </div>
    </div>`;

  function filtered(){
    const q      = ($('#inv-search').value || '').toLowerCase().trim();
    const ty     = $('#inv-type').value;
    const sortBy = $('#inv-sort').value;
    const flt    = $('#inv-filter').value;
    let arr = list.filter(i => {
      const isRet = i.buyer_type === 'retailer';
      const b = isRet ? DB.retailers.find(x => x.id === i.retailer_id)
                      : DB.customers.find(x => x.id === i.customer_id);
      const hay = (i.invoice_no + ' ' + (b?.name || '') + ' ' + (b?.phone || '')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      if(ty && i.buyer_type !== ty) return false;
      if(flt === 'due'  && !(Number(i.due) > 0)) return false;
      if(flt === 'paid' && Number(i.due) > 0)     return false;
      return true;
    });
    if(sortBy === 'date-desc')       arr.sort((a,b) => txDate(b,'invoice_date').localeCompare(txDate(a,'invoice_date')));
    else if(sortBy === 'date')       arr.sort((a,b) => txDate(a,'invoice_date').localeCompare(txDate(b,'invoice_date')));
    else if(sortBy === 'due-desc')   arr.sort((a,b) => Number(b.due)   - Number(a.due));
    else if(sortBy === 'total-desc') arr.sort((a,b) => Number(b.total) - Number(a.total));
    return arr;
  }
  function renderTable(){
    const arr = filtered();
    $('#inv-count').textContent = arr.length + ' of ' + list.length + ' invoices';
    $('#inv-body').innerHTML = arr.length === 0
      ? '<tr><td colspan="8" style="text-align:center;padding:40px"><div style="font-size:40px">&#128196;</div><p style="color:var(--s500);margin:8px 0">No invoices</p><a href="#/invoice/new" class="btn btn-primary">+ New Invoice</a></td></tr>'
      : arr.map(i => {
          const isRet = i.buyer_type === 'retailer';
          const b = isRet ? DB.retailers.find(x => x.id === i.retailer_id)
                          : DB.customers.find(x => x.id === i.customer_id);
          const tag = isRet
            ? '<span class="badge badge-warn">Retailer</span>'
            : '<span class="badge badge-info">Customer</span>';
          return `<tr>
            <td><a href="#/invoice/${i.id}" style="font-weight:500">${i.invoice_no}</a></td>
            <td>${esc(b?.name || 'Walk-in')}</td>
            <td>${tag}</td>
            <td>${txDT(i,'invoice_date')}</td>
            <td style="text-align:right">${rs(i.total)}</td>
            <td style="text-align:right;color:var(--profit)">${rs(i.paid)}</td>
            <td style="text-align:right;color:${Number(i.due) > 0 ? 'var(--loss)' : 'var(--s400)'};font-weight:${Number(i.due) > 0 ? '600' : '400'}">${rs(i.due)}</td>
            <td style="text-align:right">
              <button class="btn btn-ghost btn-sm" data-del-inv="${i.id}" style="color:var(--loss)">Del</button>
            </td>
          </tr>`;
        }).join('');
    $$('[data-del-inv]').forEach(btn => btn.onclick = async () => {
      const inv = DB.invoices.find(x => x.id === btn.dataset.delInv);
      if(!inv) return;
      if(!confirmDlg('Delete invoice ' + inv.invoice_no + ' for Rs.' + inr(inv.total) + '?\n\nStock will be restored.', 'Confirm Delete')) return;
      const items = DB.invoice_items.filter(x => x.invoice_id === inv.id);
      for(const it of items){
        const p = DB.products.find(x => x.id === it.product_id);
        if(p){
          const back = lineDeductBaseQty(it);
          await sb.from('products').update({ stock: Number(p.stock) + back }).eq('id', p.id);
        }
      }
      await sb.from('invoices').delete().eq('id', inv.id);
      await syncDB();
      toast('Invoice deleted', 'success');
      renderTable();
    });
  }
  ['inv-search','inv-type','inv-sort','inv-filter'].forEach(id => {
    const el = $('#' + id);
    el.oninput  = renderTable;
    el.onchange = renderTable;
  });
  renderTable();

  const total = list.reduce((s,i) => s + Number(i.total||0), 0);
  const paid  = list.reduce((s,i) => s + Number(i.paid||0),  0);
  const due   = list.reduce((s,i) => s + Number(i.due||0),   0);
  const kpis = [['Total Invoices', list.length], ['Total Sales', rs(total)], ['Total Paid', rs(paid)], ['Total Due', rs(due)]];
  const tables = [{ head:['Invoice','Buyer','Type','Date','Total','Paid','Due'],
    rows: list.map(i => {
      const isRet = i.buyer_type === 'retailer';
      const b = isRet ? DB.retailers.find(x => x.id === i.retailer_id)
                      : DB.customers.find(x => x.id === i.customer_id);
      return [i.invoice_no, b?.name || '-', isRet ? 'Retailer' : 'Customer', txDT(i,'invoice_date'), rs(i.total), rs(i.paid), rs(i.due)];
    }) }];
  bindReport('inv', 'Invoice Register', kpis, tables);
}

  content.innerHTML = `

          <label class="label">Invoice for *</label>

            <button type="button" class="btn btn-ghost" data-bt="retailer" style="flex:1;justify-content:center">&#127978; Retailer</button>
          </div>
          <p id="bt-hint" style="font-size:11px;color:var(--s500);margin-top:6px">

          </p>
        </div>

        </div>

          <label class="label">Add item</label>
          ${searchSelectHTML('nv-prod-ss','Type product name...')}
        </div>
        <div id="nv-lines"></div>
        <div class="grid-3">
          <div><label class="label">Discount (Rs.)</label><input class="input" type="number" step="0.01" id="nv-disc" value="0"></div>
          <div><label class="label">Paid now (Rs.)</label><input class="input" type="number" step="0.01" id="nv-paid" value="0"></div>
          <div><label class="label">Notes</label><input class="input" id="nv-notes"></div>
        </div>
        <div id="nv-summary" style="background:var(--s50);padding:12px;border-radius:12px;display:flex;justify-content:space-between;font-size:13px;font-weight:500;flex-wrap:wrap;gap:8px"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">
          <a href="#/invoices" class="btn btn-ghost">Cancel</a>
          <button id="nv-save-print" class="btn btn-ghost">Save &amp; Print</button>
          <button id="nv-save" class="btn btn-primary">Save Invoice</button>
        </div>
      </div>
    </div>`;

  const buyerSS = $('#nv-buyer-ss');
  const prodSS  = $('#nv-prod-ss');

  function buildBuyerSS(){
    if(buyerType === 'customer'){
      mountSearchSelect(buyerSS, {
        items: DB.customers.map(customerToOption),
        allowAdd: true,
        onAdd: () => openBuyerFormModal('customer', null)
      });
    } else {
      mountSearchSelect(buyerSS, {
        items: DB.retailers.map(retailerToOption),
        allowAdd: true,
        onAdd: () => openBuyerFormModal('retailer', null)
      });
    }
  }
  buildBuyerSS();

  $$('#buyer-type-toggle [data-bt]').forEach(btn => btn.onclick = () => {
    buyerType = btn.dataset.bt;
    $$('#buyer-type-toggle [data-bt]').forEach(b => {
      const on = b.dataset.bt === buyerType;
      b.classList.toggle('btn-primary', on);
      b.classList.toggle('btn-ghost', !on);
    });
    $('#buyer-label').textContent = buyerType === 'customer' ? 'Customer' : 'Retailer';

    lines.push({
      product_id:p.id,
      product_name:p.name,
      unit_level: lvl.level,
      unit_name:  lvl.name,
      unit_size:  lvl.size,
      qty:  1,
      price: Number(lvl.price) || 0,
      total: Number(lvl.price) || 0
    });
    renderLines();
  }

  function renderLines(){
    const box = $('#nv-lines');
    if(lines.length === 0){
      box.innerHTML = '<p style="color:var(--s400);font-size:13px">No items added yet</p>';
    } else {
      box.innerHTML = `<div style="overflow-x:auto"><table>
        <thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Price</th><th style="text-align:right">Total</th><th></th></tr></thead>
        <tbody>${lines.map((l, i) => {
          const p = DB.products.find(x => x.id === l.product_id);
          const levels = productLevels(p);
          const allowed = buyerType === 'customer' ? levels.filter(x => x.level === 1) : levels;
          const unitCell = allowed.length > 1
            ? `<select class="input" data-i="${i}" data-f="unit" style="width:170px;padding:4px 6px">
                ${allowed.map(x => `<option value="${x.level}" ${l.unit_level === x.level ? 'selected' : ''}>${esc(x.name)}${x.level > 1 ? ` (${fmtNum(x.size)} ${esc(p.unit1_name)})` : ''}</option>`).join('')}
              </select>`
            : `<span style="font-size:12px;color:var(--s600)">${esc(l.unit_name)}</span>`;
          return `<tr>
            <td>${esc(l.product_name)}</td>
            <td><input class="input" type="number" step="0.01" data-i="${i}" data-f="qty" value="${l.qty}" style="width:70px;padding:4px 8px"></td>
            <td>${unitCell}</td>
            <td><input class="input" type="number" step="0.01" data-i="${i}" data-f="price" value="${l.price}" style="width:90px;padding:4px 8px"></td>
            <td style="text-align:right">${rs(l.total)}</td>
            <td><button class="btn btn-ghost btn-sm" data-del="${i}" style="color:var(--loss)">X</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`;
      $$('input[data-i]', box).forEach(inp => inp.oninput = e => {
        const i = +e.target.dataset.i, f = e.target.dataset.f;
        lines[i][f] = Number(e.target.value);
        lines[i].total = lines[i].qty * lines[i].price;
        renderLines();
      });
      $$('select[data-i]', box).forEach(sel => sel.onchange = e => {
        const i = +e.target.dataset.i;
        const p = DB.products.find(x => x.id === lines[i].product_id);
        const levels = productLevels(p);
        const lvl = levels.find(x => x.level === Number(e.target.value));
        lines[i].unit_level = lvl.level;
        lines[i].unit_name  = lvl.name;
        lines[i].unit_size  = lvl.size;
        lines[i].price = Number(lvl.price) || 0;
        lines[i].total = lines[i].qty * lines[i].price;
        renderLines();
      });
      $$('[data-del]', box).forEach(b => b.onclick = () => {
        lines.splice(+b.dataset.del, 1);
        renderLines();
      });
    }
    updateSummary();
  }

  function updateSummary(){
    const sub = lines.reduce((s,l) => s + l.total, 0);
    const d = Number($('#nv-disc').value) || 0;
    const tt = Math.max(0, sub - d);
    const pp = Number($('#nv-paid').value) || 0;
    const dd = Math.max(0, tt - pp);
    $('#nv-summary').innerHTML = `
      <div>Subtotal: ${rs(sub)}</div>
      <div style="font-weight:700">Total: ${rs(tt)}</div>
      <div style="color:var(--loss)">Due: ${rs(dd)}</div>`;
  }
  $('#nv-disc').oninput = updateSummary;
  $('#nv-paid').oninput = updateSummary;
  renderLines();

  async function saveInvoice(){
    if(lines.length === 0){ toast('Add at least one item', 'error'); return null; }
    const sc = checkStock(lines);
    if(!sc.ok){
      toast('Not enough stock: ' + sc.productName + ' - need ' + fmtNum(sc.need) + ' ' + sc.unit, 'error');
      return null;
    }
    const dEl = document.querySelector('#content input[name="tx_date"]');
    const tEl = document.querySelector('#content input[name="tx_time"]');
    const dv = dEl ? dEl.value : '';
    const tv = (tEl && tEl.value ? tEl.value : '').trim();
    if(!dv){ toast('Pick a date', 'error'); return null; }
    if(isFuture(dv)){ toast('Future dates not allowed', 'error'); return null; }
    const buyerId = buyerSS.getValue() || null;
    const disc = Number($('#nv-disc').value) || 0;
    const paid = Number($('#nv-paid').value) || 0;
    const notes = $('#nv-notes').value;
    const subtotal = lines.reduce((s,l) => s + l.total, 0);
    const total = Math.max(0, subtotal - disc);
    const due = Math.max(0, total - paid);
    const no = nextInvoiceNo();
    const invData = {
      invoice_no: no,
      buyer_type: buyerType,
      customer_id: buyerType === 'customer' ? buyerId : null,
      retailer_id: buyerType === 'retailer' ? buyerId : null,
      subtotal, discount: disc, total, paid, due, notes,
      invoice_date: dv, tx_time: tv
    };
    const { data: inv, error: invErr } = await sb.from('invoices').insert(invData).select().single();
    if(invErr){ toast(invErr.message, 'error'); return null; }
    const itemRows = lines.map(l => ({
      invoice_id: inv.id,
      product_id: l.product_id,
      product_name: l.product_name,
      unit_level: l.unit_level,
      unit_name: l.unit_name,
      unit_size: l.unit_size,
      qty: l.qty, price: l.price, total: l.total
    }));
    await sb.from('invoice_items').insert(itemRows);
    for(const l of lines){
      const p = DB.products.find(x => x.id === l.product_id);
      if(p){
        const ded = lineDeductBaseQty(l);
        await sb.from('products').update({ stock: Number(p.stock) - ded }).eq('id', p.id);
      }
    }
    await syncDB();
    return inv;
  }

  $('#nv-save').onclick = async () => {
    const btn = $('#nv-save');
    btn.disabled = true; btn.textContent = 'Saving...';
    const inv = await saveInvoice();
    btn.disabled = false; btn.textContent = 'Save Invoice';
    if(inv){ toast('Invoice saved', 'success'); location.hash = '#/invoice/' + inv.id; }
  };
  $('#nv-save-print').onclick = async () => {
    const btn = $('#nv-save-print');
    btn.disabled = true; btn.textContent = 'Saving...';
    const inv = await saveInvoice();
    btn.disabled = false; btn.textContent = 'Save & Print';
    if(!inv) return;
    const items = DB.invoice_items.filter(i => i.invoice_id === inv.id);
    const buyer = inv.buyer_type === 'retailer'
      ? DB.retailers.find(r => r.id === inv.retailer_id)
      : DB.customers.find(c => c.id === inv.customer_id);
    const kpis = [
      ['Invoice', inv.invoice_no],
      ['Date', txDT(inv,'invoice_date')],
      ['Buyer', buyer?.name || 'Walk-in'],
      ['Total', rs(inv.total)],
      ['Paid', rs(inv.paid)],
      ['Due', rs(inv.due)]
    ];
    const tables = [{ head:['Item','Qty','Rate','Amount'],
      rows: items.map(i => [lineLabel(i), fmtInvQty(i.qty, i.unit_name), rs(i.price), rs(i.total)]) }];
    setTimeout(() => printReport('Invoice ' + inv.invoice_no, kpis, tables), 200);
    location.hash = '#/invoice/' + inv.id;
  };
}

function renderPurchases(content){
  const list = DB.supplier_invoices;
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head">
        <div>
          <h1 style="font-size:22px;font-weight:700">Purchases - All Bills</h1>
