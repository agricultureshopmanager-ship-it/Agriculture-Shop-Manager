<script>
(function(){
  'use strict';

  function injectNav(){
    var nav = document.querySelector('.nav');
    if(nav && !nav.querySelector('a[href="#/pnl"]')){
      var hash = location.hash || '#/';
      var isPnL = hash === '#/pnl';
      var a = document.createElement('a');
      a.href = '#/pnl';
      a.className = isPnL ? 'active' : '';
      a.innerHTML = '&#128185; Profit & Loss';
      var analyticsLink = nav.querySelector('a[href="#/analytics"]');
      var settingsLink = nav.querySelector('a[href="#/settings"]');
      var anchor = analyticsLink ? analyticsLink.nextSibling : (settingsLink || null);
      if(anchor) nav.insertBefore(a, anchor);
      else nav.appendChild(a);
    }
    var mob = document.getElementById('mob-nav');
    if(mob && !mob.querySelector('option[value="#/pnl"]')){
      var o = document.createElement('option');
      o.value = '#/pnl'; o.textContent = 'Profit & Loss';
      mob.appendChild(o);
    }
  }

  function renderPnL(content){
    var today = todayStr();
    var firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);

    content.innerHTML = '<div class="page-head"><h1 style="font-size:22px;font-weight:700">Profit &amp; Loss</h1></div>' +
      '<div class="card" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:end">' +
      '<div><label class="label">From</label><input class="input" type="date" id="pnl-from" value="' + firstOfMonth + '"></div>' +
      '<div><label class="label">To</label><input class="input" type="date" id="pnl-to" value="' + today + '"></div>' +
      '<button class="btn btn-primary" id="pnl-load">Load</button>' +
      '<div style="flex:1"></div>' +
      '<button class="btn btn-ghost btn-sm" id="pnl-today">Today</button>' +
      '<button class="btn btn-ghost btn-sm" id="pnl-month">This Month</button>' +
      '<button class="btn btn-ghost btn-sm" id="pnl-year">This Year</button>' +
      '</div>' +
      '<div class="grid-3" id="pnl-stats" style="margin-bottom:16px"></div>' +
      '<div class="card"><h2 style="font-weight:600;margin-bottom:12px">Product-wise Profit</h2>' +
      '<div style="overflow-x:auto"><table><thead><tr>' +
      '<th>Product</th>' +
      '<th style="text-align:right">Sold Qty</th>' +
      '<th style="text-align:right">Revenue</th>' +
      '<th style="text-align:right">Cost</th>' +
      '<th style="text-align:right">Profit</th>' +
      '<th style="text-align:right">Margin %</th>' +
      '</tr></thead><tbody id="pnl-body"></tbody></table></div></div>';

    function compute(from, to){
      var invs = DB.invoices.filter(function(i){ var d = i.invoice_date; return d >= from && d <= to; });
      var perProduct = {};
      var totalRevenue = 0, totalCost = 0;
      invs.forEach(function(inv){
        var items = DB.invoice_items.filter(function(x){ return x.invoice_id === inv.id; });
        items.forEach(function(it){
          var p = DB.products.find(function(x){ return x.id === it.product_id; });
          var costPerBase = p ? Number(p.cost) || 0 : 0;
          var baseQty = Number(it.qty) * Number(it.unit_size || 1);
          var cost = baseQty * costPerBase;
          var rev = Number(it.total) || 0;
          var key = it.product_id || it.product_name;
          if(!perProduct[key]) perProduct[key] = { name: it.product_name, revenue: 0, cost: 0, qty: 0, unit: (p ? p.unit1_name : '') };
          perProduct[key].revenue += rev;
          perProduct[key].cost += cost;
          perProduct[key].qty += baseQty;
          totalRevenue += rev;
          totalCost += cost;
        });
      });
      var profit = totalRevenue - totalCost;
      var margin = totalRevenue > 0 ? (profit / totalRevenue) * 100 : 0;
      return { perProduct: perProduct, totalRevenue: totalRevenue, totalCost: totalCost, profit: profit, margin: margin, count: invs.length };
    }

    function render(){
      var from = document.getElementById('pnl-from').value;
      var to = document.getElementById('pnl-to').value;
      if(!from || !to){ toast('Pick both dates', 'error'); return; }
      if(from > to){ toast('From cannot be after To', 'error'); return; }
      var r = compute(from, to);
      document.getElementById('pnl-stats').innerHTML =
        '<div class="card"><div style="font-size:11px;color:var(--s500)">Revenue</div>' +
        '<div style="font-size:20px;font-weight:700">' + rs(r.totalRevenue) + '</div>' +
        '<div style="font-size:11px;color:var(--s500);margin-top:2px">' + r.count + ' invoices</div></div>' +
        '<div class="card"><div style="font-size:11px;color:var(--s500)">Cost of Goods</div>' +
        '<div style="font-size:20px;font-weight:700;color:var(--s600)">' + rs(r.totalCost) + '</div></div>' +
        '<div class="card" style="background:' + (r.profit >= 0 ? 'var(--profit-bg)' : 'var(--loss-bg)') + '">' +
        '<div style="font-size:11px;color:var(--s500)">' + (r.profit >= 0 ? 'Profit' : 'Loss') + '</div>' +
        '<div style="font-size:20px;font-weight:700;color:' + (r.profit >= 0 ? 'var(--profit)' : 'var(--loss)') + '">' + rs(Math.abs(r.profit)) + '</div>' +
        '<div style="font-size:11px;color:var(--s500);margin-top:2px">Margin: ' + r.margin.toFixed(1) + '%</div></div>';

      var rows = Object.keys(r.perProduct).map(function(k){ return r.perProduct[k]; })
        .sort(function(a,b){ return (b.revenue - b.cost) - (a.revenue - a.cost); });
      var body = document.getElementById('pnl-body');
      if(rows.length === 0){
        body.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--s500)">No sales in this range</td></tr>';
        return;
      }
      body.innerHTML = rows.map(function(x){
        var p = x.revenue - x.cost;
        var m = x.revenue > 0 ? (p / x.revenue) * 100 : 0;
        return '<tr>' +
          '<td>' + esc(x.name) + '</td>' +
          '<td style="text-align:right">' + fmtNum(x.qty) + ' ' + esc(x.unit || '') + '</td>' +
          '<td style="text-align:right">' + rs(x.revenue) + '</td>' +
          '<td style="text-align:right;color:var(--s600)">' + rs(x.cost) + '</td>' +
          '<td style="text-align:right;font-weight:600;color:' + (p >= 0 ? 'var(--profit)' : 'var(--loss)') + '">' + rs(p) + '</td>' +
          '<td style="text-align:right;color:' + (m >= 0 ? 'var(--profit)' : 'var(--loss)') + '">' + m.toFixed(1) + '%</td>' +
          '</tr>';
      }).join('');
    }

    document.getElementById('pnl-load').onclick = render;
    document.getElementById('pnl-today').onclick = function(){
      document.getElementById('pnl-from').value = today;
      document.getElementById('pnl-to').value = today;
      render();
    };
    document.getElementById('pnl-month').onclick = function(){
      document.getElementById('pnl-from').value = firstOfMonth;
      document.getElementById('pnl-to').value = today;
      render();
    };
    document.getElementById('pnl-year').onclick = function(){
      document.getElementById('pnl-from').value = new Date().getFullYear() + '-01-01';
      document.getElementById('pnl-to').value = today;
      render();
    };

    render();
  }

  // ---- ROUTE HOOK ----
  var _origRoute = window.route;
  if(typeof _origRoute === 'function'){
    window.route = async function(){
      var hash = location.hash || '#/';
      if(typeof SESSION === 'undefined' || !SESSION){
        return _origRoute.apply(this, arguments);
      }
      if(hash === '#/pnl'){
        renderLayout();
        var content = document.getElementById('content');
        renderPnL(content);
        injectNav();
        return;
      }
      var ret = await _origRoute.apply(this, arguments);
      injectNav();
      return ret;
    };
    try{ window.removeEventListener('hashchange', _origRoute); } catch(e){}
    window.addEventListener('hashchange', window.route);
  }

  setInterval(injectNav, 500);
})();
</script>
<!-- ============================================================
     FEATURE 6: SHOP HEALTH
     ============================================================ -->
<script>
(function(){
  'use strict';

  function injectNav(){
    var nav = document.querySelector('.nav');
    if(nav && !nav.querySelector('a[href="#/shop-health"]')){
      var hash = location.hash || '#/';
      var isSh = hash === '#/shop-health';
      var a = document.createElement('a');
      a.href = '#/shop-health';
      a.className = isSh ? 'active' : '';
      a.innerHTML = '&#127973; Shop Health';
      var pnlLink = nav.querySelector('a[href="#/pnl"]');
      var settingsLink = nav.querySelector('a[href="#/settings"]');
      var anchor = pnlLink ? pnlLink.nextSibling : (settingsLink || null);
      if(anchor) nav.insertBefore(a, anchor);
      else nav.appendChild(a);
    }
    var mob = document.getElementById('mob-nav');
    if(mob && !mob.querySelector('option[value="#/shop-health"]')){
      var o = document.createElement('option');
      o.value = '#/shop-health'; o.textContent = 'Shop Health';
      mob.appendChild(o);
    }
  }

  function metricsFor(from, to, withSupDue){
    var invs = DB.invoices.filter(function(i){ var d = i.invoice_date; return d >= from && d <= to; });
    var grossSales = invs.reduce(function(s,i){ return s + Number(i.total||0); }, 0);

    var rets = (DB.returns || []).filter(function(r){ return r.return_date >= from && r.return_date <= to; });
    var totalReturns = rets.reduce(function(s,r){ return s + Number(r.amount||0); }, 0);
    var netSales = grossSales - totalReturns;

    var bills = (DB.supplier_invoices || []).filter(function(b){ return b.bill_date >= from && b.bill_date <= to; });
    var totalPurchases = bills.reduce(function(s,b){ return s + Number(b.total||0); }, 0);

    var exps = (DB.expenses || []).filter(function(e){ return e.expense_date >= from && e.expense_date <= to; });
    var totalExpenses = exps.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);

    var customerDue = DB.customers.reduce(function(s,c){ return s + (window.computeBuyerStats ? computeBuyerStats('customer', c.id).due : 0); }, 0);
    var retailerDue = DB.retailers.reduce(function(s,r){ return s + (window.computeBuyerStats ? computeBuyerStats('retailer', r.id).due : 0); }, 0);

    var supplierDue = 0;
    if(Array.isArray(DB.suppliers)){
      DB.suppliers.forEach(function(s){
        var bills = (DB.supplier_invoices||[]).filter(function(b){ return b.supplier_id === s.id; });
        var pays  = (DB.supplier_payments||[]).filter(function(p){ return p.supplier_id === s.id; });
        var tp = bills.reduce(function(x,b){ return x + Number(b.total||0); }, 0);
        var tpd = bills.reduce(function(x,b){ return x + Number(b.paid||0); }, 0) + pays.reduce(function(x,p){ return x + Number(p.amount||0); }, 0);
        supplierDue += Math.max(0, (Number(s.opening_balance)||0) + tp - tpd);
      });
    }

    var stockValue = DB.products.reduce(function(s,p){ return s + (Number(p.stock||0) * Number(p.cost||0)); }, 0);

    var profit = netSales - totalPurchases + stockValue - totalExpenses;
    if(withSupDue) profit -= supplierDue;
    var margin = netSales > 0 ? (profit / netSales) * 100 : 0;

    return {
      grossSales: grossSales, totalReturns: totalReturns, netSales: netSales,
      totalPurchases: totalPurchases, customerDue: customerDue, retailerDue: retailerDue,
      supplierDue: supplierDue, stockValue: stockValue, totalExpenses: totalExpenses,
      profit: profit, margin: margin, invoiceCount: invs.length
    };
  }

  function renderShopHealth(content){
    var today = todayStr();
    var firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
    var firstOfYear = new Date().getFullYear() + '-01-01';
    var preset = 'all';
    var includeSup = true;

    function rangeFor(p){
      if(p === 'today') return { from: today, to: today };
      if(p === 'month') return { from: firstOfMonth, to: today };
      if(p === 'year') return { from: firstOfYear, to: today };
      return { from: '0000-01-01', to: '9999-12-31' };
    }

    content.innerHTML = '<div class="page-head"><h1 style="font-size:22px;font-weight:700">Shop Health</h1></div>' +
      '<div class="card" style="margin-bottom:16px;display:flex;flex-direction:column;gap:12px">' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap" id="sh-range">' +
      '<button class="btn btn-sm btn-primary sh-r" data-r="all">All Time</button>' +
      '<button class="btn btn-sm btn-ghost sh-r" data-r="today">Today</button>' +
      '<button class="btn btn-sm btn-ghost sh-r" data-r="month">This Month</button>' +
      '<button class="btn btn-sm btn-ghost sh-r" data-r="year">This Year</button>' +
      '</div>' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;border-top:1px solid var(--s100);padding-top:12px">' +
      '<input type="checkbox" id="sh-supdue" checked> Include Supplier Due in Profit' +
      '</label>' +
      '</div>' +
      '<div class="card" id="sh-hero" style="text-align:center;padding:24px;border:2px solid var(--s200);margin-bottom:16px"></div>' +
      '<div style="text-align:center;font-size:12px;color:var(--s500);margin:-8px 0 16px" id="sh-period"></div>' +
      '<div class="grid-3" id="sh-metrics" style="margin-bottom:16px"></div>' +
      '<div class="card" style="font-size:12px;color:var(--s500);line-height:1.7">' +
      '<b style="color:var(--s700)">Profit formula:</b><br>' +
      'Net Sales (Sales - Returns) - Purchases + Stock Value - Expenses<span id="sh-formula-sup"></span><br>' +
      '<span style="font-size:11px;color:var(--s400)">Customer Due, Supplier Due &amp; Stock Value are always live.</span>' +
      '</div>';

    function render(){
      var r = rangeFor(preset);
      var m = metricsFor(r.from, r.to, includeSup);
      var isP = m.profit >= 0;
      var color = isP ? 'var(--profit)' : 'var(--loss)';
      var bg = isP ? 'var(--profit-bg)' : 'var(--loss-bg)';
      var border = isP ? 'var(--profit)' : 'var(--loss)';

      var hero = document.getElementById('sh-hero');
      hero.style.background = bg;
      hero.style.borderColor = border;
      hero.innerHTML =
        '<div style="font-size:11px;font-weight:700;letter-spacing:1.5px;color:' + color + '">' + (isP ? 'IN PROFIT' : 'IN LOSS') + '</div>' +
        '<div style="font-size:38px;font-weight:800;color:' + color + ';margin:8px 0;line-height:1.1">' + rs(Math.abs(m.profit)) + '</div>' +
        '<div style="font-size:14px;color:var(--s600)">Margin: <b style="color:' + color + '">' + m.margin.toFixed(1) + '%</b> &middot; ' + m.invoiceCount + ' invoice' + (m.invoiceCount === 1 ? '' : 's') + '</div>';

      document.getElementById('sh-period').textContent = preset === 'all'
        ? 'Showing: All Time'
        : 'Showing: ' + fmtDate(r.from) + ' to ' + fmtDate(r.to);
      document.getElementById('sh-formula-sup').innerHTML = includeSup ? ' - Supplier Due' : '';

      var cards = [
        { lbl: 'Net Sales',      txt: rs(m.netSales),      col: 'var(--profit)', sub: 'Gross ' + rs(m.grossSales) + ' - Returns ' + rs(m.totalReturns) },
        { lbl: 'Purchases',      txt: rs(m.totalPurchases), col: 'var(--warn)' },
        { lbl: 'Customer Due',   txt: rs(m.customerDue),    col: 'var(--info)' },
        { lbl: 'Retailer Due',   txt: rs(m.retailerDue),    col: 'var(--warn)' },
        { lbl: 'Supplier Due',   txt: rs(m.supplierDue),    col: 'var(--loss)' },
        { lbl: 'Stock Value',    txt: rs(m.stockValue),     col: 'var(--brand-dark)', sub: 'At cost price' },
        { lbl: 'Expenses',       txt: rs(m.totalExpenses),  col: 'var(--loss)' }
      ];

      document.getElementById('sh-metrics').innerHTML = cards.map(function(c){
        return '<div class="card" style="border-left:4px solid ' + c.col + ';padding:12px 14px">' +
          '<div style="font-size:10px;color:var(--s500);font-weight:700;text-transform:uppercase;letter-spacing:0.4px">' + c.lbl + '</div>' +
          '<div style="font-size:19px;font-weight:700;color:' + c.col + ';margin-top:5px">' + c.txt + '</div>' +
          (c.sub ? '<div style="font-size:10px;color:var(--s400);margin-top:3px">' + c.sub + '</div>' : '') +
          '</div>';
      }).join('');
    }

    content.querySelectorAll('.sh-r').forEach(function(b){
      b.onclick = function(){
        preset = b.dataset.r;
        content.querySelectorAll('.sh-r').forEach(function(x){
          var on = x.dataset.r === preset;
          x.classList.toggle('btn-primary', on);
          x.classList.toggle('btn-ghost', !on);
        });
        render();
      };
    });
    document.getElementById('sh-supdue').onchange = function(e){
      includeSup = e.target.checked;
      render();
    };
    render();
  }

  var _origRoute = window.route;
  if(typeof _origRoute === 'function'){
    window.route = async function(){
      var hash = location.hash || '#/';
      if(typeof SESSION === 'undefined' || !SESSION){
        return _origRoute.apply(this, arguments);
      }
      if(hash === '#/shop-health'){
        renderLayout();
        var content = document.getElementById('content');
        renderShopHealth(content);
        injectNav();
        return;
      }
      var ret = await _origRoute.apply(this, arguments);
      injectNav();
      return ret;
    };
    try{ window.removeEventListener('hashchange', _origRoute); } catch(e){}
    window.addEventListener('hashchange', window.route);
  }

  setInterval(injectNav, 500);
})();
</script>
<!-- ============================================================
     FEATURE 7: REPORTS (Print + PDF)
     ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.1/dist/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
  'use strict';

  function hexToRgb(h){
    h = String(h || '#16a34a').replace('#','');
    if(h.length === 3) h = h.split('').map(function(c){ return c+c; }).join('');
    return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
  }

  function rsP(n){ return 'Rs. ' + inr(n); }

  function injectNav(){
    var nav = document.querySelector('.nav');
    if(nav && !nav.querySelector('a[href="#/reports"]')){
      var hash = location.hash || '#/';
      var isRep = hash === '#/reports';
      var a = document.createElement('a');
      a.href = '#/reports';
      a.className = isRep ? 'active' : '';
      a.innerHTML = '&#128203; Reports';
      var shLink = nav.querySelector('a[href="#/shop-health"]');
      var settingsLink = nav.querySelector('a[href="#/settings"]');
      var anchor = shLink ? shLink.nextSibling : (settingsLink || null);
      if(anchor) nav.insertBefore(a, anchor);
      else nav.appendChild(a);
    }
    var mob = document.getElementById('mob-nav');
    if(mob && !mob.querySelector('option[value="#/reports"]')){
      var o = document.createElement('option');
      o.value = '#/reports'; o.textContent = 'Reports';
      mob.appendChild(o);
    }
  }

  function buildReportHTML(title, kpis, tables){
    var logoHtml = SETTINGS.logo
      ? '<img src="' + SETTINGS.logo + '" style="height:64px;object-fit:contain">'
      : '<span style="font-size:48px">&#127806;</span>';
    var primary = (SHOP_CONFIG && SHOP_CONFIG.theme && SHOP_CONFIG.theme.primary) || '#16a34a';
    var body = '';
    if(kpis && kpis.length){
      body += '<div class="kpi">';
      kpis.forEach(function(kv){ body += '<div><div class="lbl">' + esc(kv[0]) + '</div><div class="val">' + esc(kv[1]) + '</div></div>'; });
      body += '</div>';
    }
    (tables||[]).forEach(function(tb){
      if(tb.title) body += '<h2>' + esc(tb.title) + '</h2>';
      if(!tb.rows.length){ body += '<p style="color:#94a3b8">No records</p>'; return; }
      body += '<table><thead><tr>';
      tb.head.forEach(function(h){ body += '<th>' + esc(h) + '</th>'; });
      body += '</tr></thead><tbody>';
      tb.rows.forEach(function(r){
        body += '<tr>';
        r.forEach(function(c){ body += '<td>' + esc(c) + '</td>'; });
        body += '</tr>';
      });
      body += '</tbody></table>';
    });
    return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + esc(title) + '</title><style>' +
      'body{font-family:system-ui,-apple-system,sans-serif;padding:20px;color:#1e293b;font-size:13px;max-width:900px;margin:0 auto}' +
      '.header{display:flex;align-items:center;gap:20px;border-bottom:2px solid ' + primary + ';padding-bottom:14px;margin-bottom:16px}' +
      '.header-info h1{font-size:22px;margin:0 0 4px}' +
      '.header-info div{font-size:12px;color:#475569}' +
      'h2{font-size:15px;color:' + primary + ';margin:18px 0 8px}' +
      'table{width:100%;border-collapse:collapse;margin:8px 0}' +
      'th{background:' + primary + ';color:#fff;text-align:left;padding:7px 9px;font-size:12px}' +
      'td{padding:7px 9px;border-bottom:1px solid #e2e8f0;font-size:12px}' +
      '.kpi{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}' +
      '.kpi>div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;flex:1;min-width:130px}' +
      '.kpi .lbl{font-size:11px;color:#64748b}' +
      '.kpi .val{font-size:17px;font-weight:700;margin-top:3px}' +
      '.footer{margin-top:28px;text-align:center;font-size:11px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:10px}' +
      '.toolbar{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:10}' +
      '.toolbar button{background:' + primary + ';color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:500}' +
      '.toolbar button.close{background:#64748b}' +
      '@media print{.toolbar{display:none}body{padding:0}@page{margin:10mm}}' +
      '</style></head><body>' +
      '<div class="toolbar"><button onclick="window.print()">Print</button><button class="close" onclick="window.close()">Close</button></div>' +
      '<div class="header">' + logoHtml + '<div class="header-info">' +
      '<h1>' + esc(SETTINGS.shop_name || 'Shop') + '</h1>' +
      '<div>' + esc(SETTINGS.owner_name || '') + '</div>' +
      '<div>' + esc(SETTINGS.address || '') + '</div>' +
      (SETTINGS.phone ? '<div>Ph: ' + esc(SETTINGS.phone) + '</div>' : '') +
      (SETTINGS.email ? '<div>' + esc(SETTINGS.email) + '</div>' : '') +
      (SETTINGS.license ? '<div>License: ' + esc(SETTINGS.license) + '</div>' : '') +
      '</div></div>' +
      '<h2 style="margin-top:0">' + esc(title) + '</h2>' + body +
      '<div class="footer">Generated by ' + esc(SETTINGS.shop_name || 'Shop') + ' - ' + new Date().toLocaleString('en-IN') + '</div>' +
      '</body></html>';
  }

  function printReport(title, kpis, tables){
    var w = window.open('', '_blank');
    if(!w){ toast('Popup blocked. Allow popups.', 'error'); return; }
    w.document.write(buildReportHTML(title, kpis, tables));
    w.document.close();
  }

  async function pdfReport(title, kpis, tables){
    if(!window.jspdf){ toast('PDF library loading, try again', 'error'); return; }
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF();
    var y = 12;
    var primary = (SHOP_CONFIG && SHOP_CONFIG.theme && SHOP_CONFIG.theme.primary) || '#16a34a';
    var pc = hexToRgb(primary);

    if(SETTINGS.logo){ try{ doc.addImage(SETTINGS.logo, 'PNG', 14, y, 20, 20); }catch(e){} }
    var x = SETTINGS.logo ? 38 : 14;

    doc.setFontSize(14); doc.setFont('helvetica','bold'); doc.setTextColor(30,41,59);
    doc.text(SETTINGS.shop_name || 'Shop', x, y+6);
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(71,85,105);
    doc.text(SETTINGS.owner_name || '', x, y+11);
    doc.text(SETTINGS.address || '', x, y+15, { maxWidth: 150 });
    var yy = y+19;
    if(SETTINGS.phone){ doc.text('Ph: ' + SETTINGS.phone, x, yy); yy += 4; }
    if(SETTINGS.email){ doc.text(SETTINGS.email, x, yy); yy += 4; }
    if(SETTINGS.license){ doc.text('License: ' + SETTINGS.license, x, yy); }
    y = Math.max(y+26, 38);

    doc.setDrawColor(pc.r, pc.g, pc.b); doc.setLineWidth(0.5);
    doc.line(14, y, 196, y); y += 6;
    doc.setFontSize(12); doc.setFont('helvetica','bold'); doc.setTextColor(pc.r, pc.g, pc.b);
    doc.text(title, 14, y); y += 8;
    doc.setFont('helvetica','normal'); doc.setTextColor(30,41,59);

    if(kpis && kpis.length){
      var colW = (182 - (kpis.length-1)*4) / kpis.length;
      var xk = 14;
      kpis.forEach(function(kv){
        doc.setFillColor(248,250,252);
        doc.roundedRect(xk, y, colW, 16, 2, 2, 'F');
        doc.setFontSize(7); doc.setTextColor(100,116,139);
        doc.text(String(kv[0]), xk+3, y+6);
        doc.setFontSize(11); doc.setTextColor(30,41,59); doc.setFont('helvetica','bold');
        var safeVal = String(kv[1]).replace(/\u20B9/g, 'Rs. ');
        doc.text(safeVal, xk+3, y+13);
        doc.setFont('helvetica','normal');
        xk += colW + 4;
      });
      y += 22;
    }

    (tables||[]).forEach(function(tb){
      if(!tb.rows.length) return;
      if(tb.title){
        doc.setFontSize(11); doc.setTextColor(pc.r, pc.g, pc.b);
        doc.setFont('helvetica','bold'); doc.text(tb.title, 14, y); y += 5;
        doc.setFont('helvetica','normal'); doc.setTextColor(30,41,59);
      }
      var safeBody = tb.rows.map(function(row){
        return row.map(function(cell){ return String(cell).replace(/\u20B9/g, 'Rs. '); });
      });
      doc.autoTable({
        startY: y, head: [tb.head], body: safeBody,
        theme: 'striped',
        headStyles: { fillColor: [pc.r, pc.g, pc.b], textColor: 255, fontSize: 9 },
        bodyStyles: { fontSize: 8 },
        margin: { left: 14, right: 14 }
      });
      y = doc.lastAutoTable.finalY + 8;
      if(y > 270){ doc.addPage(); y = 20; }
    });

    doc.setFontSize(8); doc.setTextColor(148,163,184);
    doc.text('Generated by ' + (SETTINGS.shop_name || 'Shop') + ' - ' + new Date().toLocaleString('en-IN'), 105, 290, { align: 'center' });
    doc.save(title.replace(/\s+/g, '_') + '.pdf');
  }

  function renderReports(content){
    var today = todayStr();
    var firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);

    content.innerHTML = '<div class="page-head"><h1 style="font-size:22px;font-weight:700">Reports</h1></div>' +
      '<div class="card" style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:end">' +
      '<div><label class="label">From</label><input class="input" type="date" id="r-from" value="' + firstOfMonth + '"></div>' +
      '<div><label class="label">To</label><input class="input" type="date" id="r-to" value="' + today + '"></div>' +
      '<button class="btn btn-primary" id="r-load">Load</button>' +
      '<div style="flex:1"></div>' +
      '<button class="btn btn-ghost btn-sm" id="r-week">This Week</button>' +
      '<button class="btn btn-ghost btn-sm" id="r-month">This Month</button>' +
      '<button class="btn btn-ghost btn-sm" id="r-year">This Year</button>' +
      '</div>' +
      '<div class="grid-3" id="r-stats" style="margin-bottom:16px"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">' +
      '<button id="r-sales-pdf" class="btn btn-primary">Sales PDF</button>' +
      '<button id="r-pay-pdf" class="btn btn-ghost">Payments PDF</button>' +
      '<button id="r-pur-pdf" class="btn btn-ghost">Purchase PDF</button>' +
      '<button id="r-all-print" class="btn btn-ghost">Print Full Report</button>' +
      '</div>' +
      '<div class="card" style="overflow-x:auto">' +
      '<h2 style="font-weight:600;margin-bottom:10px">Invoices in range</h2>' +
      '<table><thead><tr>' +
      '<th>Invoice</th><th>Buyer</th><th>Type</th><th>Date</th>' +
      '<th style="text-align:right">Total</th>' +
      '<th style="text-align:right">Paid</th>' +
      '<th style="text-align:right">Due</th>' +
      '</tr></thead><tbody id="r-body"></tbody></table></div>';

    var invs = [], pays = [], purs = [];

    function load(){
      var from = document.getElementById('r-from').value;
      var to = document.getElementById('r-to').value;
      if(!from || !to){ toast('Pick both dates', 'error'); return; }
      if(from > to){ toast('From cannot be after To', 'error'); return; }

      invs = DB.invoices.filter(function(i){ return i.invoice_date >= from && i.invoice_date <= to; });
      pays = DB.payments.filter(function(p){ return p.payment_date >= from && p.payment_date <= to; });
      purs = (DB.supplier_invoices || []).filter(function(s){ return s.bill_date >= from && s.bill_date <= to; });

      var totalSales = invs.reduce(function(s,i){ return s + Number(i.total||0); }, 0);
      var totalPaid  = pays.reduce(function(s,p){ return s + Number(p.amount||0); }, 0) + invs.reduce(function(s,i){ return s + Number(i.paid||0); }, 0);
      var totalDue   = invs.reduce(function(s,i){ return s + Number(i.due||0); }, 0);
      var totalPur   = purs.reduce(function(s,p){ return s + Number(p.total||0); }, 0);

      document.getElementById('r-stats').innerHTML =
        '<div class="card"><div style="font-size:11px;color:var(--s500)">Sales (' + invs.length + ')</div>' +
        '<div style="font-size:20px;font-weight:700">' + rs(totalSales) + '</div></div>' +
        '<div class="card"><div style="font-size:11px;color:var(--s500)">Payments (' + pays.length + ')</div>' +
        '<div style="font-size:20px;font-weight:700;color:var(--profit)">' + rs(totalPaid) + '</div></div>' +
        '<div class="card"><div style="font-size:11px;color:var(--s500)">Due</div>' +
        '<div style="font-size:20px;font-weight:700;color:var(--loss)">' + rs(totalDue) + '</div></div>' +
        '<div class="card"><div style="font-size:11px;color:var(--s500)">Purchases (' + purs.length + ')</div>' +
        '<div style="font-size:20px;font-weight:700;color:var(--warn)">' + rs(totalPur) + '</div></div>';

      var body = document.getElementById('r-body');
      if(!invs.length){
        body.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--s500)">No invoices in this range</td></tr>';
      } else {
        var sorted = invs.slice().sort(function(a,b){ return (b.invoice_date||'').localeCompare(a.invoice_date||''); });
        body.innerHTML = sorted.map(function(i){
          var isRet = i.buyer_type === 'retailer';
          var b = isRet ? DB.retailers.find(function(x){ return x.id === i.retailer_id; }) : DB.customers.find(function(x){ return x.id === i.customer_id; });
          return '<tr>' +
            '<td>' + esc(i.invoice_no) + '</td>' +
            '<td>' + esc(b ? b.name : '-') + '</td>' +
            '<td>' + (isRet ? 'Retailer' : 'Customer') + '</td>' +
            '<td>' + fmtDate(i.invoice_date) + '</td>' +
            '<td style="text-align:right">' + rs(i.total) + '</td>' +
            '<td style="text-align:right;color:var(--profit)">' + rs(i.paid) + '</td>' +
            '<td style="text-align:right;color:var(--loss)">' + rs(i.due) + '</td>' +
            '</tr>';
        }).join('');
      }

      var salesKpis = [['From', from], ['To', to], ['Total Sales', rs(totalSales)], ['Total Paid', rs(totalPaid)], ['Total Due', rs(totalDue)], ['Count', invs.length]];
      var salesTable = [{ head: ['Invoice','Buyer','Type','Date','Total','Paid','Due'],
        rows: invs.map(function(i){
          var isRet = i.buyer_type === 'retailer';
          var b = isRet ? DB.retailers.find(function(x){ return x.id === i.retailer_id; }) : DB.customers.find(function(x){ return x.id === i.customer_id; });
          return [i.invoice_no, b ? b.name : '-', isRet ? 'Retailer' : 'Customer', fmtDate(i.invoice_date), rs(i.total), rs(i.paid), rs(i.due)];
        }) }];

      document.getElementById('r-sales-pdf').onclick = function(){ pdfReport('Sales Report ' + from + ' to ' + to, salesKpis, salesTable); };
      document.getElementById('r-pay-pdf').onclick = function(){
        var kpis = [['From', from], ['To', to], ['Total Paid', rs(pays.reduce(function(s,p){ return s + Number(p.amount||0); }, 0))], ['Count', pays.length]];
        var tbl = [{ head: ['Buyer','Date','Amount','Mode'],
          rows: pays.map(function(p){
            var b = p.buyer_type === 'retailer' ? DB.retailers.find(function(x){ return x.id === p.retailer_id; }) : DB.customers.find(function(x){ return x.id === p.customer_id; });
            return [b ? b.name : '-', fmtDate(p.payment_date), rs(p.amount), p.mode];
          }) }];
        pdfReport('Payment Report ' + from + ' to ' + to, kpis, tbl);
      };
      document.getElementById('r-pur-pdf').onclick = function(){
        var kpis = [['From', from], ['To', to], ['Total Purchase', rs(totalPur)], ['Bills', purs.length]];
        var tbl = [{ head: ['Bill','Supplier','Date','Total','Paid','Balance'],
          rows: purs.map(function(s){
            var sp = DB.suppliers.find(function(x){ return x.id === s.supplier_id; });
            return [s.bill_no || '-', sp ? sp.name : '-', fmtDate(s.bill_date), rs(s.total), rs(s.paid), rs(Number(s.total) - Number(s.paid))];
          }) }];
        pdfReport('Purchase Report ' + from + ' to ' + to, kpis, tbl);
      };
      document.getElementById('r-all-print').onclick = function(){
        var tables = [
          { title: 'Sales (' + invs.length + ')', head: ['Invoice','Buyer','Date','Total','Paid','Due'],
            rows: invs.map(function(i){
              var isRet = i.buyer_type === 'retailer';
              var b = isRet ? DB.retailers.find(function(x){ return x.id === i.retailer_id; }) : DB.customers.find(function(x){ return x.id === i.customer_id; });
              return [i.invoice_no, b ? b.name : '-', fmtDate(i.invoice_date), rs(i.total), rs(i.paid), rs(i.due)];
            }) },
          { title: 'Payments (' + pays.length + ')', head: ['Buyer','Date','Amount','Mode'],
            rows: pays.map(function(p){
              var b = p.buyer_type === 'retailer' ? DB.retailers.find(function(x){ return x.id === p.retailer_id; }) : DB.customers.find(function(x){ return x.id === p.customer_id; });
              return [b ? b.name : '-', fmtDate(p.payment_date), rs(p.amount), p.mode];
            }) },
          { title: 'Purchases (' + purs.length + ')', head: ['Bill','Supplier','Date','Total','Paid'],
            rows: purs.map(function(s){
              var sp = DB.suppliers.find(function(x){ return x.id === s.supplier_id; });
              return [s.bill_no || '-', sp ? sp.name : '-', fmtDate(s.bill_date), rs(s.total), rs(s.paid)];
            }) }
        ];
        printReport('Full Report ' + from + ' to ' + to,
          [['From', from], ['To', to], ['Sales', rs(totalSales)], ['Payments', rs(totalPaid)], ['Due', rs(totalDue)], ['Purchases', rs(totalPur)]],
          tables);
      };
    }

    document.getElementById('r-load').onclick = load;
    document.getElementById('r-week').onclick = function(){
      var d = new Date(); var day = d.getDay() || 7;
      var mon = new Date(d); mon.setDate(d.getDate() - day + 1);
      document.getElementById('r-from').value = mon.toISOString().slice(0,10);
      document.getElementById('r-to').value = today;
      load();
    };
    document.getElementById('r-month').onclick = function(){
      document.getElementById('r-from').value = firstOfMonth;
      document.getElementById('r-to').value = today;
      load();
    };
    document.getElementById('r-year').onclick = function(){
      document.getElementById('r-from').value = new Date().getFullYear() + '-01-01';
      document.getElementById('r-to').value = today;
      load();
    };

    load();
  }

  var _origRoute = window.route;
  if(typeof _origRoute === 'function'){
    window.route = async function(){
      var hash = location.hash || '#/';
      if(typeof SESSION === 'undefined' || !SESSION){
        return _origRoute.apply(this, arguments);
      }
      if(hash === '#/reports'){
        renderLayout();
        var content = document.getElementById('content');
        renderReports(content);
        injectNav();
        return;
      }
      var ret = await _origRoute.apply(this, arguments);
      injectNav();
      return ret;
    };
    try{ window.removeEventListener('hashchange', _origRoute); } catch(e){}
    window.addEventListener('hashchange', window.route);
  }

  setInterval(injectNav, 500);
})();
</script>
<!-- ============================================================
     FEATURE 8: CUSTOMER PORTAL + INVOICE PDF + WHATSAPP + UPI QR
     ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
(function(){
  'use strict';

  // ---- SHARE LINK BUILDER ----
  function shareUrlFor(token){
    if(!token) return '';
    if(location.protocol.indexOf('http') === 0){
      return location.origin + location.pathname + '#/c/' + token;
    }
    return '';
  }

  // ---- UPI / WHATSAPP ----
  function upiLink(amount, note){
    var params = new URLSearchParams({
      pa: SETTINGS.upi || '', pn: SETTINGS.owner_name || '',
      am: Number(amount).toFixed(2), cu: 'INR',
      tn: note || SETTINGS.shop_name || 'Shop'
    });
    return 'upi://pay?' + params.toString();
  }
  function waLink(phone, msg){
    var d = String(phone||'').replace(/\D/g,'');
    var n = d.length === 10 ? '91' + d : d;
    return 'https://wa.me/' + n + '?text=' + encodeURIComponent(msg);
  }
  function dueReminder(name, due, invNo, shareToken){
    var amt = Number(due).toFixed(2);
    var invLine = invNo ? '\nইনভয়েস: ' + invNo : '';
    var shareLine = '';
    var su = shareUrlFor(shareToken);
    if(su) shareLine = '\n\nআপনার সব লেনদেন ও পেমেন্ট দেখতে ক্লিক করুন:\n' + su;
    return 'নমস্কার ' + name + '\n\n' + (SETTINGS.shop_name || 'দোকান') + '-এ আপনার বাকি রয়েছে Rs. ' + amt + '।' + invLine +
      '\n\nUPI: ' + (SETTINGS.upi || '') + '\n\n' + upiLink(due, 'Due from ' + name) + shareLine +
      '\n\nঅনুগ্রহ করে দ্রুত পরিশোধ করুন।\n\nধন্যবাদ।\n' + (SETTINGS.owner_name || '') + '\n' + (SETTINGS.shop_name || '') + '\n' + (SETTINGS.address || '');
  }
  function invoiceMessage(name, invNo, total, due, shareToken){
    var lines = ['নমস্কার ' + name, '', 'আপনার ইনভয়েস: ' + invNo, 'মোট: Rs. ' + Number(total).toFixed(2)];
    if(due > 0){
      lines.push('বাকি: Rs. ' + Number(due).toFixed(2), '', 'UPI: ' + (SETTINGS.upi || ''), upiLink(due, 'Invoice ' + invNo));
    } else {
      lines.push('সম্পূর্ণ পরিশোধিত');
    }
    var su = shareUrlFor(shareToken);
    if(su) lines.push('', 'আপনার সব লেনদেন ও পেমেন্ট দেখতে ক্লিক করুন:', su);
    lines.push('', 'ধন্যবাদ।', SETTINGS.owner_name || '', SETTINGS.shop_name || '');
    return lines.join('\n');
  }

  // ---- INVOICE PDF (58mm receipt-style) ----
  async function invoicePDF(inv, items, buyer){
    if(!window.jspdf){ toast('PDF library loading, try again', 'error'); return; }
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({ unit: 'mm', format: [58, 240] });
    var w = 58, y = 6;

    function hexToRgbLocal(h){
      h = String(h||'#16a34a').replace('#','');
      if(h.length === 3) h = h.split('').map(function(c){ return c+c; }).join('');
      return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
    }
    var pc = hexToRgbLocal((SHOP_CONFIG && SHOP_CONFIG.theme && SHOP_CONFIG.theme.primary) || '#16a34a');

    if(SETTINGS.logo){ var sz = 18; try{ doc.addImage(SETTINGS.logo, 'PNG', (w-sz)/2, y, sz, sz); y += sz+2; }catch(e){} }
    doc.setFontSize(11); doc.setFont('helvetica','bold');
    doc.text(SETTINGS.shop_name || 'Shop', w/2, y, { align: 'center' }); y += 5;
    doc.setFontSize(7); doc.setFont('helvetica','normal');
    doc.text(SETTINGS.owner_name || '', w/2, y, { align: 'center' }); y += 3;
    doc.text(SETTINGS.address || '', w/2, y, { align: 'center', maxWidth: w-6 }); y += 6;
    if(SETTINGS.license){ doc.text('License: ' + SETTINGS.license, w/2, y, { align: 'center' }); y += 5; }
    doc.line(4, y, w-4, y); y += 4;

    doc.setFontSize(8);
    doc.text('Invoice: ' + inv.invoice_no, 4, y); y += 4;
    doc.text('Date: ' + fmtDate(inv.invoice_date), 4, y); y += 4;
    doc.text('Buyer: ' + ((buyer && buyer.name) || 'Walk-in') + (inv.buyer_type === 'retailer' ? ' (R)' : ''), 4, y); y += 6;

    doc.autoTable({
      startY: y,
      head: [['Item','Qty','Rate','Amt']],
      body: items.map(function(i){
        return [i.product_name + ' ' + (i.unit_name||''), String(i.qty), Number(i.price).toFixed(0), Number(i.total).toFixed(0)];
      }),
      theme: 'grid',
      styles: { fontSize: 8, cellPadding: 1.5 },
      headStyles: { fillColor: [pc.r, pc.g, pc.b], textColor: 255, fontSize: 8 },
      margin: { left: 4, right: 4 }
    });
    y = doc.lastAutoTable.finalY + 4;
    doc.setFontSize(8);
    var rsP = function(n){ return 'Rs.' + inr(n); };
    doc.text('Subtotal: ' + rsP(inv.subtotal), w-4, y, { align: 'right' }); y += 4;
    if(Number(inv.discount) > 0){ doc.text('Discount: -' + rsP(inv.discount), w-4, y, { align: 'right' }); y += 4; }
    doc.setFont('helvetica','bold');
    doc.text('Total: ' + rsP(inv.total), w-4, y, { align: 'right' }); y += 4;
    doc.setFont('helvetica','normal');
    doc.text('Paid: ' + rsP(inv.paid), w-4, y, { align: 'right' }); y += 4;
    doc.text('Due: ' + rsP(inv.due), w-4, y, { align: 'right' }); y += 6;

    if(Number(inv.due) > 0 && SETTINGS.upi){
      doc.line(4, y, w-4, y); y += 4;
      doc.setFontSize(8); doc.setFont('helvetica','bold');
      doc.text('Pay via UPI', w/2, y, { align: 'center' }); y += 4;
      doc.setFont('helvetica','normal'); doc.setFontSize(7);
      doc.text('UPI: ' + SETTINGS.upi, w/2, y, { align: 'center' }); y += 3;
      doc.text('Amount: ' + rsP(inv.due), w/2, y, { align: 'center' }); y += 4;
      try{
        var qr = await QRCode.toDataURL(upiLink(inv.due, 'Invoice ' + inv.invoice_no), { margin: 0, width: 200 });
        var qsz = 34;
        doc.addImage(qr, 'PNG', (w-qsz)/2, y, qsz, qsz); y += qsz + 3;
        doc.setFontSize(6);
        doc.text('Scan with any UPI app', w/2, y, { align: 'center' }); y += 4;
      }catch(e){}
    }
    doc.setFontSize(7);
    doc.text('Thank you!', w/2, y, { align: 'center' });
    doc.save(inv.invoice_no + '.pdf');
  }

  // ---- PUBLIC CUSTOMER PORTAL (no login) ----
  async function renderPortal(token){
    var app = document.getElementById('app');
    app.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading...</div></div>';
    try{
      var res = await sb.rpc('get_shared_customer_data', { t: token });
      if(res.error || !res.data){
        app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--s500);flex-direction:column;gap:10px;padding:20px;text-align:center"><div style="font-size:48px">&#128279;</div><div>Link not found or expired</div></div>';
        return;
      }
      var data = res.data;
      var c = data.customer;
      var invs = data.invoices || [];
      var pays = data.payments || [];
      var st = data.settings || {};

      var txs = invs.map(function(i){
        return { date: i.invoice_date, type: 'Invoice', ref: i.invoice_no, amount: Number(i.total), sign: -1 };
      }).concat(pays.map(function(p){
        return { date: p.payment_date, type: 'Payment', ref: p.mode, amount: Number(p.amount), sign: 1 };
      })).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

      var upi = st.upi || '';
      var owner = st.owner_name || 'Shop';

      app.innerHTML = '<div style="min-height:100vh;background:var(--s50);padding:16px">' +
        '<div style="max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px">' +
        '<div class="card" style="text-align:center">' +
        '<div style="display:flex;justify-content:center;margin-bottom:6px">' +
        (st.logo ? '<img src="' + st.logo + '" style="width:56px;height:56px;object-fit:contain">' : '<span style="font-size:48px">&#127806;</span>') +
        '</div>' +
        '<div style="font-size:18px;font-weight:700">' + esc(st.shop_name || 'Shop') + '</div>' +
        (st.address ? '<div style="font-size:11px;color:var(--s500)">' + esc(st.address) + '</div>' : '') +
        (st.license ? '<div style="font-size:11px;color:var(--s500)">License: ' + esc(st.license) + '</div>' : '') +
        '</div>' +
        '<div class="card">' +
        '<div style="font-size:16px;font-weight:600">Hello, ' + esc(c.name) + '</div>' +
        '<div class="grid-3" style="margin-top:12px">' +
        '<div class="mini-stat"><div class="lbl">Total Bought</div><div class="val">' + rs(c.total_bought) + '</div></div>' +
        '<div class="mini-stat"><div class="lbl">Total Paid</div><div class="val" style="color:var(--profit)">' + rs(c.total_paid) + '</div></div>' +
        '<div class="mini-stat"><div class="lbl">Due</div><div class="val" style="color:var(--loss)">' + rs(c.due) + '</div></div>' +
        '</div></div>' +
        (Number(c.due) > 0 && upi ? '<div class="card" style="text-align:center">' +
          '<div style="font-weight:600;margin-bottom:8px">Pay via UPI</div>' +
          '<div style="font-size:13px;color:var(--s500);margin-bottom:6px">' + esc(upi) + '</div>' +
          '<div id="portal-qr" style="display:inline-block;padding:6px;background:#fff;border:1px solid var(--s200);border-radius:8px"></div>' +
          '<div style="font-size:11px;color:var(--s400);margin-top:6px">Scan with any UPI app</div>' +
          '</div>' : '') +
        '<div class="card">' +
        '<h2 style="font-weight:600;margin-bottom:10px">Your transactions</h2>' +
        (txs.length === 0 ? '<p style="color:var(--s400);font-size:13px">No transactions yet</p>' :
          txs.map(function(t){
            return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--s100);font-size:13px">' +
              '<div><div style="font-weight:500">' + t.type + ' - ' + esc(t.ref) + '</div>' +
              '<div style="font-size:11px;color:var(--s500)">' + fmtDate(t.date) + '</div></div>' +
              '<div style="font-weight:500;color:' + (t.sign < 0 ? 'var(--s800)' : 'var(--profit)') + '">' + (t.sign < 0 ? '-' : '+') + rs(t.amount) + '</div>' +
              '</div>';
          }).join('')) +
        '</div>' +
        '<p style="text-align:center;font-size:11px;color:var(--s400)">Thank you</p>' +
        '</div></div>';

      if(Number(c.due) > 0 && upi){
        try{
          var link = 'upi://pay?' + new URLSearchParams({
            pa: upi, pn: owner, am: Number(c.due).toFixed(2), cu: 'INR', tn: 'Payment from ' + c.name
          }).toString();
          var url = await QRCode.toDataURL(link, { margin: 1, width: 160 });
          document.getElementById('portal-qr').innerHTML = '<img src="' + url + '" style="width:140px;height:140px;display:block">';
        }catch(e){}
      }
    }catch(err){
      app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--s500);padding:20px">Error: ' + esc(err.message) + '</div>';
    }
  }

  // ---- BUTTON INJECTOR (adds Share/PDF/WhatsApp buttons to existing pages) ----
  function injectButtons(){
    var hash = location.hash || '#/';

    // Customer / Retailer profile page   add Share link button
    if(hash.indexOf('#/customer/') === 0 || hash.indexOf('#/retailer/') === 0){
      var isCust = hash.indexOf('#/customer/') === 0;
      var id = hash.slice(isCust ? 11 : 11);
      var list = isCust ? DB.customers : DB.retailers;
      var buyer = list.find(function(x){ return x.id === id; });
      if(buyer){
        var payBtn = document.getElementById('btn-pay');
        if(payBtn && !document.getElementById('btn-share-link')){
          var shareBtn = document.createElement('button');
          shareBtn.id = 'btn-share-link';
          shareBtn.className = 'btn btn-ghost';
          shareBtn.textContent = 'Copy Share Link';
          shareBtn.onclick = function(){
            var url = shareUrlFor(buyer.share_token);
            if(!url){ toast('Save this customer first (needs share token)', 'error'); return; }
            if(navigator.clipboard){ navigator.clipboard.writeText(url); toast('Link copied', 'success'); }
            else prompt('Copy:', url);
          };
          payBtn.parentElement.insertBefore(shareBtn, payBtn);
        }
      }
    }

    // Invoice view   add PDF + WhatsApp buttons
    if(hash.indexOf('#/invoice/') === 0 && hash !== '#/invoice/new'){
      var iid = hash.slice(10);
      var inv = DB.invoices.find(function(x){ return x.id === iid; });
      if(inv){
        var actions = document.querySelector('.page-head');
        // Buttons already added? Check
        if(actions && !document.getElementById('btn-inv-pdf')){
          var bar = document.createElement('div');
          bar.className = 'page-actions';
          bar.style.marginBottom = '10px';
          bar.style.display = 'flex';
          bar.style.gap = '8px';
          bar.style.flexWrap = 'wrap';
          bar.innerHTML =
            '<button id="btn-inv-pdf" class="btn btn-primary">&#128424; PDF</button>' +
            '<button id="btn-inv-wa" class="btn" style="background:var(--profit);color:#fff">WhatsApp</button>';

          // Insert after page-head (or before content)
          var parent = actions.parentNode;
          parent.insertBefore(bar, actions.nextSibling);

          document.getElementById('btn-inv-pdf').onclick = async function(){
            var items = DB.invoice_items.filter(function(x){ return x.invoice_id === inv.id; });
            var isRet = inv.buyer_type === 'retailer';
            var buyer = isRet ? DB.retailers.find(function(x){ return x.id === inv.retailer_id; }) : DB.customers.find(function(x){ return x.id === inv.customer_id; });
            await invoicePDF(inv, items, buyer);
          };
          document.getElementById('btn-inv-wa').onclick = function(){
            var isRet = inv.buyer_type === 'retailer';
            var buyer = isRet ? DB.retailers.find(function(x){ return x.id === inv.retailer_id; }) : DB.customers.find(function(x){ return x.id === inv.customer_id; });
            if(!buyer || !buyer.phone){ toast('No phone number on file', 'error'); return; }
            var msg = invoiceMessage(buyer.name, inv.invoice_no, inv.total, inv.due, buyer.share_token);
            window.open(waLink(buyer.phone, msg), '_blank');
          };
        }
      }
    }

    // Customer profile   add WhatsApp reminder button
    if(hash.indexOf('#/customer/') === 0){
      var cid = hash.slice(11);
      var c = DB.customers.find(function(x){ return x.id === cid; });
      if(c && c.phone && !document.getElementById('btn-wa-reminder')){
        var payBtn2 = document.getElementById('btn-pay');
        if(payBtn2){
          var stats = computeBuyerStats('customer', c.id);
          if(stats.due > 0){
            var waBtn = document.createElement('a');
            waBtn.id = 'btn-wa-reminder';
            waBtn.className = 'btn';
            waBtn.style.background = 'var(--profit)';
            waBtn.style.color = '#fff';
            waBtn.target = '_blank';
            waBtn.textContent = 'WhatsApp Reminder';
            waBtn.href = waLink(c.phone, dueReminder(c.name, stats.due, null, c.share_token));
            payBtn2.parentElement.insertBefore(waBtn, payBtn2);
          }
        }
      }
    }
  }

  // ---- ROUTE HOOK (MUST run before login check) ----
  var _origRoute = window.route;
  if(typeof _origRoute === 'function'){
    window.route = async function(){
      var hash = location.hash || '#/';

      // Public portal — no login required
      if(hash.indexOf('#/c/') === 0){
        await renderPortal(hash.slice(4));
        return;
      }

      var ret = await _origRoute.apply(this, arguments);
      setTimeout(injectButtons, 100);
      return ret;
    };
    try{ window.removeEventListener('hashchange', _origRoute); } catch(e){}
    window.addEventListener('hashchange', window.route);
  }

  // Re-run injection on route changes and after any page renders
  setInterval(injectButtons, 500);

  // Expose helpers globally for other features to use
  window.shareUrlFor = shareUrlFor;
  window.invoicePDF = invoicePDF;
  window.invoiceMessage = invoiceMessage;
  window.dueReminder = dueReminder;
  window.waLink = waLink;
  window.upiLink = upiLink;
})();
</script>
<!-- ============================================================
     FEATURE 9: THERMAL PRINTER (Bluetooth + USB, 58mm)
     Libraries load on-demand — no startup blocking
     ============================================================ -->
<script>
(function(){
  'use strict';

  var libsLoaded = false;
  var libsLoading = null;

  function loadScriptOnce(src){
    return new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = src;
      s.async = true;
      s.onload = resolve;
      s.onerror = function(){ reject(new Error('CDN load failed: ' + src)); };
      document.head.appendChild(s);
    });
  }

  async function ensureLibs(){
    if(libsLoaded) return true;
    if(libsLoading) return libsLoading;
    libsLoading = Promise.all([
      loadScriptOnce('https://cdn.jsdelivr.net/npm/@point-of-sale/receipt-printer-encoder@3.0.2/dist/receipt-printer-encoder.umd.min.js'),
      loadScriptOnce('https://cdn.jsdelivr.net/npm/@point-of-sale/webbluetooth-receipt-printer@2.0.0/dist/webbluetooth-receipt-printer.umd.min.js'),
      loadScriptOnce('https://cdn.jsdelivr.net/npm/escpos-buffer@4.0.5/dist/bundle.umd.js')
    ]).then(function(){
      libsLoaded = true;
      return true;
    }).catch(function(err){
      libsLoading = null;
      throw err;
    });
    return libsLoading;
  }

  function padLine(left, right, width){
    width = width || 32;
    left = String(left); right = String(right);
    if(left.length + right.length > width) left = left.substring(0, width - right.length - 1);
    var spaces = '';
    for(var i = 0; i < Math.max(1, width - left.length - right.length); i++) spaces += ' ';
    return left + spaces + right;
  }

  var btPrinter = null;

  async function printViaBluetooth(inv, items, buyer){
    if(!navigator.bluetooth){ toast('Bluetooth not supported on this browser', 'error'); return; }
    try{ await ensureLibs(); } catch(err){ toast('Cannot load printer library — check internet', 'error'); return; }
    if(typeof ReceiptPrinterEncoder === 'undefined' || typeof WebBluetoothReceiptPrinter === 'undefined'){
      toast('Printer libraries unavailable', 'error'); return;
    }
    try{
      if(!btPrinter){
        btPrinter = new WebBluetoothReceiptPrinter();
        btPrinter.addEventListener('connected', function(device){ console.log('BT connected:', device.name); });
        await btPrinter.connect();
      }
      var encoder = new ReceiptPrinterEncoder({ language: 'esc-pos' });
      encoder.align('center').bold(true).text(SETTINGS.shop_name || 'Shop').newline();
      encoder.bold(false).text(SETTINGS.owner_name || '').newline();
      encoder.text(SETTINGS.address || '').newline();
      if(SETTINGS.phone) encoder.text('Ph: ' + SETTINGS.phone).newline();
      encoder.text('--------------------------------').newline();
      encoder.align('left');
      encoder.text(padLine('Invoice:', inv.invoice_no)).newline();
      encoder.text(padLine('Date:', fmtDate(inv.invoice_date))).newline();
      encoder.text(padLine('Buyer:', (buyer && buyer.name) || 'Walk-in')).newline();
      encoder.text('--------------------------------').newline();
      encoder.text(padLine('Item', 'Amount')).newline();
      encoder.text('--------------------------------').newline();
      for(var i = 0; i < items.length; i++){
        var it = items[i];
        var itemName = it.product_name + ' ' + (it.unit_name || '');
        var qtyPrice = it.qty + ' x ' + Number(it.price).toFixed(2);
        var total = Number(it.total).toFixed(2);
        encoder.text(itemName.substring(0, 32)).newline();
        encoder.text(padLine('  ' + qtyPrice, total)).newline();
      }
      encoder.text('--------------------------------').newline();
      encoder.align('left');
      encoder.text(padLine('Subtotal:', 'Rs.' + inr(inv.subtotal))).newline();
      if(Number(inv.discount) > 0) encoder.text(padLine('Discount:', '-Rs.' + inr(inv.discount))).newline();
      encoder.bold(true).text(padLine('Total:', 'Rs.' + inr(inv.total))).newline();
      encoder.bold(false).text(padLine('Paid:', 'Rs.' + inr(inv.paid))).newline();
      encoder.text(padLine('Due:', 'Rs.' + inr(inv.due))).newline();
      encoder.align('center').newline(1);
      encoder.text('Thank you! Visit again.').newline();
      if(SETTINGS.upi) encoder.text(SETTINGS.upi).newline(2);
      encoder.cut();
      var data = encoder.encode();
      await btPrinter.print(data);
      toast('Receipt sent to printer', 'success');
    } catch(err){
      console.error(err);
      toast('Print failed: ' + err.message, 'error');
      btPrinter = null;
    }
  }

  async function printViaUSB(inv, items, buyer){
    if(!navigator.usb){ toast('USB not supported here', 'error'); return; }
    try{ await ensureLibs(); } catch(err){ toast('Cannot load printer library — check internet', 'error'); return; }
    if(typeof EscposBuffer === 'undefined'){ toast('USB printer library unavailable', 'error'); return; }
    try{
      var device = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x0483 }] });
      var connection = new EscposBuffer.WebUSB(device);
      var printer = await EscposBuffer.Printer.CONNECT('HOP-HL58', connection);
      await printer.setColumns(32);
      await printer.writeln(SETTINGS.shop_name || 'Shop');
      await printer.writeln(SETTINGS.owner_name || '');
      await printer.writeln((SETTINGS.address || '').substring(0, 32));
      if(SETTINGS.phone) await printer.writeln('Ph: ' + SETTINGS.phone);
      await printer.writeln('--------------------------------');
      await printer.writeln(padLine('Invoice:', inv.invoice_no));
      await printer.writeln(padLine('Date:', fmtDate(inv.invoice_date)));
      await printer.writeln(padLine('Buyer:', (buyer && buyer.name) || 'Walk-in'));
      await printer.writeln('--------------------------------');
      await printer.writeln(padLine('Item', 'Amount'));
      await printer.writeln('--------------------------------');
      for(var i = 0; i < items.length; i++){
        var it = items[i];
        var itemName = it.product_name + ' ' + (it.unit_name || '');
        var qtyPrice = it.qty + ' x ' + Number(it.price).toFixed(2);
        var total = Number(it.total).toFixed(2);
        await printer.writeln(itemName.substring(0, 32));
        await printer.writeln(padLine('  ' + qtyPrice, total));
      }
      await printer.writeln('--------------------------------');
      await printer.writeln(padLine('Subtotal:', 'Rs.' + inr(inv.subtotal)));
      if(Number(inv.discount) > 0) await printer.writeln(padLine('Discount:', '-Rs.' + inr(inv.discount)));
      await printer.writeln(padLine('Total:', 'Rs.' + inr(inv.total)));
      await printer.writeln(padLine('Paid:', 'Rs.' + inr(inv.paid)));
      await printer.writeln(padLine('Due:', 'Rs.' + inr(inv.due)));
      await printer.writeln('');
      await printer.writeln('Thank you! Visit again.');
      if(SETTINGS.upi) await printer.writeln(SETTINGS.upi);
      await printer.feed(4);
      await printer.cutter();
      toast('Receipt sent to USB printer', 'success');
    } catch(err){
      console.error(err);
      toast('USB print failed: ' + err.message, 'error');
    }
  }

  function injectPrintButtons(){
    var hash = location.hash || '#/';
    if(hash.indexOf('#/invoice/') !== 0 || hash === '#/invoice/new') return;
    var iid = hash.slice(10);
    var inv = DB.invoices.find(function(x){ return x.id === iid; });
    if(!inv) return;
    if(document.getElementById('btn-thermal')) return;
    var bar = document.querySelector('.page-actions');
    if(!bar) return;
    var btn = document.createElement('button');
    btn.id = 'btn-thermal';
    btn.className = 'btn btn-accent';
    btn.innerHTML = '&#128424; Print Receipt';
    btn.onclick = async function(){
      var items = DB.invoice_items.filter(function(x){ return x.invoice_id === inv.id; });
      var isRet = inv.buyer_type === 'retailer';
      var buyer = isRet ? DB.retailers.find(function(x){ return x.id === inv.retailer_id; }) : DB.customers.find(function(x){ return x.id === inv.customer_id; });
      var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if(isMobile && navigator.bluetooth){
        await printViaBluetooth(inv, items, buyer);
      } else if(!isMobile && navigator.usb){
        await printViaUSB(inv, items, buyer);
      } else {
        window.print();
      }
    };
    bar.appendChild(btn);
  }

  setInterval(injectPrintButtons, 500);

  // Expose globally
  window.printViaBluetooth = printViaBluetooth;
  window.printViaUSB = printViaUSB;
})();
</script>
