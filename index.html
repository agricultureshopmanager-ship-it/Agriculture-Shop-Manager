        </div>
        <div class="page-actions">${reportButtonsHTML('pur')}</div>
      </div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div style="flex:2;min-width:200px">
          <label class="label">Search</label>
          <input class="input" id="pur-search" placeholder="Bill no or supplier name...">
        </div>
        <div style="flex:0 0 auto">
          <label class="label">&nbsp;</label>
          <select class="input" id="pur-filter">
            <option value="">All</option>
            <option value="due">Only with balance</option>
            <option value="paid">Fully paid</option>
          </select>
        </div>
      </div>
      <div class="grid-3" id="pur-stats"></div>
      <div id="pur-count" style="font-size:12px;color:var(--s500);padding:0 4px"></div>
      <div class="card" style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>Bill No</th><th>Supplier</th><th>Date</th>
            <th style="text-align:right">Total</th>
            <th style="text-align:right">Paid</th>
            <th style="text-align:right">Balance</th>
            <th></th>
          </tr></thead>
          <tbody id="pur-body"></tbody>
        </table>
      </div>
    </div>`;
  function filtered(){
    const q = ($('#pur-search').value || '').toLowerCase().trim();
    const flt = $('#pur-filter').value;
    return list.filter(b => {
      const sup = DB.suppliers.find(s => s.id === b.supplier_id);
      const hay = ((b.bill_no || '') + ' ' + (sup?.name || '')).toLowerCase();
      if(q && !hay.includes(q)) return false;
      const bal = Number(b.total) - Number(b.paid);
      if(flt === 'due' && bal <= 0) return false;
      if(flt === 'paid' && bal > 0) return false;
      return true;
    }).sort((a,b) => txDate(b,'bill_date').localeCompare(txDate(a,'bill_date')));
  }
  function renderTable(){
    const arr = filtered();
    $('#pur-count').textContent = arr.length + ' of ' + list.length + ' bills';
    $('#pur-body').innerHTML = arr.length === 0
      ? '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--s500)">No purchases match</td></tr>'
      : arr.map(b => {
          const sup = DB.suppliers.find(s => s.id === b.supplier_id);
          const bal = Number(b.total) - Number(b.paid);
          return `<tr>
            <td>${esc(b.bill_no || '-')}</td>
            <td><a href="#/supplier/${b.supplier_id}" style="font-weight:500">${esc(sup?.name || '-')}</a></td>
            <td>${txDT(b,'bill_date')}</td>
            <td style="text-align:right">${rs(b.total)}</td>
            <td style="text-align:right;color:var(--profit)">${rs(b.paid)}</td>
            <td style="text-align:right;color:${bal > 0 ? 'var(--loss)' : 'var(--s400)'};font-weight:${bal > 0 ? '600' : '400'}">${rs(bal)}</td>
            <td style="text-align:right"><button class="btn btn-ghost btn-sm" data-del-pur="${b.id}" style="color:var(--loss)">Del</button></td>
          </tr>`;
        }).join('');
    $$('[data-del-pur]').forEach(b => b.onclick = async () => {
      const bill = DB.supplier_invoices.find(x => x.id === b.dataset.delPur);
      if(!confirmDlg('Delete bill "' + (bill?.bill_no || '-') + '"?', 'Confirm Delete')) return;
      await sb.from('supplier_invoices').delete().eq('id', b.dataset.delPur);
      await syncDB();
      toast('Deleted', 'success'); renderTable();
    });
  }
  ['pur-search','pur-filter'].forEach(id => {
    const el = $('#' + id);
    el.oninput = renderTable;
    el.onchange = renderTable;
  });
  renderTable();

  const total = list.reduce((s,b) => s + Number(b.total || 0), 0);
  const paid  = list.reduce((s,b) => s + Number(b.paid  || 0), 0) + DB.supplier_payments.reduce((s,p) => s + Number(p.amount || 0), 0);
  const due   = Math.max(0, total - paid);
  $('#pur-stats').innerHTML = `
    <div class="card"><div style="font-size:11px;color:var(--s500)">Total Purchase</div><div style="font-size:18px;font-weight:700">${rs(total)}</div></div>
    <div class="card"><div style="font-size:11px;color:var(--s500)">Total Paid</div><div style="font-size:18px;font-weight:700;color:var(--profit)">${rs(paid)}</div></div>
    <div class="card"><div style="font-size:11px;color:var(--s500)">Total Due</div><div style="font-size:18px;font-weight:700;color:var(--loss)">${rs(due)}</div></div>`;
  const kpis = [['Total Purchase', rs(total)], ['Total Paid', rs(paid)], ['Total Due', rs(due)], ['Total Bills', list.length]];
  const tables = [{ head:['Bill No','Supplier','Date','Total','Paid','Balance'],
    rows: list.map(b => {
      const sup = DB.suppliers.find(s => s.id === b.supplier_id);
      return [b.bill_no || '-', sup?.name || '-', txDT(b,'bill_date'), rs(b.total), rs(b.paid), rs(Number(b.total) - Number(b.paid))];
    }) }];
  bindReport('pur', 'Purchase Register', kpis, tables);
}

        ${!DB.returns.length
          ? '<div style="text-align:center;padding:30px;color:var(--s400)">No returns yet</div>'
          : DB.returns.map(r => {
              const inv = DB.invoices.find(i => i.id === r.invoice_id);
              return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--s100);font-size:13px">
                <div>${esc(r.product_name || '')} x ${r.qty}

                <div style="color:var(--loss);font-weight:500">${rs(r.amount)}</div>
              </div>`;
            }).join('')}
      </div>
    </div>`;
  const invSS = $('#rt-inv-ss');
  mountSearchSelect(invSS, {
    items: DB.invoices.map(invoiceToOption),
    allowAdd: false,
    onSelect: opt => {
      selectedInvoice = opt ? DB.invoices.find(i => i.id === opt.id) : null;
      renderLinePicker();
    }
  });
  function renderLinePicker(){
    const box = $('#rt-lines');
    const fieldsBox = $('#rt-fields');
    const submitBtn = $('#rt-submit');
    if(!selectedInvoice){ box.innerHTML = ''; fieldsBox.style.display = 'none'; submitBtn.disabled = true; return; }
    const items = DB.invoice_items.filter(i => i.invoice_id === selectedInvoice.id);
    if(!items.length){
      box.innerHTML = '<p style="color:var(--s400);font-size:13px">This invoice has no items</p>';
      fieldsBox.style.display = 'none';
      submitBtn.disabled = true;
      return;
    }
    box.innerHTML = `<label class="label">Select item to return</label><table style="font-size:13px">
      <thead><tr><th></th><th>Item</th><th style="text-align:right">Qty</th><th style="text-align:right">Rate</th></tr></thead>
      <tbody>${items.map(it => `<tr>
        <td><input type="radio" name="rt-line" value="${it.id}" data-pid="${it.product_id || ''}" data-name="${esc(it.product_name)}" data-unit="${esc(it.unit_name || '')}" data-price="${it.price}" data-qty="${it.qty}" data-size="${it.unit_size || 1}"></td>
        <td>${esc(lineLabel(it))}</td>
        <td style="text-align:right">${it.qty}</td>
        <td style="text-align:right">Rs.${it.price}</td>
      </tr>`).join('')}</tbody>
    </table>`;
    fieldsBox.style.display = 'flex';
    submitBtn.disabled = false;
    $('#rt-qty').value = 1;
    $('#rt-amt').value = 0;
    $$('input[name="rt-line"]', box).forEach(r => r.onchange = e => {
      const price = Number(e.target.dataset.price) || 0;
      const qty = Number(e.target.dataset.qty) || 1;
      $('#rt-qty').value = 1;
      $('#rt-amt').value = price;
      $('#rt-qty').max = qty;
    });
    $('#rt-qty').oninput = e => {
      const r = document.querySelector('input[name="rt-line"]:checked');
      if(!r) return;
      const price = Number(r.dataset.price) || 0;
      $('#rt-amt').value = (Number(e.target.value) || 0) * price;
    };
  }
  $('#rf').onsubmit = async e => {
    e.preventDefault();
    if(!selectedInvoice){ toast('Select an invoice', 'error'); return; }
    const r = document.querySelector('input[name="rt-line"]:checked');
    if(!r){ toast('Select an item', 'error'); return; }
    const dt = readDateTime(e.target); if(!dt) return;
    const fd = new FormData(e.target);
    const qty = Number(fd.get('qty')) || 0;
    const amount = Number(fd.get('amount')) || 0;
    if(qty <= 0){ toast('Qty must be > 0', 'error'); return; }
    const productId = r.dataset.pid;
    const productName = r.dataset.name;
    const unitName = r.dataset.unit;
    const unitSize = Number(r.dataset.size) || 1;
    const baseQty = qty * unitSize;
    const { error } = await sb.from('returns').insert({
      invoice_id: selectedInvoice.id,
      buyer_type: selectedInvoice.buyer_type,
      customer_id: selectedInvoice.customer_id,
      retailer_id: selectedInvoice.retailer_id,
      product_id: productId,
      product_name: productName,
      unit_name: unitName,
      qty: qty, base_qty: baseQty,
      amount: amount,
      reason: fd.get('reason'),
      return_date: dt.date, tx_time: dt.time
    });
    if(error){ toast(error.message, 'error'); return; }
    const p0 = DB.products.find(x => x.id === productId);
    if(p0){
      await sb.from('products').update({ stock: Number(p0.stock) + baseQty }).eq('id', p0.id);
    }
    await syncDB();
    toast('Return recorded - stock restored', 'success');
    route();
  };
  const kpis = [['Total Returns', DB.returns.length], ['Total Refunded', rs(DB.returns.reduce((s,r) => s + Number(r.amount || 0), 0))]];
  const tables = [{ head:['Date','Invoice','Product','Qty','Refund','Reason'],
    rows: DB.returns.map(r => {
      const inv = DB.invoices.find(i => i.id === r.invoice_id);
      return [txDT(r,'return_date'), inv?.invoice_no || '-', r.product_name || '-', r.qty + (r.unit_name ? ' ' + r.unit_name : ''), rs(r.amount), r.reason || '-'];
    }) }];
  bindReport('ret', 'Returns Report', kpis, tables);
}

    options:{ responsive:true, animation:false, plugins:{ legend:{ position:'bottom' } } }
  }));
  charts.push(new Chart($('#ch2'), {
    type:'bar',
    data:{ labels:Object.values(m).map(x => x.month), datasets:[
      { label:'Sales',    data:Object.values(m).map(x => x.sales),    backgroundColor:'#16a34a' },
      { label:'Purchase', data:Object.values(m).map(x => x.purchase), backgroundColor:'#c79a28' }
    ]},
    options:{ responsive:true, animation:false, plugins:{ legend:{ position:'bottom' } } }
  }));
  charts.push(new Chart($('#ch3'), {
    type:'doughnut',
    data:{ labels:['Paid','Due'], datasets:[{ data:[paidTotal, dueTotal], backgroundColor:['#16a34a','#ef4444'] }] },
    options:{ responsive:true, animation:false, plugins:{ legend:{ position:'bottom' } } }
  }));
  const kpis = [['Total Sales', rs(totalSales)], ['Total Purchase', rs(totalPur)], ['Total Paid', rs(paidTotal)], ['Total Due', rs(dueTotal)]];
  const tables = [{ title:'Monthly Breakdown', head:['Month','Sales','Purchase'], rows: Object.values(m).map(x => [x.month, rs(x.sales), rs(x.purchase)]) }];
  bindReport('an', 'Business Analytics', kpis, tables, ['ch1','ch2','ch3']);
}

/* ============================================================
   PROFIT & LOSS
   ============================================================ */
function renderPnL(content){
  const today = todayStr();
  const firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head"><h1 style="font-size:22px;font-weight:700">Profit &amp; Loss</h1></div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div><label class="label">From</label><input class="input" type="date" id="pnl-from" value="${firstOfMonth}" max="${today}"></div>
        <div><label class="label">To</label><input class="input" type="date" id="pnl-to" value="${today}" max="${today}"></div>
        <div><button class="btn btn-primary" id="pnl-load">Load</button></div>
        <div style="flex:1"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-ghost" id="pnl-today">Today</button>
          <button class="btn btn-ghost" id="pnl-month">This month</button>
          <button class="btn btn-ghost" id="pnl-year">This year</button>
        </div>
      </div>
      <div class="grid-4" id="pnl-stats"></div>
      <div class="card">
        <h2 style="font-weight:600;margin-bottom:12px">Product-wise Profit</h2>
        <div style="overflow-x:auto">
          <table>
            <thead><tr>
              <th>Product</th>
              <th style="text-align:right">Sold Qty</th>
              <th style="text-align:right">Revenue</th>
              <th style="text-align:right">Cost</th>
              <th style="text-align:right">Profit</th>
              <th style="text-align:right">Margin %</th>
            </tr></thead>
            <tbody id="pnl-body"></tbody>
          </table>
        </div>
      </div>
      <div class="card" style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="pnl-print" class="btn btn-ghost">Print</button>
        <button id="pnl-pdf" class="btn btn-primary">PDF</button>
      </div>
    </div>`;
  function compute(from, to){
    const invs = DB.invoices.filter(i => { const d = txDate(i,'invoice_date'); return d >= from && d <= to; });
    const perProduct = {};
    let totalRevenue = 0, totalCost = 0;
    invs.forEach(inv => {
      const items = DB.invoice_items.filter(x => x.invoice_id === inv.id);
      items.forEach(it => {
        const p = DB.products.find(x => x.id === it.product_id);
        const costPerBase = p ? (Number(p.cost) || 0) : 0;
        const baseQty = Number(it.qty) * Number(it.unit_size || 1);
        const cost = baseQty * costPerBase;
        const rev = Number(it.total) || 0;
        const key = it.product_id || it.product_name;
        if(!perProduct[key]) perProduct[key] = { name: it.product_name, revenue:0, cost:0, qty:0, unit: (p ? p.unit1_name : '') };
        perProduct[key].revenue += rev;
        perProduct[key].cost += cost;
        perProduct[key].qty += baseQty;
        totalRevenue += rev;
        totalCost += cost;
      });
    });
    const profit = totalRevenue - totalCost;
    const margin = totalRevenue > 0 ? (profit / totalRevenue) * 100 : 0;
    return { perProduct, totalRevenue, totalCost, profit, margin, count: invs.length };
  }
  function render(){
    const from = $('#pnl-from').value, to = $('#pnl-to').value;
    if(!from || !to){ toast('Pick both dates', 'error'); return; }
    if(from > to){ toast('From cannot be after To', 'error'); return; }
    const r = compute(from, to);
    $('#pnl-stats').innerHTML = `
      <div class="card"><div style="font-size:11px;color:var(--s500)">Revenue</div><div style="font-size:18px;font-weight:700">${rs(r.totalRevenue)}</div><div style="font-size:11px;color:var(--s500);margin-top:2px">${r.count} invoices</div></div>
      <div class="card"><div style="font-size:11px;color:var(--s500)">Cost of Goods</div><div style="font-size:18px;font-weight:700;color:var(--s600)">${rs(r.totalCost)}</div></div>
      <div class="card" style="background:${r.profit >= 0 ? 'var(--profit-bg)' : 'var(--loss-bg)'}"><div style="font-size:11px;color:var(--s500)">${r.profit >= 0 ? 'Profit' : 'Loss'}</div><div style="font-size:18px;font-weight:700;color:${r.profit >= 0 ? 'var(--profit)' : 'var(--loss)'}">${rs(Math.abs(r.profit))}</div></div>
      <div class="card"><div style="font-size:11px;color:var(--s500)">Margin</div><div style="font-size:18px;font-weight:700;color:${r.margin >= 0 ? 'var(--profit)' : 'var(--loss)'}">${r.margin.toFixed(1)}%</div></div>`;
    const rows = Object.values(r.perProduct).sort((a,b) => (b.revenue - b.cost) - (a.revenue - a.cost));
    $('#pnl-body').innerHTML = rows.length === 0
      ? '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--s500)">No sales in this range</td></tr>'
      : rows.map(x => {
          const p = x.revenue - x.cost;
          const m = x.revenue > 0 ? (p / x.revenue) * 100 : 0;
          return `<tr>
            <td>${esc(x.name)}</td>
            <td style="text-align:right">${fmtNum(x.qty)} ${esc(x.unit)}</td>
            <td style="text-align:right">${rs(x.revenue)}</td>
            <td style="text-align:right;color:var(--s600)">${rs(x.cost)}</td>
            <td style="text-align:right;font-weight:600;color:${p >= 0 ? 'var(--profit)' : 'var(--loss)'}">${rs(p)}</td>
            <td style="text-align:right;color:${m >= 0 ? 'var(--profit)' : 'var(--loss)'}">${m.toFixed(1)}%</td>
          </tr>`;
        }).join('');
    const kpis = [['From', from], ['To', to], ['Revenue', rs(r.totalRevenue)], ['Cost', rs(r.totalCost)], [r.profit >= 0 ? 'Profit' : 'Loss', rs(Math.abs(r.profit))], ['Margin', r.margin.toFixed(1) + '%']];
    const tables = [{ title:'Product-wise Profit', head:['Product','Sold Qty','Revenue','Cost','Profit','Margin %'],
      rows: rows.map(x => {
        const p = x.revenue - x.cost;
        const m = x.revenue > 0 ? (p / x.revenue) * 100 : 0;
        return [x.name, fmtNum(x.qty) + ' ' + x.unit, rs(x.revenue), rs(x.cost), rs(p), m.toFixed(1) + '%'];
      }) }];
    const title = 'Profit & Loss ' + from + ' to ' + to;
    $('#pnl-print').onclick = () => printReport(title, kpis, tables);
    $('#pnl-pdf').onclick   = () => pdfReport(title, kpis, tables);
  }
  $('#pnl-today').onclick = () => { $('#pnl-from').value = today; $('#pnl-to').value = today; render(); };
  $('#pnl-month').onclick = () => { $('#pnl-from').value = firstOfMonth; $('#pnl-to').value = today; render(); };
  $('#pnl-year').onclick  = () => { $('#pnl-from').value = new Date().getFullYear() + '-01-01'; $('#pnl-to').value = today; render(); };
  $('#pnl-load').onclick = render;
  render();
}

        <div>
          <h1 style="font-size:22px;font-weight:700">Shop Health</h1>
          <p style="color:var(--s500);font-size:13px">Complete business overview - profit, dues, stock, expenses.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-ghost" id="sh-print">Print</button>
          <button class="btn btn-primary" id="sh-pdf">PDF</button>
        </div>
      </div>
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="sh-range-row">
          <button class="btn btn-sm btn-primary sh-range" data-r="all">All Time</button>
          <button class="btn btn-sm btn-ghost sh-range" data-r="today">Today</button>
          <button class="btn btn-sm btn-ghost sh-range" data-r="month">This Month</button>
          <button class="btn btn-sm btn-ghost sh-range" data-r="year">This Year</button>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--s100);padding-top:12px">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer">
            <input type="checkbox" id="sh-supdue" checked>
            Include Supplier Due in Profit
          </label>
        </div>
      </div>
      <div class="card" id="sh-hero" style="text-align:center;padding:24px;border-width:2px"></div>
      <div style="text-align:center;font-size:12px;color:var(--s500);margin-top:-6px" id="sh-period"></div>
      <div class="grid-3" id="sh-metrics"></div>
      <div class="card" style="font-size:12px;color:var(--s500);line-height:1.7">
        <b style="color:var(--s700)">Profit formula:</b><br>
        Net Sales (Sales - Returns) - Purchases + Stock Value - Expenses<span id="sh-formula-sup"></span><br>
        <span style="font-size:11px;color:var(--s400)">Customer Due, Supplier Due &amp; Stock Value are always live.</span>
      </div>
    </div>`;

  function metrics(from, to, withSupDue){
    const invs = DB.invoices.filter(i => { const d = txDate(i,'invoice_date'); return d >= from && d <= to; });
    const grossSales = invs.reduce((s,i) => s + Number(i.total || 0), 0);
    const rets = DB.returns.filter(r => { const d = txDate(r,'return_date'); return d >= from && d <= to; });
    const totalReturns = rets.reduce((s,r) => s + Number(r.amount || 0), 0);
    const netSales = grossSales - totalReturns;
    const bills = DB.supplier_invoices.filter(b => { const d = txDate(b,'bill_date'); return d >= from && d <= to; });
    const totalPurchases = bills.reduce((s,b) => s + Number(b.total || 0), 0);
    const exps = DB.expenses.filter(e => { const d = txDate(e,'expense_date'); return d >= from && d <= to; });
    const totalExpenses = exps.reduce((s,e) => s + Number(e.amount || 0), 0);
    const customerDue = DB.customers.reduce((s,c) => s + computeBuyerStats('customer', c.id).due, 0);
    const retailerDue = DB.retailers.reduce((s,r) => s + computeBuyerStats('retailer', r.id).due, 0);
    let supplierDue = 0;
    DB.suppliers.forEach(s => { supplierDue += supplierTotals(s.id).total_due; });
    let stockValue = 0;
    DB.products.forEach(p => { stockValue += (Number(p.stock) || 0) * (Number(p.cost) || 0); });
    let profit = netSales - totalPurchases + stockValue - totalExpenses;
    if(withSupDue) profit -= supplierDue;
    const margin = netSales > 0 ? (profit / netSales) * 100 : 0;
    return { grossSales, totalReturns, netSales, totalPurchases, customerDue, retailerDue, supplierDue, stockValue, totalExpenses, profit, margin, invoiceCount: invs.length };
  }

  function rangeFor(preset){
    if(preset === 'today') return { from:today, to:today };
    if(preset === 'month') return { from:firstOfMonth, to:today };
    if(preset === 'year')  return { from:firstOfYear, to:today };
    return { from:'0000-01-01', to:'9999-12-31' };
  }

  function render(){
    const { from, to } = rangeFor(content.dataset.preset || 'all');
    const m = metrics(from, to, includeSupplierDue);
    const isP = m.profit >= 0;
    const color = isP ? 'var(--profit)' : 'var(--loss)';
    const bg    = isP ? 'var(--profit-bg)' : 'var(--loss-bg)';
    const border= isP ? 'var(--profit-border)' : 'var(--loss-border)';
    const hero = content.querySelector('#sh-hero');
    hero.style.background = bg;
    hero.style.borderColor = border;
    hero.innerHTML = `
      <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;color:${color}">${isP ? 'IN PROFIT' : 'IN LOSS'}</div>
      <div style="font-size:38px;font-weight:800;color:${color};margin:8px 0;line-height:1.1">${rs(Math.abs(m.profit))}</div>
      <div style="font-size:14px;color:var(--s600)">Margin: <b style="color:${color}">${m.margin.toFixed(1)}%</b> &nbsp; &middot; &nbsp; ${m.invoiceCount} invoice${m.invoiceCount === 1 ? '' : 's'}</div>`;
    content.querySelector('#sh-period').textContent = (content.dataset.preset === 'all')
      ? 'Showing: All Time'
      : `Showing: ${fmtDate(from)} to ${fmtDate(to)}`;
    content.querySelector('#sh-formula-sup').innerHTML = includeSupplierDue ? ' - Supplier Due' : '';
    const cards = [
      { lbl:'Net Sales',     txt: rs(m.netSales),      col:'var(--profit)', sub:`Gross ${rs(m.grossSales)} - Returns ${rs(m.totalReturns)}` },
      { lbl:'Purchases',     txt: rs(m.totalPurchases), col:'var(--accent)' },
      { lbl:'Customer Due',  txt: rs(m.customerDue),    col:'var(--info)',   live:true },
      { lbl:'Retailer Due',  txt: rs(m.retailerDue),    col:'var(--warn)',   live:true },
      { lbl:'Supplier Due',  txt: rs(m.supplierDue),    col:'var(--loss)',   live:true },
      { lbl:'Stock Value',   txt: rs(m.stockValue),     col:'#7c3aed',       live:true, sub:'At cost price' },
      { lbl:'Expenses',      txt: rs(m.totalExpenses),  col:'#f97316' }
    ];
    content.querySelector('#sh-metrics').innerHTML = cards.map(c => `
      <div class="card" style="border-left:4px solid ${c.col};padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
          <div style="font-size:10px;color:var(--s500);font-weight:700;text-transform:uppercase;letter-spacing:0.4px">${c.lbl}</div>
          ${c.live ? '<span style="font-size:9px;color:var(--s400);font-weight:700">LIVE</span>' : ''}
        </div>
        <div style="font-size:19px;font-weight:700;color:${c.col};margin-top:5px">${c.txt}</div>
        ${c.sub ? `<div style="font-size:10px;color:var(--s400);margin-top:3px">${c.sub}</div>` : ''}
      </div>`).join('');
    const kpis = [
      ['Net Sales', rs(m.netSales)], ['Purchases', rs(m.totalPurchases)],
      ['Customer Due', rs(m.customerDue)], ['Retailer Due', rs(m.retailerDue)],
      ['Supplier Due', rs(m.supplierDue)], ['Stock', rs(m.stockValue)],
      ['Expenses', rs(m.totalExpenses)], [isP ? 'Profit' : 'Loss', rs(Math.abs(m.profit))]
    ];
    const tables = [{ title:'Shop Health Detail', head:['Metric','Value'], rows:[
      ['Gross Sales', rs(m.grossSales)],
      ['Returns',     rs(m.totalReturns)],
      ['Net Sales',   rs(m.netSales)],
      ['Purchases',   rs(m.totalPurchases)],
      ['Customer Due (live)', rs(m.customerDue)],
      ['Retailer Due (live)', rs(m.retailerDue)],
      ['Supplier Due (live)', rs(m.supplierDue)],
      ['Stock Value (cost)',  rs(m.stockValue)],
      ['Expenses',            rs(m.totalExpenses)],
      [isP ? 'PROFIT' : 'LOSS', rs(Math.abs(m.profit))],
      ['Margin %',            m.margin.toFixed(1) + '%']
    ]}];
    content.querySelector('#sh-print').onclick = () => printReport('Shop Health', kpis, tables);
    content.querySelector('#sh-pdf').onclick   = () => pdfReport('Shop Health', kpis, tables);
  }

  content.dataset.preset = 'all';
  content.querySelectorAll('.sh-range').forEach(b => b.onclick = () => {
    content.dataset.preset = b.dataset.r;
    content.querySelectorAll('.sh-range').forEach(x => {
      const on = x.dataset.r === content.dataset.preset;
      x.classList.toggle('btn-primary', on);
      x.classList.toggle('btn-ghost', !on);
    });
    render();
  });
  content.querySelector('#sh-supdue').onchange = e => {
    includeSupplierDue = e.target.checked;
    render();
  };
  render();
}

/* ============================================================
   REPORTS
   ============================================================ */
function renderReports(content){
  const today = todayStr();
  const firstOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
  content.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="page-head"><h1 style="font-size:22px;font-weight:700">Reports</h1></div>
      <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
        <div><label class="label">From</label><input class="input" type="date" id="r-from" value="${firstOfMonth}" max="${today}"></div>
        <div><label class="label">To</label><input class="input" type="date" id="r-to" value="${today}" max="${today}"></div>
        <div><button class="btn btn-primary" id="r-load">Load</button></div>
        <div style="flex:1"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-ghost" id="r-quick-today">Today</button>
          <button class="btn btn-ghost" id="r-quick-week">This week</button>
          <button class="btn btn-ghost" id="r-quick-month">This month</button>
          <button class="btn btn-ghost" id="r-quick-year">This year</button>
        </div>
      </div>
      <div class="grid-4" id="r-stats"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="r-sales" class="btn btn-primary">Sales PDF</button>
        <button id="r-pay"   class="btn btn-ghost">Payments PDF</button>
        <button id="r-pur"   class="btn btn-ghost">Purchase PDF</button>
        <button id="r-all-print" class="btn btn-ghost">Print All</button>
      </div>
      <div class="card" style="overflow-x:auto">
        <h2 style="font-weight:600;margin-bottom:10px">Invoices in range</h2>
        <table>
          <thead><tr>
            <th>Invoice</th><th>Buyer</th><th>Type</th><th>Date</th>
            <th style="text-align:right">Total</th>
            <th style="text-align:right">Paid</th>
            <th style="text-align:right">Due</th>
          </tr></thead>
          <tbody id="r-body"></tbody>
        </table>
      </div>
    </div>`;
  let invs=[], pays=[], purs=[];
  function setRange(from, to){ $('#r-from').value = from; $('#r-to').value = to; load(); }
  $('#r-quick-today').onclick = () => setRange(today, today);
  $('#r-quick-week').onclick = () => {
    const d = new Date();
    const day = d.getDay() || 7;
    const mon = new Date(d);
    mon.setDate(d.getDate() - day + 1);
    setRange(mon.toISOString().slice(0,10), today);
  };
  $('#r-quick-month').onclick = () => setRange(firstOfMonth, today);
  $('#r-quick-year').onclick  = () => setRange(new Date().getFullYear() + '-01-01', today);
  async function load(){
    const from = $('#r-from').value, to = $('#r-to').value;
    if(!from || !to){ toast('Pick both dates', 'error'); return; }
    if(from > to){ toast('From cannot be after To', 'error'); return; }
    invs = DB.invoices.filter(i => { const d = txDate(i,'invoice_date'); return d >= from && d <= to; });
    pays = DB.payments.filter(p => { const d = txDate(p,'payment_date'); return d >= from && d <= to; });
    purs = DB.supplier_invoices.filter(s => { const d = txDate(s,'bill_date'); return d >= from && d <= to; });
    const totalSales = invs.reduce((s,i) => s + Number(i.total || 0), 0);
    const totalPaid  = pays.reduce((s,p) => s + Number(p.amount || 0), 0) + invs.reduce((s,i) => s + Number(i.paid || 0), 0);
    const totalDue   = invs.reduce((s,i) => s + Number(i.due || 0), 0);
    const totalPur   = purs.reduce((s,p) => s + Number(p.total || 0), 0);
    $('#r-stats').innerHTML = `
      <div class="card"><div style="font-size:11px;color:var(--s500)">Sales (${invs.length})</div><div style="font-size:18px;font-weight:700">${rs(totalSales)}</div></div>
      <div class="card"><div style="font-size:11px;color:var(--s500)">Payments (${pays.length})</div><div style="font-size:18px;font-weight:700;color:var(--profit)">${rs(totalPaid)}</div></div>
      <div class="card"><div style="font-size:11px;color:var(--s500)">Due</div><div style="font-size:18px;font-weight:700;color:var(--loss)">${rs(totalDue)}</div></div>
      <div class="card"><div style="font-size:11px;color:var(--s500)">Purchases (${purs.length})</div><div style="font-size:18px;font-weight:700;color:var(--accent)">${rs(totalPur)}</div></div>`;
    $('#r-body').innerHTML = invs.length === 0
      ? '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--s500)">No invoices in this range</td></tr>'
      : invs.sort((a,b) => txDate(b,'invoice_date').localeCompare(txDate(a,'invoice_date'))).map(i => {
          const isRet = i.buyer_type === 'retailer';
          const b = isRet ? DB.retailers.find(x => x.id === i.retailer_id)
                          : DB.customers.find(x => x.id === i.customer_id);
          return `<tr>
            <td>${i.invoice_no}</td>
            <td>${esc(b?.name || '-')}</td>
            <td>${isRet ? 'Retailer' : 'Customer'}</td>
            <td>${txDT(i,'invoice_date')}</td>
            <td style="text-align:right">${rs(i.total)}</td>
            <td style="text-align:right;color:var(--profit)">${rs(i.paid)}</td>
            <td style="text-align:right;color:var(--loss)">${rs(i.due)}</td>
          </tr>`;
        }).join('');
    $('#r-sales').onclick = () => pdfReport('Sales Report ' + from + ' to ' + to,
      [['From',from],['To',to],['Total Sales',rs(totalSales)],['Total Paid',rs(totalPaid)],['Total Due',rs(totalDue)],['Count',invs.length]],
      [{ head:['Invoice','Buyer','Type','Date','Total','Paid','Due'],
        rows: invs.map(i => {
          const isRet = i.buyer_type === 'retailer';
          const b = isRet ? DB.retailers.find(x => x.id === i.retailer_id) : DB.customers.find(x => x.id === i.customer_id);
          return [i.invoice_no, b?.name || '-', isRet ? 'Retailer' : 'Customer', txDT(i,'invoice_date'), rs(i.total), rs(i.paid), rs(i.due)];
        }) }]);
    $('#r-pay').onclick = () => pdfReport('Payment Report ' + from + ' to ' + to,
      [['From',from],['To',to],['Total Paid',rs(pays.reduce((s,p) => s + Number(p.amount), 0))],['Count',pays.length]],
      [{ head:['Buyer','Date','Amount','Mode'],
        rows: pays.map(p => {
          const b = p.buyer_type === 'retailer' ? DB.retailers.find(x => x.id === p.retailer_id) : DB.customers.find(x => x.id === p.customer_id);
          return [b?.name || '-', txDT(p,'payment_date'), rs(p.amount), p.mode];
        }) }]);
    $('#r-pur').onclick = () => pdfReport('Purchase Report ' + from + ' to ' + to,
      [['From',from],['To',to],['Total Purchase',rs(totalPur)],['Bills',purs.length]],
      [{ head:['Bill','Supplier','Date','Total','Paid','Balance'],
        rows: purs.map(s => {
          const sp = DB.suppliers.find(x => x.id === s.supplier_id);
          return [s.bill_no || '-', sp?.name || '-', txDT(s,'bill_date'), rs(s.total), rs(s.paid), rs(Number(s.total) - Number(s.paid))];
        }) }]);
    $('#r-all-print').onclick = () => {
      const tables = [
        { title:'Sales (' + invs.length + ')', head:['Invoice','Buyer','Date','Total','Paid','Due'],
          rows: invs.map(i => {
            const isRet = i.buyer_type === 'retailer';
            const b = isRet ? DB.retailers.find(x => x.id === i.retailer_id) : DB.customers.find(x => x.id === i.customer_id);
            return [i.invoice_no, b?.name || '-', txDT(i,'invoice_date'), rs(i.total), rs(i.paid), rs(i.due)];
          }) },
        { title:'Payments (' + pays.length + ')', head:['Buyer','Date','Amount','Mode'],
          rows: pays.map(p => {
            const b = p.buyer_type === 'retailer' ? DB.retailers.find(x => x.id === p.retailer_id) : DB.customers.find(x => x.id === p.customer_id);
            return [b?.name || '-', txDT(p,'payment_date'), rs(p.amount), p.mode];
          }) },
        { title:'Purchases (' + purs.length + ')', head:['Bill','Supplier','Date','Total','Paid'],
          rows: purs.map(s => {
            const sp = DB.suppliers.find(x => x.id === s.supplier_id);
            return [s.bill_no || '-', sp?.name || '-', txDT(s,'bill_date'), rs(s.total), rs(s.paid)];
          }) }
      ];
      printReport('Full Report ' + from + ' to ' + to,
        [['From',from],['To',to],['Sales',rs(totalSales)],['Payments',rs(totalPaid)],['Due',rs(totalDue)],['Purchases',rs(totalPur)]],
        tables);
    };
  }
  $('#r-load').onclick = load;
  load();
}

          <div><label class="label">Shop name</label><input class="input" name="shop_name" value="${esc(SETTINGS.shop_name)}"></div>
          <div><label class="label">Owner name</label><input class="input" name="owner_name" value="${esc(SETTINGS.owner_name)}"></div>
          <div><label class="label">Address</label><input class="input" name="address" value="${esc(SETTINGS.address)}"></div>
          <div class="grid-2">
            <div><label class="label">Phone</label><input class="input" name="phone" value="${esc(SETTINGS.phone)}"></div>
            <div><label class="label">Email</label><input class="input" type="email" name="email" value="${esc(SETTINGS.email)}"></div>
          </div>
          <div class="grid-2">
            <div><label class="label">License No.</label><input class="input" name="license" value="${esc(SETTINGS.license)}"></div>
            <div><label class="label">UPI ID (for payments)</label><input class="input" name="upi" value="${esc(SETTINGS.upi)}"></div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-primary">Save Changes</button></div>
        </form>
      </div>
      <div class="card">
        <h2 style="font-weight:600;margin-bottom:12px">Backup &amp; Restore</h2>
        <p style="font-size:13px;color:var(--s500);margin-bottom:12px">Download a full JSON backup of all data.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="btn-export" class="btn btn-primary">Download Backup (JSON)</button>
          <input type="file" id="restore-file" accept=".json" style="display:none">
          <button id="btn-restore" class="btn btn-ghost">Restore from Backup</button>
        </div>
      </div>
      <div class="card" style="background:var(--brand-lighter);border-color:var(--brand-light)">
        <div style="font-size:13px;color:var(--brand-dark)"><b>Live:</b> Data is saved to Supabase. Works from any device after login.</div>
      </div>
    </div>`;
  $('#btn-upload').onclick = () => $('#logo-input').click();
  $('#logo-input').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async ev => {
      SETTINGS.logo = ev.target.result;
      await saveSettings();
      applyFavicon();
      toast('Logo updated', 'success');
      route();
    };
    r.readAsDataURL(f);
  };
  const rm = $('#btn-remove-logo');
  if(rm) rm.onclick = async () => {
    if(!confirm('Remove logo?')) return;
    SETTINGS.logo = '';
    await saveSettings();
    applyFavicon();
    toast('Logo removed');
    route();
  };
  $('#shop-form').onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    SETTINGS.shop_name  = fd.get('shop_name');
    SETTINGS.owner_name = fd.get('owner_name');
    SETTINGS.address    = fd.get('address');
    SETTINGS.phone      = fd.get('phone');
    SETTINGS.email      = fd.get('email');
    SETTINGS.license    = fd.get('license');
    SETTINGS.upi        = fd.get('upi');
    const ok = await saveSettings();
    if(ok){ toast('Shop details saved', 'success'); route(); }

      settings: SETTINGS, customers: DB.customers, retailers: DB.retailers,
      products: DB.products, invoices: DB.invoices, invoice_items: DB.invoice_items,
      payments: DB.payments, suppliers: DB.suppliers,
      supplier_invoices: DB.supplier_invoices, supplier_payments: DB.supplier_payments,
      returns: DB.returns, expenses: DB.expenses
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'shop-backup-' + todayStr() + '.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Backup downloaded', 'success');

    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();

      try{
        const data = JSON.parse(ev.target.result);
        if(!data.customers && !data.products && !data.invoices){ toast('Invalid backup file', 'error'); e.target.value = ''; return; }
        if(!confirmDlg('This will ADD all rows from the backup to Supabase.\n\nContinue?', 'Restore Backup')){ e.target.value = ''; return; }
        toast('Restoring... please wait', 'info');
        const tables = ['customers','retailers','products','invoices','invoice_items','payments','suppliers','supplier_invoices','supplier_payments','returns','expenses'];
        for(const tbl of tables){
          if(Array.isArray(data[tbl]) && data[tbl].length){
            const { error } = await sb.from(tbl).insert(data[tbl]);
            if(error) console.warn(tbl, error.message);
          }
        }
        if(data.settings){ SETTINGS = { ...SETTINGS, ...data.settings }; await saveSettings(); }
        await syncDB();
        toast('Backup restored', 'success');
        route();
      }catch(err){ toast('Failed: ' + err.message, 'error'); }
      e.target.value = '';
    };
    r.readAsText(f);
  };
}

(async () => {
  applyFavicon();
  $('#app').innerHTML = '<div class="loading"><div class="spinner"></div><div>Connecting...</div></div>';
  try{
    await initAuth();
    if(SESSION){
      await syncDB();
    }
  }catch(e){ console.error('boot', e); }
  await route();
})();

</script>
